<title>Workstream blueprint</title>

<!--
  FIXED BLUEPRINT SHELL — one per workstream wave, same URL from start to
  finish: discovery creates the file from this shell; each stage fills its
  own key in BLUEPRINT and republishes the SAME file path.

  How to use: copy this file and replace ONLY the `const BLUEPRINT` object
  (between the DATA / END OF DATA markers). Never edit the CSS or the
  render code — the identical shell across workstreams is what lets the
  reader find everything without searching.

  Tab data contracts live with the stage that fills them (each stage skill
  documents its key). Rules: the theme opens by the READER's clock (17h-05h
  dark, light otherwise) and the button toggles the `.dark` class; never
  prefers-color-scheme (the host stamps its theme after this script runs).
  NEVER mermaid: diagrams are HTML/CSS built with this shell's primitives
  (.diagram/.flow/.box/.block/.arrow/.down/.group/.branches), passed as
  strings in the data. Text fields accept inline HTML (<b>, <code>).
-->

<style>
  :root {
    --ground:#F7F6F4; --surface:#FFFFFF; --surface-2:#F1EFEC;
    --line:#E8E5E1; --line-2:#D6D2CD;
    --ink:#1A1917; --ink-2:#5C5852; --ink-3:#94908A;
    --accent:#C14E0E; --band:#FFE3CE; --band-line:#F2C7A4;
    --open-bg:#FFF9F4; --open-line:#F0D6BE;
    --ok:#2F6B4F; --ok-bg:#E4F0E9;
    --warn:#8A6410; --warn-bg:#F8E9C7;
    --bad:#B32B24; --bad-bg:#F7DEDB;
    --code-bg:#F4F2EF;
    --shadow: 0 1px 2px rgba(24,20,18,.04), 0 10px 30px -18px rgba(24,20,18,.16);
    --f-serif: Georgia, "Iowan Old Style", ui-serif, "Times New Roman", serif;
    --f-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --f-mono: ui-monospace, "Geist Mono", "SF Mono", Menlo, monospace;
  }
  :root.dark {
    --ground:#141312; --surface:#1C1B1A; --surface-2:#242220;
    --line:#2F2C29; --line-2:#403C38;
    --ink:#F2F0ED; --ink-2:#A8A39D; --ink-3:#78736D;
    --accent:#FFC49B; --band:#402517; --band-line:#5E3A24;
    --open-bg:#231C16; --open-line:#3D2F22;
    --ok:#7FC0A0; --ok-bg:#16291F;
    --warn:#D9B23D; --warn-bg:#2E2410;
    --bad:#E08279; --bad-bg:#331F1C;
    --code-bg:#151413;
    --shadow: none;
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink);
         font-family:var(--f-sans); font-size:16px; line-height:1.7;
         -webkit-font-smoothing:antialiased; }
  .wrap { max-width:920px; margin:0 auto; padding:0 28px; }
  main.wrap { padding-top:26px; padding-bottom:56px; }
  code { font-family:var(--f-mono); font-size:.92em; background:var(--surface-2);
         padding:1px 5px; border-radius:4px; }
  pre { background:var(--code-bg); border:1px solid var(--line); border-radius:12px;
        padding:14px 17px; margin:4px 0 0; overflow-x:auto; font-family:var(--f-mono);
        font-size:13.5px; line-height:1.75; color:var(--ink-2); }
  pre .c { color:var(--ink-3); font-style:italic; }

  /* ---------- header and navigation ---------- */
  .topbar { background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar .wrap { display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:17px 28px; }
  .brand { font-family:var(--f-serif); font-size:19px; margin-right:auto; }
  .brand .t { color:var(--ink-3); font-size:14.5px; }
  .brand .t::before { content:"  ·  "; }
  .topmeta { font-family:var(--f-mono); font-size:13px; color:var(--ink-3); }
  .themeBtn { appearance:none; cursor:pointer; font-family:inherit; font-size:17px;
             line-height:1; color:var(--ink-2); background:var(--surface-2);
             border:1px solid var(--line); border-radius:999px;
             width:38px; height:38px; display:grid; place-items:center; }
  .themeBtn:hover { color:var(--ink); border-color:var(--line-2); }

  .tabs { background:var(--surface); border-bottom:1px solid var(--line);
          position:sticky; top:0; z-index:20; overflow-x:auto; }
  .tabsinner { display:flex; max-width:920px; margin:0 auto; padding:0 28px; }
  .tab { appearance:none; background:none; border:none; cursor:pointer; font-family:inherit;
         font-size:15.5px; color:var(--ink-2); padding:13px 17px 11px;
         border-bottom:2px solid transparent; white-space:nowrap; }
  .tab:hover:not([disabled]) { color:var(--ink); }
  .tab[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }
  .tab[disabled] { color:var(--ink-3); opacity:.45; cursor:default; }

  .subtabs { background:var(--ground); border-bottom:1px solid var(--line);
             position:sticky; top:49px; z-index:19; overflow-x:auto; }
  .subtabs[hidden] { display:none; }
  .subtabsinner { display:flex; gap:8px; max-width:920px; margin:0 auto; padding:11px 28px; }
  .subtab { appearance:none; border:1px solid transparent; background:none; cursor:pointer;
            font-family:inherit; font-size:14.5px; color:var(--ink-3); white-space:nowrap;
            padding:6px 14px; border-radius:999px; }
  .subtab:hover { color:var(--ink); }
  .subtab[aria-selected="true"] { background:var(--surface); color:var(--ink); font-weight:600;
                                  border-color:var(--line); box-shadow:var(--shadow); }
  .subtab .badge { font-family:var(--f-mono); font-size:12px; margin-left:6px; opacity:.75; }

  main { padding:56px 0 160px; }
  .panel[hidden] { display:none; }
  .empty { color:var(--ink-3); font-size:15px; padding:48px 0; text-align:center; }

  /* ---------- shared blocks ---------- */
  .lede { font-size:18px; line-height:1.6; color:var(--ink-2); max-width:70ch; margin:0 0 8px; }
  section.sec { margin-top:48px; }
  section.sec:first-child { margin-top:0; }
  .sec-t { display:flex; align-items:baseline; gap:12px; margin:0 0 6px; }
  .sec-t h2 { font-family:var(--f-serif); font-size:26px; line-height:1.25;
              font-weight:400; margin:0; letter-spacing:-.01em; }
  .sec-t .n { font-family:var(--f-mono); font-size:13px; color:var(--ink-3); }
  .sec-d { color:var(--ink-3); font-size:15px; line-height:1.6; max-width:80ch; margin:0 0 20px; }
  .list { display:grid; gap:11px; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
          padding:20px 24px 18px; box-shadow:var(--shadow); }
  .card h3 { font-family:var(--f-serif); font-size:20px; line-height:1.3; font-weight:400; margin:0 0 6px; }

  .rule { background:var(--surface); border:1px solid var(--band-line);
           border-left:4px solid var(--accent); border-radius:14px; padding:17px 21px;
           margin:20px 0 0; box-shadow:var(--shadow); }
  .rule > b { font-family:var(--f-serif); font-size:19px; font-weight:400; display:block; margin-bottom:3px; }
  .rule p { margin:0; font-size:15.5px; color:var(--ink-2); line-height:1.65; max-width:80ch; }
  .rule.calm { border-left-color:var(--ok); border-color:var(--line); }

  .table { width:100%; border-collapse:collapse; background:var(--surface);
            border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow); }
  .table th { text-align:left; font-size:13.5px; color:var(--ink-3); font-weight:600;
               padding:12px 18px; border-bottom:1px solid var(--line); }
  .table td { padding:12px 18px; border-bottom:1px solid var(--line);
               font-size:15px; color:var(--ink-2); line-height:1.6; vertical-align:top; }
  .table tr:last-child td { border-bottom:none; }
  .table td.n { color:var(--ink); font-weight:600; width:210px; }
  .table td.num, .table th.num { text-align:right; font-family:var(--f-mono);
               font-variant-numeric:tabular-nums; white-space:nowrap; }
  .table td .obs { display:block; font-size:13.5px; color:var(--ink-3); line-height:1.5; }
  .table tr.total td { background:var(--surface-2); color:var(--ink); font-weight:600; }
  .table .fx { color:var(--accent); }
  .scroll { overflow-x:auto; border-radius:16px; }

  .scoreboard { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:12px; margin-bottom:24px; }
  .pl { background:var(--surface); border:1px solid var(--line); border-radius:16px;
        padding:16px 18px; box-shadow:var(--shadow); display:grid; gap:1px; }
  .pl .v { font-family:var(--f-mono); font-size:24px; font-weight:600; letter-spacing:-.02em; }
  .pl .l { font-size:13.5px; color:var(--ink-2); line-height:1.45; }
  .pl.ok .v { color:var(--ok); } .pl.fix .v { color:var(--warn); }
  .pl.fail .v { color:var(--bad); } .pl.na .v { color:var(--ink-3); }
  .pl.now { background:var(--band); border-color:var(--band-line); }

  .status { font-size:13.5px; font-weight:600; white-space:nowrap; }
  .status::before { content:"● "; }
  .status.ok { color:var(--ok); } .status.warn { color:var(--warn); }
  .status.na { color:var(--ink-3); } .status.bad { color:var(--bad); }

  .kv { display:grid; grid-template-columns:160px 1fr; gap:4px 16px; align-items:baseline; }
  .kv > b { font-size:13.5px; color:var(--ink-3); font-weight:600; }
  .kv > span { font-size:15.5px; color:var(--ink-2); line-height:1.6; max-width:74ch; }
  @media (max-width:640px) { .kv { grid-template-columns:1fr; } }

  /* ---------- HTML diagram primitives (use in data strings) ---------- */
  .diagram { background:var(--surface); border:1px solid var(--line); border-radius:16px;
          padding:28px 26px 22px; box-shadow:var(--shadow); overflow-x:auto; margin-bottom:22px; }
  .flow { display:flex; align-items:center; min-width:620px; }
  .diagram-col { min-width:560px; display:grid; justify-items:stretch; }
  .level { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .box, .block { background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
           padding:11px 16px; display:grid; gap:1px; text-align:center; }
  .box b, .block b { font-size:15.5px; font-weight:600; line-height:1.35; }
  .box i, .block i { font-style:normal; font-size:13.5px; color:var(--ink-3); line-height:1.45; }
  .box.highlight, .block.highlight { background:var(--band); border-color:var(--band-line); }
  .block.mono { font-family:var(--f-mono); font-size:14px; padding:9px 15px; color:var(--ink-2); }
  .block.external { background:none; border-style:dashed; }
  .arrow { position:relative; flex:0 0 96px; height:1px; background:var(--line-2); }
  .arrow span { position:absolute; left:50%; top:-22px; transform:translateX(-50%);
               font-size:12.5px; color:var(--ink-3); white-space:nowrap; }
  .arrow::after { content:""; position:absolute; right:0; top:-3.5px;
                 border-left:7px solid var(--line-2);
                 border-top:4px solid transparent; border-bottom:4px solid transparent; }
  .down { position:relative; height:38px; }
  .down::before { content:""; position:absolute; top:0; bottom:9px; left:50%; width:1px;
                  background:var(--line-2); }
  .down::after { content:""; position:absolute; bottom:1px; left:50%; transform:translateX(-50%);
                 border-top:7px solid var(--line-2);
                 border-left:4.5px solid transparent; border-right:4.5px solid transparent; }
  .down span { position:absolute; top:50%; left:calc(50% + 14px); transform:translateY(-50%);
               font-size:13px; color:var(--ink-3); white-space:nowrap; }
  .group { position:relative; flex:1 1 auto; border:1px dashed var(--line-2);
           border-radius:14px; padding:24px 22px 18px; }
  .group > .label { position:absolute; top:-10px; left:20px; background:var(--surface);
                     padding:0 9px; font-size:12.5px; color:var(--accent); font-weight:600; }
  .group > .label.mono { font-family:var(--f-mono); color:var(--ink-3); }
  .hub { display:flex; align-items:center; }
  .branches { position:relative; display:grid; gap:9px; margin-left:24px; padding-left:24px;
           border-left:1px solid var(--line-2); }
  .branches::before { content:""; position:absolute; left:-24px; top:50%; width:24px; height:1px;
                   background:var(--line-2); }
  .branches > .box, .branches > .block { position:relative; }
  .branches > .box::before, .branches > .block::before { content:""; position:absolute; left:-24px;
                   top:50%; width:24px; height:1px; background:var(--line-2); }
  .group > .obs { margin:16px 0 0; font-size:13.5px; color:var(--ink-3); line-height:1.55; }
  .group > .obs::before { content:"⇢  "; }
  .gateway { background:var(--band); border:1px solid var(--band-line); border-radius:12px;
           padding:14px 18px; display:grid; gap:8px; justify-items:center; }
  .gateway > b { font-family:var(--f-mono); font-size:15px; }
  .gateway > i { font-style:normal; font-size:13.5px; color:var(--ink-2); text-align:center; }
  .gateway .level .block { background:var(--surface); border-color:var(--band-line); }
  .diagram-foot { text-align:center; font-size:13.5px; color:var(--ink-3); margin-top:9px; }

  /* ---------- overview ---------- */
  .steps { display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:16px;
           background:var(--surface); overflow:hidden; box-shadow:var(--shadow); }
  .steps .st { flex:1 1 120px; padding:13px 16px; border-right:1px solid var(--line); display:grid; gap:2px; }
  .steps .st:last-child { border-right:none; }
  .steps .st .sn { font-family:var(--f-mono); font-size:12.5px; color:var(--ink-3); }
  .steps .st .sw { font-size:15px; }
  .steps .st.done .sw { color:var(--ink-3); text-decoration:line-through; }
  .steps .st.now { background:var(--band); }
  .steps .st.now .sw { font-weight:600; }
  .statgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px;
              background:var(--line); border:1px solid var(--line); border-radius:16px;
              overflow:hidden; box-shadow:var(--shadow); }
  .statgrid .cell { background:var(--surface); padding:14px 16px; display:grid; gap:2px; }
  .statgrid .v { font-family:var(--f-mono); font-size:24px; font-weight:600; letter-spacing:-.02em; }
  .statgrid .l { font-size:13px; color:var(--ink-3); }
  .wave { display:grid; grid-template-columns:86px 1fr; gap:14px; align-items:baseline;
          padding:10px 12px; border-top:1px solid var(--line); }
  .wave:first-of-type { border-top:none; }
  .wave > b { font-family:var(--f-mono); font-size:13.5px; color:var(--accent); white-space:nowrap; }
  .wave > div { display:grid; gap:1px; }
  .wave .wn { font-size:15.5px; }
  .wave .ws { font-size:13.5px; color:var(--ink-3); }
  .wave.this { background:var(--band); border-radius:10px; border-top:none; }
  .wave.this > b { font-weight:700; }

  /* ---------- discovery: pr-faq ---------- */
  .split { display:grid; grid-template-columns:250px 1fr; gap:28px; align-items:start; }
  .toc { position:sticky; top:112px; display:grid; gap:14px; }
  .toc .grp { display:grid; gap:2px; }
  .toc .grpname { font-size:12.5px; color:var(--ink-3); font-weight:600;
                  text-transform:uppercase; letter-spacing:.07em; margin-bottom:2px; }
  .toc a { font-size:14px; color:var(--ink-2); text-decoration:none; padding:3px 10px;
           border-left:2px solid var(--line); line-height:1.45; }
  .toc a:hover { color:var(--ink); }
  .toc a.on { color:var(--accent); border-left-color:var(--accent); font-weight:600; }
  .answers { display:grid; gap:12px; }
  .qa { background:var(--surface); border:1px solid var(--line); border-radius:16px;
        padding:18px 22px 16px; box-shadow:var(--shadow); }
  .qa .q { display:flex; gap:12px; align-items:baseline; margin-bottom:6px; }
  .qa .qid { font-family:var(--f-mono); font-size:12.5px; color:var(--accent); }
  .qa .qt { font-family:var(--f-serif); font-size:19px; line-height:1.35; }
  .qa .a { font-size:15.5px; color:var(--ink-2); line-height:1.65; max-width:74ch; }
  .release .kicker { font-family:var(--f-mono); font-size:12.5px; color:var(--ink-3); margin-bottom:8px; }
  .release h3 { font-family:var(--f-serif); font-size:23px; font-weight:400; line-height:1.3; margin:0 0 4px; }
  .release .sub { color:var(--ink-2); font-size:16px; margin:0 0 12px; }
  .release h4 { font-size:13.5px; color:var(--ink-3); font-weight:600;
                text-transform:uppercase; letter-spacing:.06em; margin:14px 0 3px; }
  .release p { margin:0; font-size:15.5px; color:var(--ink-2); line-height:1.65; }
  .release blockquote { margin:12px 0; padding:2px 0 2px 15px; border-left:3px solid var(--band-line);
                        font-family:var(--f-serif); font-style:italic; color:var(--ink-2); }
  .release cite { display:block; font-style:normal; font-family:var(--f-sans);
                  font-size:13.5px; color:var(--ink-3); margin-top:3px; }
  .open-item { border-left:4px solid var(--warn); }
  .open-item .m { font-size:15px; color:var(--ink-2); line-height:1.6; }
  .open-item .m b { color:var(--ink-3); font-weight:600; }

  /* ---------- discovery: stories ---------- */
  .scard header { display:grid; gap:4px; margin-bottom:10px; }
  .scard .idline { display:flex; gap:12px; align-items:baseline; }
  .scard .sid { font-family:var(--f-mono); font-size:14px; color:var(--accent); font-weight:600; }
  .scard .sname { font-family:var(--f-serif); font-size:20px; line-height:1.3; }
  .scard .attrs { display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--ink-3); }
  .scard .attrs b { color:var(--ink-2); font-weight:600; }
  .scard .narr { font-size:15.5px; color:var(--ink-2); line-height:1.65; max-width:76ch; margin-bottom:10px; }
  .scard .note { display:flex; gap:10px; align-items:baseline; font-size:14px;
                 color:var(--ink-2); margin-bottom:8px; }
  .scard .note .tag { font-size:12.5px; color:var(--warn); font-weight:600; white-space:nowrap; }
  .scard .note .tag::before { content:"● "; }
  .aclist { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  details.ac { border:1px solid var(--line); border-radius:12px; background:var(--surface-2); }
  details.ac > summary { display:grid; grid-template-columns:auto 1fr auto; gap:12px;
                         align-items:baseline; padding:9px 14px; cursor:pointer; list-style:none; }
  details.ac > summary::-webkit-details-marker { display:none; }
  .acid { font-family:var(--f-mono); font-size:13px; color:var(--ink-3); }
  .actitle { font-size:14.5px; color:var(--ink); }
  .pill { font-size:12px; font-weight:600; white-space:nowrap; color:var(--ink-3); }
  .pill::before { content:"● "; }
  .pill.p-primary { color:var(--ok); } .pill.p-negative { color:var(--bad); }
  .pill.p-validation, .pill.p-auth { color:var(--warn); }
  .clausewrap { padding:2px 14px 12px 40px; }
  .clauses { display:grid; gap:2px; font-size:13.5px; color:var(--ink-2); }
  .clauses .kw { font-family:var(--f-mono); font-size:12px; font-weight:700; margin-right:8px; color:var(--accent); }
  .bp { margin:12px 0 0; }
  .bp h4 { font-size:13px; color:var(--ink-3); font-weight:600; text-transform:uppercase;
           letter-spacing:.06em; margin:0 0 6px; }

  /* ---------- discovery: inferred ---------- */
  .inf { border-left:4px solid var(--warn); display:grid; gap:5px; }
  .inf .num { font-family:var(--f-mono); font-size:12.5px; color:var(--ink-3); }
  .inf .ttl { font-size:16.5px; font-weight:600; }

  /* ---------- design: glossary ---------- */
  .gcard { display:grid; grid-template-columns:200px 1fr; padding:0; overflow:hidden; }
  .gcard .rail { border-right:1px solid var(--line); padding:16px 16px 16px 20px;
                  display:grid; gap:8px; align-content:start; background:var(--surface-2); }
  .gcard.hero .rail { background:var(--band); }
  .gcard .term { font-family:var(--f-serif); font-size:20px; line-height:1.25; }
  .gcard .term code { background:none; padding:0; font-size:16px; }
  .gcard .et { font-size:12.5px; font-weight:600; color:var(--ink-3); }
  .gcard .et::before { content:"● "; }
  .gcard .et.ours { color:var(--accent); } .gcard .et.vendor { color:var(--warn); }
  .gcard .body { padding:15px 20px 16px; display:grid; gap:10px; }
  .gfield { display:grid; gap:1px; }
  .gfield > b { font-size:12.5px; text-transform:uppercase; letter-spacing:.07em;
                color:var(--ink-3); font-weight:600; }
  .gfield > span { font-size:15px; color:var(--ink-2); line-height:1.6; max-width:78ch; }
  .gfield.here > span { color:var(--ink); }
  .gexample { border-left:3px solid var(--band-line); padding:2px 0 2px 13px; }
  .gexample b { font-size:12.5px; text-transform:uppercase; letter-spacing:.07em;
                color:var(--ink-3); font-weight:600; display:block; }
  .gexample q { display:block; color:var(--ink-2); font-style:italic; font-size:14.5px; }
  .gexample q::before, .gexample q::after { content:none; }
  @media (max-width:680px) { .gcard { grid-template-columns:1fr; }
    .gcard .rail { border-right:none; border-bottom:1px solid var(--line); } }

  /* ---------- design: how it works ---------- */
  .repos { display:flex; gap:1px; background:var(--line); border:1px solid var(--line);
           border-radius:16px; overflow:hidden; flex-wrap:wrap; box-shadow:var(--shadow); }

/* ---------- discovery ---------- */
function releaseHTML(r) {

      </div></div></section>
  ${d.notBuilding?.length ? `<section class="sec">${secT('What we are NOT building', d.notBuilding.length)}

  ${d.mustBeTrue?.length ? `<section class="sec">${secT('What would have to be true', d.mustBeTrue.length)}

    <div class="list">${d.mustBeTrue.map(x => `<div class="card"><p style="margin:0;font-size:15.5px;color:var(--ink-2)">${x}</p></div>`).join('')}</div></section>` : ''}

/* ---------- design: glossary ---------- */
const GCATS = {
  vendor: { title:'From the vendor', desc:'Words that come from outside and cannot be changed. Much of the design constraint is born here.' },
  ours: { title:'Our vocabulary', desc:'Words we invented in this workstream. If they are badly defined here, nobody else knows what they mean — these are the ones you can disagree with.' },
  eng: { title:'Engineering words', desc:'Standard software vocabulary, used the same way across the industry.' }
};
function gcard(t, hero) {
  const name = t.code ? `<code>${t.t}</code>` : t.t;
  return `<article class="card gcard ${hero?'hero':''}">
    <div class="rail"><span class="term">${name}</span><span class="et ${t.cat}">${t.cat === 'eng' ? 'engineering' : t.cat}</span></div>
    <div class="body">
      <div class="gfield"><b>what it means</b><span>${t.def}</span></div>
      <div class="gfield here"><b>in our case</b><span>${t.here}</span></div>
      <div class="gexample"><b>in a sentence</b><q>${t.ex}</q></div>
    </div></article>`;
}
function renderGlossary() {
  const g = BLUEPRINT.design.glossary;
  const ess = g.terms.filter(t => t.ess);
  const alpha = a => [...a].sort((x,y) => x.t.localeCompare(y.t,'en'));
  return `
  <p class="lede">Every word that appears in the other tabs without explanation is here. The tag
  says where it comes from: what is <b>ours</b> is a decision and can be discussed; what comes
  from the <b>vendor</b> is a constraint and is not negotiable.</p>
  ${inlineDecisions(g.decisions)}
  ${ess.length ? `<section class="sec">${secT('Without these, the rest does not close', ess.length)}
    <div class="list">${ess.map(t => gcard(t, true)).join('')}</div></section>` : ''}
  ${['vendor','ours','eng'].map(c => {
    const inBlock = alpha(g.terms.filter(t => t.cat === c && !t.ess));
    const onTop = g.terms.filter(t => t.cat === c && t.ess);
    if (!inBlock.length && !onTop.length) return '';
    return `<section class="sec">${secT(GCATS[c].title, inBlock.length + onTop.length)}
      <p class="sec-d">${GCATS[c].desc}${onTop.length ? ` From this block, on top: <b>${onTop.map(t=>t.t).join('</b> · <b>')}</b>.` : ''}</p>
      <div class="list">${inBlock.map(t => gcard(t, false)).join('')}</div></section>`;
  }).join('')}`;
}

/* ---------- decision cards (rendered INLINE in the tab they belong to) ---------- */
function dcard(d) {
  const mine = !!d.mine;   // mine: true => "decided in your place" (orange highlight)
  const ops = d.ops.map(o => {
    const marked = o.m === d.chosen;
    const cls = marked ? (mine ? 'rec' : 'chosen') : '';
    const seal = (marked && mine) ? '<span class="seal">what I decided</span>' : '';
    return `<div class="op ${cls}"><span class="m">${o.m}</span><span class="x">${o.x}${seal}</span></div>`;
  }).join('');
  return `<article class="card dcard ${mine?'open':''}">
    ${mine ? '<span class="waiting">Decided in your place</span>' : ''}
    <h3 class="dq">${d.q}</h3><p class="dctx">${d.ctx}</p>
    <div class="ops">${ops}</div>
    <p class="dwhy"><span class="lbl">${mine ? 'why I decided this way' : 'why'}</span>${d.why}
      ${mine && d.obs ? `<span class="obs2">${d.obs}</span>` : ''}</p></article>`;
}
/* Every design tab's data may carry `decisions: [...]` — the choices that
   belong to THAT context, rendered right after the tab's intro. */
function inlineDecisions(a) {
  if (!a?.length) return '';
  return `<section class="sec">${secT('Decisions in this area', a.length)}
    <div class="list">${a.map(d => dcard(d)).join('')}</div></section>`;
}
/* Every design tab's data may carry `references: [...]` — the roll-up of
   what that tab's document leaned on (research files, URLs, code paths),
   rendered at the bottom of the tab. */
function refsBlock(a) {
  if (!a?.length) return '';
  return `<section class="sec">${secT('References', a.length)}
    <div class="card"><ul style="margin:0;padding-left:20px">${a.map(r =>
      `<li style="font-size:14px;color:var(--ink-2);line-height:1.7">${r}</li>`).join('')}</ul></div></section>`;
}

}

/* ---------- design: security ---------- */
function renderSecurity() {
  const s = BLUEPRINT.design.security;
  const EST = { ok:'covered', risk:'risk accepted', na:'does not apply' };
  const count = e => s.classes.filter(c => c.e === e).length;
  return `
  <p class="lede">The sweep covers ${s.classes.length} known failure classes. The list is fixed
  and the same in every workstream — a class without a line is a hole, not silence.</p>
  ${inlineDecisions(s.decisions)}
  <div class="scoreboard" style="margin-top:22px">
    <div class="pl ok"><span class="v">${count('ok')}</span><span class="l">covered, with concrete mitigation</span></div>
    <div class="pl fix"><span class="v">${count('risk')}</span><span class="l">risks accepted, with reason and compensation</span></div>
    <div class="pl na"><span class="v">${count('na')}</span><span class="l">do not apply, with the why</span></div></div>
  <section class="sec">${secT('The sweep', `${s.classes.length} classes`)}
    <div class="list">${s.classes.map(c => `<article class="card cl ${c.e==='ok'?'':c.e}">
      <div class="cab"><h3>${c.c}</h3><span class="status ${c.e==='risk'?'warn':c.e==='na'?'na':'ok'}">${EST[c.e]}</span></div>
      <p class="what2">${c.what}</p>
      ${c.reason ? `<p class="extra"><b>why it was accepted</b>${c.reason}</p>` : ''}
      ${c.compensates ? `<p class="extra" style="border-top:none;padding-top:0"><b>what compensates</b>${c.compensates}</p>` : ''}
      ${c.worst ? `<p class="extra"><b>the worst case, written out</b>${c.worst}</p>` : ''}
    </article>`).join('')}</div></section>`;
}

/* ---------- design: alarms ---------- */
function renderAlarms() {
  const a = BLUEPRINT.design.alarms;
  return `
  <p class="lede">${a.items.length} alarms. Each one says what fires it, what normal looks like,
  when it can ring without a bug, and what to do when it rings.</p>
  ${inlineDecisions(a.decisions)}
  <div class="rule" style="margin-top:20px"><b>An alarm without a written action is not an alarm, it is a dashboard number</b>
    <p>If an alarm has no action, it should not wake anyone — it becomes a chart on the ops
    panel. And an alarm that fires in normal operation, with nobody able to explain why,
    trains everyone to ignore the next one.</p></div>
  <section class="sec">${secT('The alarms', a.items.length)}
    <p class="sec-d">Most important first.</p>
    <div class="list">${a.items.map(x => `<article class="card al">
      <div class="acab"><span class="anm">${x.nm}</span><span class="aq">${x.when}</span></div>
      <h3 class="atit">${x.tit}</h3>
      <div class="fields">
        <div class="kv"><b>what it catches</b><span>${x.catches}</span></div>
        <div class="kv"><b>what normal looks like</b><span>${x.normal}</span></div>
        <div class="kv"><b class="false">when it rings without a bug</b><span>${x.falseRing}</span></div>
        <div class="kv"><b class="action">what to do</b><span class="action">${x.action}</span></div>
      </div></article>`).join('')}</div>
    <div class="rule calm"><b>${a.calibration.t}</b><p>${a.calibration.p}</p></div></section>`;
}

/* ---------- design: going to production ---------- */
function renderLive() {
  const p = BLUEPRINT.design.live;
  return `
  <p class="lede">${p.steps.length} steps, ${p.steps.filter(x=>x.gate).length} of them
  blocked on you. Nothing is irreversible.</p>
  ${inlineDecisions(p.decisions)}
  <section class="sec">${secT('In thirty seconds')}
    <div class="card brief"><p class="phrase">${p.brief.phrase}</p>
      <div class="scoreboard" style="margin:0">${p.brief.cells.map(c => `
        <div class="pl ${c.al?'fix':''}"><span class="l">${c.r}</span>
          <span class="v" style="font-size:17px">${c.v}</span></div>`).join('')}</div></div></section>
  <section class="sec">${secT('The script of the day', `${p.steps.length} steps`)}
    <p class="sec-d">In order. Each step says where it runs and how to confirm it worked before
    moving on. The highlighted ones stop and wait for you.</p>
    <div class="list">${p.steps.map((x,i) => `<div class="card step ${x.gate?'gate':''}">
      <span class="pnum">${String(i+1).padStart(2,'0')}</span>
      <div class="pbody">${x.gate ? '<span class="mark">needs you</span>' : ''}
        <span class="pt">${x.t}</span><span class="pwhere">${x.where}</span>
        <span class="pd">${x.d}</span>
        ${x.cmd ? `<pre>${esc(x.cmd)}</pre>` : ''}
        <span class="pchk"><b>confirmed working when</b>${x.chk}</span>
        ${x.obs ? `<span class="pd" style="color:var(--ink-3)">${x.obs}</span>` : ''}
      </div></div>`).join('')}</div></section>
  <section class="sec">${secT('How to go back')}
    <p class="sec-d">${p.rehearsal}</p>
    <div class="list">${p.rollbacks.map(v => `<div class="card rollback" style="display:grid;gap:6px">
      <div class="vcab"><h3>${v.t}</h3><span class="vtime">${v.time}</span></div>
      <span class="vwhen">${v.when}</span>
      ${v.cmd ? `<pre>${esc(v.cmd)}</pre>` : ''}</div>`).join('')}</div></section>
  <section class="sec">${secT('Where this usually goes wrong', p.traps.length)}
    <p class="sec-d">Not theoretical risks — mistakes this house has made or nearly made.</p>
    <div class="list">${p.traps.map(a => `<div class="card trap">
      <span class="at">${a.t}</span><span class="ad">${a.d}</span></div>`).join('')}</div></section>`;
}

/* ---------- lens cards (used by the plan review) ---------- */
function lensCard(l, totalRounds) {
  const ROT = { 'pass':'ok', 'pass with fixes':'fix', 'fail':'fail' };
  return `<article class="card lens ${ROT[l.ver]==='ok'?'':ROT[l.ver]}">
    <div class="lcab"><span class="lnm">${l.nm}</span>
      <span class="status ${ROT[l.ver]==='ok'?'ok':ROT[l.ver]==='fix'?'warn':'bad'}">${l.ver}</span></div>
    <p class="judges">${l.judges}</p>
    <div class="verified"><b>verified</b>${l.verified.map(v=>`<span class="it">${v}</span>`).join('')}</div>
    <div class="lquote"><b>read, and quotes</b><q>${l.quote}</q></div>
    <div class="lmeta"><span><b>round</b> ${l.round} of ${totalRounds}</span>
      <span><b>run</b> ${l.id}</span><span><b>findings</b> ${l.findings}</span></div>
  </article>`;
}

/* ---------- plan ---------- */
function renderPlan() {
  const p = BLUEPRINT.plan;
  const map = `<div class="diagram"><div class="pwaves">${p.batches.map(o => `
    <div class="pcol"><h4>Batch ${o.n}</h4>${o.items.map(i => `
      <div class="pno ${i.critical?'critical':''} ${i.front?'front':''}"><b>${i.num}</b>${i.t}<span class="dep">${i.dep}</span></div>`).join('')}
    </div>`).join('')}</div>
    <div class="plegend"><span><i class="critical"></i>critical path</span>
      <span><i class="front"></i>frontend</span><span><i></i>backend</span></div></div>`;
  const cards = p.batches.map(o => `
    <h3 class="ibatch"><b>Batch ${o.n}</b> · ${o.tit}</h3>
    <div class="list">${o.items.map(i => `<article class="card icard">
      <div class="icab"><span class="inum">${i.num}${i.gh ? ` → ${i.gh}` : ''}</span><h3>${i.card.title}</h3>
        <span class="irepo">${i.repo}</span></div>
      <p>${i.card.p}</p>
      <div class="ichips">${(i.card.prod||[]).map(c=>`<span class="ichip prod">produces: ${c}</span>`).join('')}
        ${(i.card.cons||[]).map(c=>`<span class="ichip">consumes: ${c}</span>`).join('')}</div>
    </article>`).join('')}</div>`).join('');
  const d = p.decisions || {};
  const dec = `
    ${d.decided?.length ? `<section class="sec">${secT('Decided in your place', d.decided.length)}
      <p class="sec-d">These were your calls about the shape of the plan. I chose, marked, and wrote the argument.</p>
      <div class="list">${d.decided.map(x => dcard({...x, mine: true})).join('')}</div></section>` : ''}
    ${d.taken?.length ? `<section class="sec">${secT('Plan decisions', d.taken.length)}
      <div class="list">${d.taken.map(x => dcard(x)).join('')}</div></section>` : ''}
    ${d.assumed?.length ? `<section class="sec">${secT('What I assumed', d.assumed.length)}
      <div class="list">${d.assumed.map(s => `<div class="card sup">
        <p class="st1">${s.a}</p><p class="st2">${s.b}</p><p class="st3">${s.c}</p></div>`).join('')}
      </div></section>` : ''}`;
  const r = p.review;
  const count = v => r.lenses.filter(l => l.ver === v).length;
  const missing = (r.expected || 4) - r.lenses.length;
  const rev = `
  <section class="sec">${secT('The plan review', `round ${r.round} of ${r.totalRounds}`)}
    <p class="sec-d">Whole-plan lenses plus one that reads each issue cold, alone, exactly as the
    worker will receive it. When the plan corrects, the whole-plan lenses repeat; the cold one
    repeats on the issues that changed.</p>
    <div class="scoreboard">
      <div class="pl ok"><span class="v">${count('pass')}</span><span class="l">passed clean</span></div>
      <div class="pl fix"><span class="v">${count('pass with fixes')}</span><span class="l">passed after fixes</span></div>
      <div class="pl fail"><span class="v">${count('fail')}</span><span class="l">did not pass</span></div>
      <div class="pl na"><span class="v">${missing}</span><span class="l">did not run</span></div>
      <div class="pl ${r.perIssue.pass === r.perIssue.total ? 'ok' : 'fix'}"><span class="v">${r.perIssue.pass}/${r.perIssue.total}</span>
        <span class="l">issues pass the cold read</span></div></div>
    ${missing > 0 ? `<div class="warning"><b>A lens without a run invalidates the round</b>
      <p>The run id comes from the system that dispatched the agent, not from the plan text.
      Without it, that scope was not reviewed — and the stage cannot close claiming it was.</p></div>` : ''}
    <div class="list" style="margin-top:20px">${r.lenses.map(l => lensCard(l, r.totalRounds)).join('')}</div></section>`;
  return `
  <p class="lede">${p.intro}</p>
  <div class="scoreboard" style="margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${p.cells.map(c =>
    `<div class="pl"><span class="v">${c.v}</span><span class="l">${c.l}</span></div>`).join('')}</div>
  <section class="sec">${secT('The batch map')}${map}</section>
  <section class="sec">${secT('The issues, batch by batch')}${cards}</section>
  ${dec}${rev}`;
}

/* ---------- execution ---------- */
function renderExecution() {
  const e = BLUEPRINT.execution;
  const tl = `<div class="xtl">${e.timeline.map(i => `
    <div class="xi ${i.tone || ''}"><div class="when">${i.when}</div>
      <div class="what">${i.what}</div>${i.det ? `<div class="det">${i.det}</div>` : ''}</div>`).join('')}</div>`;
  const smokeOut = esc(e.smoke.out)
    .replace(/✓/g, '<span class="xok">✓</span>').replace(/✗/g, '<span class="xerr">✗</span>');
  const caps = `<div class="list">${e.capabilities.map(c => `<article class="card icard">
    <h3>${c.t}</h3><p>${c.p}</p>
    <div class="ichips">${c.chips.map(x => `<span class="ichip ${x.ok ? 'prod' : ''}">${x.t}</span>`).join('')}</div>
  </article>`).join('')}</div>`;
  const proof = e.proof ? `<article class="card icard" style="margin-top:12px">
    <h3>The central proof, verbatim</h3><p>${e.proof.p}</p><pre>${e.proof.pre}</pre>
    ${e.proof.note ? `<p class="xnote">${e.proof.note}</p>` : ''}</article>` : '';
  const r = e.rounds;
  const TONE = { ok: 'xgreen', fail: 'xred' };
  const rounds = `<div class="scroll"><table class="table">
    <tr><th>Round</th>${r.scopes.map(s => `<th class="num">${s}</th>`).join('')}<th>Root cause → fix</th></tr>
    ${r.rows.map(l => `<tr><td class="num">${l.r}</td>
      ${l.scores.map(p => `<td class="num ${TONE[p.tone] || ''}">${p.v}</td>`).join('')}
      <td>${l.cause}</td></tr>`).join('')}</table></div>`;
  return `
  <p class="lede">${e.intro}</p>
  <section class="sec">${secT('Implementation timeline')}${tl}</section>
  <section class="sec">${secT('Smoke', 'the floor before the round')}<pre>${smokeOut}</pre>
    ${e.smoke.note ? `<p class="xnote">${e.smoke.note}</p>` : ''}</section>
  <section class="sec">${secT('What exists now', `${e.capabilities.length} capabilities · each one proven`)}
    ${caps}${proof}</section>
  <section class="sec">${secT('e2e rounds', 'all-or-nothing · the convergence')}
    ${r.intro ? `<p class="sec-d">${r.intro}</p>` : ''}${rounds}</section>
  ${e.decisions?.length ? `<section class="sec">${secT('Decided in your place', 'during execution')}
    <div class="list">${e.decisions.map(x => dcard({...x, mine: true})).join('')}</div></section>` : ''}
  ${e.pending?.length ? `<section class="sec">${secT('Needs you', e.pending.length)}
    <div class="list">${e.pending.map((p, i) => `<article class="card step">
      <span class="pnum">${i + 1}</span><div class="pbody">
      <p class="pt">${p.t}</p><p class="pd">${p.p}</p></div></article>`).join('')}</div></section>` : ''}`;
}

/* ---------- registry and boot ---------- */
const RENDER = {
  overview: renderOverview,
  'discovery/prfaq': renderPrfaq,
  'discovery/stories': renderStories,
  'discovery/inferred': renderInferred,
  'design/glossary': renderGlossary,
  'design/flows': renderFlows,
  'design/ui': renderUI,
  'design/data': renderData,
  'design/infra': renderInfra,
  'design/code': renderCode,
  'design/security': renderSecurity,
  'design/alarms': renderAlarms,
  'design/live': renderLive,
  plan: renderPlan,
  execution: renderExecution
};

document.getElementById('brand').innerHTML =
  `${BLUEPRINT.workstream.slug}<span class="t">${BLUEPRINT.workstream.title} · wave ${BLUEPRINT.workstream.wave}</span>`;
document.getElementById('topmeta').textContent = BLUEPRINT.overview.status;

const tablist = document.getElementById('tablist');
const subtabsEl = document.querySelector('.subtabs');
const subtablist = document.getElementById('subtablist');
const panels = document.getElementById('panels');

STAGES.forEach(s => {
  const ok = has(s.key);
  tablist.insertAdjacentHTML('beforeend',
    `<button class="tab" role="tab" id="t-${s.key}" aria-selected="false"${ok ? '' : ' disabled'}>${s.label}</button>`);
  const targets = s.sections ? s.sections.map(x => `${s.key}/${x.key}`) : [s.key];
  // Per-tab render guard: data out of shape in one tab must not take the
  // whole page down — the broken tab declares the error, the others live.
  const renderSafe = (id) => {
    try {
      let html = RENDER[id]();
      const [st, sec] = id.split('/');
      if (st === 'design' && BLUEPRINT.design?.[sec]?.references) html += refsBlock(BLUEPRINT.design[sec].references);
      return html;
    }
    catch (e) { return `<p style="color:var(--ink-3);padding:24px 0">This tab failed to render (${esc(String(e && e.message || e))}) — its data does not match the shape the shell expects. The other tabs remain intact.</p>` }
  };
  targets.forEach(id => panels.insertAdjacentHTML('beforeend',
    `<section class="panel" id="p-${id.replace('/','--')}" role="tabpanel" hidden>${
      ok && RENDER[id] ? renderSafe(id) : ''}</section>`));
});

let stageNow = null;
function paintSubtabs(s) {
  if (!s.sections) { subtabsEl.hidden = true; subtablist.innerHTML = ''; return; }
  subtabsEl.hidden = false;
  subtablist.innerHTML = s.sections.map(x =>
    `<button class="subtab" role="tab" data-id="${s.key}/${x.key}" aria-selected="false">${x.label}</button>`).join('');
  subtablist.querySelectorAll('.subtab').forEach(b =>
    b.addEventListener('click', () => select(b.dataset.id)));
}
function select(target) {
  const [stKey, secKey] = target.split('/');
  const s = STAGES.find(x => x.key === stKey);
  if (!s || !has(stKey)) return;
  if (stageNow !== stKey) { paintSubtabs(s); stageNow = stKey; }
  const id = s.sections ? `${stKey}/${secKey || s.sections[0].key}` : stKey;
  STAGES.forEach(x => document.getElementById('t-' + x.key)
    .setAttribute('aria-selected', x.key === stKey ? 'true' : 'false'));
  panels.querySelectorAll('.panel').forEach(p => { p.hidden = p.id !== 'p-' + id.replace('/','--'); });
  subtablist.querySelectorAll('.subtab').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.id === id ? 'true' : 'false'));
  history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
STAGES.filter(s => has(s.key)).forEach(s =>
  document.getElementById('t-' + s.key).addEventListener('click', () => select(s.key)));
select(location.hash.slice(1) || 'overview');


/* scroll-spy for the PR-FAQ index */
const links = [...document.querySelectorAll('.toc a')];
if (links.length && 'IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const id = e.target.id.replace('q-', '');
    links.forEach(l => l.classList.toggle('on', l.dataset.q === id));
  }), { rootMargin: '-120px 0px -70% 0px' });
  document.querySelectorAll('.answers .qa[id]').forEach(el => io.observe(el));
}

/* theme by the READER's clock: from 17h to 5h the page opens dark; light
   otherwise. The button still rules. */
const themeBtn = document.querySelector('.themeBtn');
const applyTheme = (dark) => {
  document.documentElement.classList.toggle('dark', dark);
  themeBtn.textContent = dark ? '☀' : '☾';
};
const hour = new Date().getHours();
applyTheme(hour >= 17 || hour < 5);
themeBtn.addEventListener('click', () => {
  applyTheme(!document.documentElement.classList.contains('dark'));
});
</script>
