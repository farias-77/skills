<title>Feature mock</title>
<!--
  prototype-shell.html: the starting point of every discovery mock.

  ONE self-contained page, published as a claude.ai artifact. The publish
  step wraps it in the doctype, head and body, so this file has none of
  them. Scripts only from cdnjs / jsdelivr / unpkg (this shell needs none);
  fonts only from Google Fonts; no alert, confirm or prompt; works at
  400px; both themes through tokens.

  What the prototype-builder edits (four places, each one a block with an id):
    1. the title                    the feature's name + "mock"
    2. style block id=tokens        the project's exported tokens (or the defaults)
    3. style block id=product       the screens' CSS, scoped under #screen
    4. script block id=product      P.define({...}): copy, seed, screens, frames, journeys, actions,
                                    and, when the product has them, actors ("view as") and clock
  The blocks marked SHELL are not edited; a shell fix goes to the template.
  The product fills the window. The mock's controls float above it in ONE panel
  (outside #screen) that hides to a handle, also with the H key. On top, the REVIEW:
  an ordered path through every state he must see (Next step / Previous, N / P keys,
  progress, each state seen ticked, remembered between visits; the model's `review`,
  else built from the journeys). Below it, only what can be switched to look at
  something: the screen, the state of this screen, who is looking, the design
  variant, the clock, the language, the theme and the width. The panel's labels
  follow meta.uiLang (en, pt-BR; meta.ui overrides any label). No journey is shown;
  journeys stay in the model for the tools (proto.mjs walk, lock, frames).
  Inside a published artifact the #hash does not reach the page: the review is how
  he moves through the states there.

  Addressing (only a bare #token reaches the page inside an artifact):
    #screen.state                     a frame, e.g. #invites.empty
    #play-J2  #play-J2.s3             a journey's start (played up to that step), for the tools
    modifiers joined by "~":          ~light ~dark ~LANG ~phone ~desktop ~bare ~fast
    e.g. #invite-form.failed~dark~pt-BR~bare   (what the frame renderer opens)

  Test surface for tools: window.proto (see the SHELL API block).
-->

<style id="tokens">
/* ── PROJECT TOKENS ────────────────────────────────────────────────────────
   Replace this block with the project's exported tokens (tokens.css from the
   project contract's "design tokens and components, exported" role). Keep the
   three-block shape: light values on bare :root; dark values under the media
   query guarded by :not([data-theme="light"]); the same dark values again on
   [data-theme="dark"]. The shell and the screens read only the names below:
   when the project's names differ, map them here (--background: var(--app-bg)).
   Defaults: a neutral monochrome set with status colors, contrast-checked. */
:root {
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --background: oklch(.99 0 0);
  --foreground: oklch(.18 0 0);
  --card: oklch(1 0 0);
  --muted: oklch(.965 0 0);
  --muted-foreground: oklch(.46 0 0);
  --border: oklch(.91 0 0);
  --input: oklch(.60 0 0);
  --ring: oklch(.18 0 0);
  --primary: oklch(.18 0 0);
  --primary-foreground: oklch(.99 0 0);
  --success: oklch(.52 .13 150);
  --warning: oklch(.80 .15 85);
  --warning-text: oklch(.50 .11 70);
  --danger: oklch(.53 .19 27);
  --danger-foreground: oklch(.99 0 0);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(.16 0 0); --foreground: oklch(.96 0 0); --card: oklch(.19 0 0);
    --muted: oklch(.22 0 0); --muted-foreground: oklch(.71 0 0); --border: oklch(.29 0 0);
    --input: oklch(.54 0 0); --ring: oklch(.96 0 0); --primary: oklch(.96 0 0); --primary-foreground: oklch(.16 0 0);
    --success: oklch(.74 .15 150); --warning: oklch(.83 .15 85); --warning-text: oklch(.83 .15 85);
    --danger: oklch(.70 .17 25); --danger-foreground: oklch(.16 0 0);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: oklch(.16 0 0); --foreground: oklch(.96 0 0); --card: oklch(.19 0 0);
  --muted: oklch(.22 0 0); --muted-foreground: oklch(.71 0 0); --border: oklch(.29 0 0);
  --input: oklch(.54 0 0); --ring: oklch(.96 0 0); --primary: oklch(.96 0 0); --primary-foreground: oklch(.16 0 0);
  --success: oklch(.74 .15 150); --warning: oklch(.83 .15 85); --warning-text: oklch(.83 .15 85);
  --danger: oklch(.70 .17 25); --danger-foreground: oklch(.16 0 0);
  color-scheme: dark;
}
</style>

<style id="product">

<div id="proto">
  <main class="pr-stage" id="pr-stage">
    <div class="pr-device" id="pr-device">
      <div id="screen" data-comment-target></div>
    </div>
  </main>
  <aside class="pr-ctl" id="pr-ctl" aria-label="Mock controls"></aside>
  <div class="pr-sr" id="pr-live" aria-live="polite"></div>
</div>

<script id="shell-core">
/* ── SHELL: core. Defines window.P, the API the product block uses. ─────── */
(() => {
  'use strict';
  const P = window.P = {};
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = v => String(v).replace(/[&<>"']/g, c => ESC[c]);
  class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
  const part = v => v == null || v === false ? '' : v instanceof Raw ? v.s : Array.isArray(v) ? v.map(part).join('') : esc(v);
  /** html`<p>${text}</p>` escapes every value; arrays join; P.raw() passes trusted markup. */
  P.html = (strings, ...vals) => new Raw(strings.reduce((a, s, i) => a + s + (i < vals.length ? part(vals[i]) : ''), ''));
  P.raw = s => new Raw(String(s));
  P.esc = esc;

  const state = P._ = {
    model: null, store: null, lang: 'en', net: 'ok', fast: false, still: false, bare: false,
    variant: null, effects: [], requests: [], pending: 0, missing: new Set(), problems: [],
    reached: new Set(), seq: 0,
  };
  P.problem = msg => { if (!state.problems.includes(msg)) { state.problems.push(msg); console.error('[mock] ' + msg); } };

  /** Copy: t('invite.sent', {email}) — every visible string is a key in every language. */
  P.t = (key, vars) => {
    const table = (state.model && state.model.copy[state.lang]) || {};
    let s = table[key];
    if (s == null) { state.missing.add(state.lang + ':' + key); return '⟦' + key + '⟧'; }
    if (typeof s === 'object') {
      const n = vars && typeof vars.count === 'number' ? vars.count : 0;
      s = s[new Intl.PluralRules(state.lang).select(n)] ?? s.other;
    }
    return vars ? String(s).replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? (typeof vars[k] === 'number' ? P.fmt.number(vars[k]) : vars[k]) : m) : String(s);
  };
  P.lang = () => state.lang;
  P.fmt = {
    number: (n, o) => new Intl.NumberFormat(state.lang, o).format(n),
    money: (n, currency) => new Intl.NumberFormat(state.lang, { style: 'currency', currency: currency || state.model?.meta.currency || 'USD' }).format(n),
    date: (d, o) => new Intl.DateTimeFormat(state.lang, o || { dateStyle: 'medium' }).format(new Date(d)),
    time: (d, o) => new Intl.DateTimeFormat(state.lang, o || { timeStyle: 'short' }).format(new Date(d)),
    relative: (n, unit) => new Intl.RelativeTimeFormat(state.lang, { numeric: 'auto' }).format(n, unit),
  };
  /** The mock's clock: fixed (meta.clock), so every frame renders the same; the store's
      `clock` (set by a frame's setup, the controls' Clock, or a journey step's `clock`) moves it. */
  P.now = () => new Date((state.store && state.store.clock) || state.model?.meta.clock || '2026-01-15T09:00:00Z');
  /** Who is looking (an id of `actors`), kept in the store's `actor`; null when the product has one actor. */
  P.actor = () => (state.store && state.store.actor) || null;
  /** A clock advance: "+30m", "+2h", "+1d", or an absolute ISO time with its offset. Returns the new Date or null. */
  P._advance = (from, spec) => {
    const m = /^\+(\d+)([mhd])$/.exec(String(spec));
    if (m) return new Date(from.getTime() + Number(m[1]) * ({ m: 6e4, h: 36e5, d: 864e5 })[m[2]]);
    const d = new Date(spec);
    return /^\d{4}-\d\d-\d\dT/.test(String(spec)) && !isNaN(d) ? d : null;
  };

  /** Side effects the screen cannot show: rows, e-mails, events, jobs, alarms. Read by the tools (window.proto.effects). */
  P.effect = (kind, data) => { state.effects.push(Object.assign({ kind: String(kind) }, data, { _seq: ++state.seq })); };
  /** The current screen's view: { state, fields, ...whatever the product keeps }. */
  P.view = () => state.store.view[state.store.screen];
  /** Move to a screen and state (inside an action). Extra keys merge into that screen's view. */
  P.nav = (screen, st, extra) => {
    const s = state.store;
    if (!state.model.screens[screen]) P.problem(`P.nav: no screen "${screen}"`);
    s.view[screen] = Object.assign({ fields: {} }, s.view[screen], extra || {}, { state: st });
    s.screen = screen;
  };
  /** The frame token of what is on screen now. */
  P.frame = () => state.store ? state.store.screen + '.' + P.view().state : '';
  P.variant = () => state.variant;

  /** Fake network. A journey step's `net` (or window.proto.setNet) sets the answer of the NEXT request:
      ok · slow · error · timeout. fn runs only on ok/slow and does the write (db + effects). */
  P.request = (name, fn) => {
    const mode = state.net;
    P._setNet('ok');
    state.requests.push({ name, answer: mode, _seq: ++state.seq });
    const ms = ({ ok: 600, slow: 2400, error: 700, timeout: 6000 })[mode] * (state.fast ? 0.02 : 1);
    state.pending++;
    return new Promise((resolve, reject) => setTimeout(() => {
      state.pending--;
      if (mode === 'ok' || mode === 'slow') { try { resolve(fn ? fn() : undefined); } catch (e) { reject(e); } }
      else reject({ code: mode });
    }, ms));
  };
  /** A transient message (not part of any frame). A message a frame must show belongs to the view state. */
  P.toast = (text, ms = 3200) => {
    const dev = document.getElementById('pr-device');
    const el = document.createElement('div');
    el.className = 'pr-toast'; el.setAttribute('role', 'status'); el.textContent = text;
    dev.appendChild(el);
    document.getElementById('pr-live').textContent = text;
    if (!state.still) setTimeout(() => el.remove(), ms);
  };
  P.render = () => P._render && P._render();

  /** The product's single entry point. Validates the model and shows every problem in the controls. */
  P.define = model => {
    const m = Object.assign({ meta: {}, copy: {}, screens: {}, frames: {}, journeys: [], actions: {}, variants: [], actors: [], clock: null, review: [] }, model);
    m.meta = Object.assign({ name: 'Mock', version: 1, languages: Object.keys(m.copy) }, m.meta);
    if (!m.meta.languages.length) m.meta.languages = ['en'];
    const TOKEN = /^[A-Za-z0-9][A-Za-z0-9_-]*(\.[A-Za-z0-9_-]+)+$/;
    if (typeof m.seed !== 'function') P.problem('P.define: seed must be a function returning a fresh store');
    for (const [tok, f] of Object.entries(m.frames)) {
      if (!TOKEN.test(tok)) P.problem(`frame "${tok}": tokens are <screen>.<state>, letters digits _ - and dots only`);
      if (!m.screens[tok.split('.')[0]]) P.problem(`frame "${tok}": no screen "${tok.split('.')[0]}"`);
      if (!f || !f.title) P.problem(`frame "${tok}": needs a title`);
    }
    for (const [name, sc] of Object.entries(m.screens)) if (typeof sc.render !== 'function') P.problem(`screen "${name}": needs render(s, P)`);
    const aids = new Set();
    for (const a of m.actors) {
      if (!a || !/^[A-Za-z0-9_-]+$/.test(a.id || '')) P.problem(`actor "${a && a.id}": ids are letters, digits, _ and -`);
      else if (aids.has(a.id)) P.problem(`actor "${a.id}": duplicate id`);
      else aids.add(a.id);
      if (a && !a.title) P.problem(`actor "${a.id}": needs a title (the name the controls show)`);
      if (a && a.home && !m.frames[a.home] && !m.screens[String(a.home).split('.')[0]]) P.problem(`actor "${a.id}": home "${a.home}" is not a screen.state`);
    }
    if (m.clock) for (const k of m.clock.marks || []) if (!P._advance(new Date(), k.at)) P.problem(`clock mark "${k.label}": at must be an ISO time with its offset`);
    const jids = new Set();
    for (const j of m.journeys) {
      if (!/^J\d+$/.test(j.id || '')) P.problem(`journey "${j.id}": ids are J1, J2, …`);
      if (jids.has(j.id)) P.problem(`journey "${j.id}": duplicate id`); jids.add(j.id);
      if (!m.frames[j.start]) P.problem(`journey ${j.id}: start "${j.start}" is not a frame`);
      if (!Array.isArray(j.steps) || !j.steps.length) P.problem(`journey ${j.id}: no steps`);
      const sids = new Set();
      for (const st of j.steps || []) {
        if (!/^s\d+$/.test(st.id || '')) P.problem(`journey ${j.id}: step ids are s1, s2, … (got "${st.id}")`);
        if (sids.has(st.id)) P.problem(`journey ${j.id}: duplicate step ${st.id}`); sids.add(st.id);
        const events = ['target', 'as', 'clock'].filter(k => st[k]);
        if (events.length !== 1) P.problem(`${j.id}.${st.id}: needs exactly one event: target (a CSS selector inside #screen), as (an actor id) or clock (an advance)`);
        if (st.as && !aids.has(st.as)) P.problem(`${j.id}.${st.id}: as "${st.as}" is not an actor id`);
        if (st.clock && !P._advance(new Date(), st.clock)) P.problem(`${j.id}.${st.id}: clock "${st.clock}" is not "+<n>m|h|d" or an ISO time`);
        if ((st.as || st.clock) && st.fill && Object.keys(st.fill).length) P.problem(`${j.id}.${st.id}: a step that switches actor or moves the clock fills nothing`);
        if (!m.frames[st.expect]) P.problem(`${j.id}.${st.id}: expect "${st.expect}" is not a frame`);
        if (st.net && !['ok', 'slow', 'error', 'timeout'].includes(st.net)) P.problem(`${j.id}.${st.id}: net must be ok, slow, error or timeout`);
      }
    }
    for (const r of m.review) if (!r || !m.frames[r.frame]) P.problem(`review: "${r && r.frame}" is not a frame`);
    for (const l of m.meta.languages) if (!m.copy[l]) P.problem(`language "${l}" has no copy table`);
    state.model = m;
    state.lang = m.meta.languages[0];
    state.variant = m.variants[0] || null;
  };
})();
</script>

<script id="product">
/* ── PRODUCT: the mock itself. EXAMPLE below: replace all of it. ─────────
   Rules (proto.mjs walk checks them mechanically):
   - seed() returns a FRESH store: { screen, view: { <screen>: { state, fields } }, db: { <table>: [rows] } }.
   - A screen's state is ONE value (a frame token's tail), never a set of booleans.
   - render(s, P) is pure: it reads s, returns P.html`…`, starts nothing async.
   - Every visible string is P.t('key'); every key exists in every language.
   - Actions are named by data-act on a button or on a <form>; they change s, may await P.request,
     and record side effects with P.effect(kind, {...}).
   - Every (screen, state) the mock can show is a frame with a setup that reaches it from seed().
   - Journeys: J1…; steps s1…; each step = do (words) · ONE event: target (selector), as (actor id) or
     clock ("+1d", "+2h", or an ISO time) · fill · net · expect (frame) · see (copy keys) · effects.
   - More than one actor: actors: [{ id, title, home: '<screen>.<state>' or enter(s, P) }]; the controls'
     "View as" sets s.actor and goes to home (or runs enter); P.actor() reads it; a frame's setup may set it.
   - Time that matters: clock: { marks: [{ label, at: ISO }], onAdvance(s, P) }; the controls' "Clock" moves
     s.clock; P.now() reads it; onAdvance runs the jobs that time triggers (expiries, reminders).
   - P.effect records the WHOLE write (every field of the row, the e-mail, the event); a step's declared
     effects match a subset. An effect that cannot carry every field says partial: true.
   - review: [{ frame, check }] — the guided path he follows: every state he must see, in the order of
     the flow, each with one line of what to check (from the story's ACs). Without it the shell builds
     one from the journeys. screens.<name>.title names a screen in the controls. */
P.define({
  meta: { name: 'Example', version: 1, languages: ['en', 'pt-BR'], clock: '2026-01-15T09:00:00-03:00' },
  copy: {
    en: { 'list.title': 'Saved reports', 'list.lead': 'Reports you saved appear here.', 'list.empty': 'No saved reports yet', 'list.add': 'Save report', 'list.saved': 'Report saved', 'list.count': { one: '{count} report', other: '{count} reports' } },
    'pt-BR': { 'list.title': 'Relatórios salvos', 'list.lead': 'Os relatórios que você salvar aparecem aqui.', 'list.empty': 'Nenhum relatório salvo ainda', 'list.add': 'Salvar relatório', 'list.saved': 'Relatório salvo', 'list.count': { one: '{count} relatório', other: '{count} relatórios' } },
  },
  seed: () => ({ screen: 'reports', view: { reports: { state: 'loaded', fields: {} } }, db: { reports: [{ id: 'r1', name: 'Weekly churn by region' }] } }),
  screens: {
    reports: {
      title: 'Reports',
      render: (s, P) => {
        const rows = s.db.reports;
        return P.html`<section class="ex">
          <h1>${P.t('list.title')}</h1>
          <p>${s.view.reports.state === 'empty' ? P.t('list.empty') : P.t('list.count', { count: rows.length })}</p>
          ${s.view.reports.state === 'empty' ? '' : P.html`<ul class="ex-list">${rows.map(r => P.html`<li><span>${r.name}</span></li>`)}</ul>`}
          <button class="ex-btn" data-act="save">${P.t('list.add')}</button>
        </section>`;
      },
    },
  },
  frames: {
    'reports.loaded': { title: 'Reports, one saved' },
    'reports.empty': { title: 'Reports, none yet', setup: s => { s.db.reports = []; } },
  },
  actions: {
    save: async (s, ctx, P) => {
      await P.request('POST /reports', () => {
        const row = { id: 'r' + (s.db.reports.length + 1), name: 'Monthly revenue' };
        s.db.reports.push(row);
        P.effect('db', { table: 'reports', op: 'insert', id: row.id });
      });
      P.nav('reports', 'loaded');
      P.toast(P.t('list.saved'));
    },
  },
  review: [
    { frame: 'reports.empty', check: 'With nothing saved, the screen says so and offers to save one' },
    { frame: 'reports.loaded', check: 'A saved report shows by its name, with the count above' },
  ],
  journeys: [
    { id: 'J1', title: 'Save a first report', actor: 'analyst', job: 'When I build a report I will need again, I want to save it, so I can open it next week.',
      start: 'reports.empty',
      steps: [
        { id: 's1', do: 'Save the report', target: '[data-act="save"]', expect: 'reports.loaded', see: ['list.title'], effects: [{ kind: 'db', table: 'reports', op: 'insert' }] },
      ] },
  ],
});
</script>

<script id="shell-boot">
/* ── SHELL: boot, router, journeys for the tools, the floating controls. ── */
(() => {
  'use strict';
  const S = P._, M = S.model;
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const screenEl = $('screen'), ctl = $('pr-ctl'), device = $('pr-device');
  const h = P.html;
  if (!M) { screenEl.innerHTML = '<div class="pr-crash">The product block did not call P.define({...}).</div>'; return; }

  const ui = { theme: 'system', width: 'fit', journey: M.journeys[0]?.id || null, now: 0, since: 0, hidden: false };
  const V = String(M.meta.version);

  // ── store and frames ──────────────────────────────────────────────────
  const clone = o => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
  function load(token) {
    const f = M.frames[token];
    if (!f) { P.problem(`no frame "${token}"`); return false; }
    const scr = token.split('.')[0], st = token.slice(scr.length + 1);
    let s;
    try { s = clone(M.seed()); } catch (e) { P.problem('seed() threw: ' + e.message); return false; }
    s.view = s.view || {}; s.db = s.db || {};
    s.screen = scr;
    s.view[scr] = Object.assign({ fields: {} }, s.view[scr], { state: st });
    S.store = s;
    try { f.setup && f.setup(s, P); } catch (e) { P.problem(`frame ${token}: setup threw: ${e.message}`); }
    S.effects = []; S.requests = []; S.missing.clear(); ui.since = 0; S.epoch = (S.epoch || 0) + 1;
    return true;
  }

  let lastScreen = null;
  function render() {
    const token = P.frame();
    const sc = M.screens[S.store.screen];
    const focusedId = document.activeElement && screenEl.contains(document.activeElement) ? document.activeElement.id : null;
    let out;
    try { out = sc.render(S.store, P); }
    catch (e) { console.error(e); out = h`<div class="pr-crash">render of ${token} threw: ${e.message}</div>`; }
    screenEl.innerHTML = String(out);
    if (lastScreen !== null && lastScreen !== S.store.screen && !S.still) {
      screenEl.classList.remove('pr-enter'); void screenEl.offsetWidth; screenEl.classList.add('pr-enter');
    }
    lastScreen = S.store.screen;
    root.dataset.frame = token;
    if (!M.frames[token]) P.problem(`the mock reached "${token}", which is not a declared frame`);
    S.reached.add(token);
    if (focusedId) { const el = document.getElementById(focusedId); if (el) el.focus({ preventScroll: true }); }
    chrome();
  }
  P._render = render;

  // ── actions and fields ────────────────────────────────────────────────
  function run(name, ctx) { S.lastRun = runAction(name, ctx); return S.lastRun; }
  async function runAction(name, ctx) {
    const fn = M.actions[name];
    if (!fn) { P.problem(`no action "${name}"`); return; }
    try {
      const r = fn(S.store, ctx, P);
      render();
      if (r && typeof r.then === 'function') { await r; render(); }
    } catch (e) {
      console.error(e);
      P.problem(`action "${name}" threw: ${e && (e.message || e.code || e)}`);
      render();
    }
  }
  screenEl.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'FORM' || !screenEl.contains(el)) return;
    if (el.form && el.type === 'submit') return; // the form's submit handler runs it
    if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
    e.preventDefault();
    run(el.dataset.act, { arg: el.dataset.arg, el });
  });
  screenEl.addEventListener('submit', e => {
    const f = e.target;
    e.preventDefault();
    const name = (e.submitter && e.submitter.dataset.act) || f.dataset.act;
    if (!name) { P.problem('a form was submitted with no data-act'); return; }
    run(name, { values: Object.fromEntries(new FormData(f)), arg: e.submitter && e.submitter.dataset.arg, el: f });
  });
  const keep = e => {
    const el = e.target;
    if (!el.name || !S.store) return;
    const v = P.view();
    v.fields = v.fields || {};
    v.fields[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  };
  screenEl.addEventListener('input', keep);
  screenEl.addEventListener('change', keep);

  // ── settings ──────────────────────────────────────────────────────────
  P._setNet = n => { S.net = n; chrome(); };
  function setTheme(t) { ui.theme = t; if (t === 'system') delete root.dataset.theme; else root.dataset.theme = t; chrome(); }
  function setWidth(w) { ui.width = w; if (w === 'fit') delete root.dataset.width; else root.dataset.width = w; chrome(); }
  function setLang(l) { if (!M.meta.languages.includes(l)) return; S.lang = l; root.lang = l; S.missing.clear(); render(); }
  /** View as another actor: the store keeps its data; the screen goes to the actor's home. */
  function setActor(id) {
    const a = M.actors.find(x => x.id === id);
    if (!a || !S.store) { P.problem(`no actor "${id}"`); return false; }
    S.store.actor = id;
    try {
      if (typeof a.enter === 'function') a.enter(S.store, P);
      else if (a.home) { const scr = String(a.home).split('.')[0]; P.nav(scr, String(a.home).slice(scr.length + 1) || (S.store.view[scr] && S.store.view[scr].state) || 'ideal'); }
    } catch (e) { P.problem(`actor "${id}": enter threw: ${e.message}`); }
    render(); return true;
  }
  /** Move the mock's clock; the model's clock.onAdvance runs what time triggers. */
  function advance(spec) {
    if (!S.store) return false;
    const to = P._advance(P.now(), spec);
    if (!to) { P.problem(`clock: "${spec}" is not "+<n>m|h|d" or an ISO time`); return false; }
    S.store.clock = to.toISOString();
    try { M.clock && typeof M.clock.onAdvance === 'function' && M.clock.onAdvance(S.store, P); } catch (e) { P.problem(`clock.onAdvance threw: ${e.message}`); }
    render(); return true;
  }

  // ── router: #token~modifiers ─────────────────────────────────────────
  function route() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
    const [head, ...mods] = raw.split('~');
    S.bare = mods.includes('bare'); S.still = S.bare || mods.includes('still'); S.fast = mods.includes('fast') || S.bare;
    if (S.bare) root.dataset.bare = ''; else delete root.dataset.bare;
    if (S.still) root.dataset.still = ''; else delete root.dataset.still;
    for (const m of mods) {
      if (m === 'light' || m === 'dark') setTheme(m);
      else if (m === 'phone' || m === 'desktop') setWidth(m);
      else if (M.meta.languages.includes(m)) { S.lang = m; root.lang = m; }
      else if (m.startsWith('variant-') && M.variants.includes(m.slice(8))) S.variant = m.slice(8);
    }
    const play = head.match(/^play-(J\d+)(?:\.(s\d+))?$/);
    if (play) {
      const j = M.journeys.find(x => x.id === play[1]);
      if (j) return startJourney(j, play[2] ? j.steps.findIndex(x => x.id === play[2]) : 0);
    }
    const token = M.frames[head] ? head : ((R.length && R[ui.step].frame) || M.journeys[0]?.start || Object.keys(M.frames)[0]);
    if (head && !M.frames[head] && !play) P.problem(`#${head} is not a frame; showing ${token}`);
    if (token && load(token)) render(); else chrome();
  }
  addEventListener('hashchange', route);

  // ── journeys ──────────────────────────────────────────────────────────
  const wait = ms => new Promise(r => setTimeout(r, S.fast ? 0 : ms));
  const idle = async () => { while (S.pending > 0) await new Promise(r => setTimeout(r, 20)); };
  function ring(el) {
    document.querySelectorAll('.pr-ring').forEach(x => x.remove());
    if (!el) return;
    const d = device.getBoundingClientRect(), r = el.getBoundingClientRect();
    const ringEl = document.createElement('div');
    ringEl.className = 'pr-ring';
    Object.assign(ringEl.style, { left: (r.left - d.left - 2) + 'px', top: (r.top - d.top - 2) + 'px', width: (r.width + 4) + 'px', height: (r.height + 4) + 'px' });
    device.appendChild(ringEl);
    el.scrollIntoView({ block: 'nearest', behavior: S.still ? 'auto' : 'smooth' });
  }
  async function playStep(j, i) {
    const st = j.steps[i];
    ui.now = i; chrome();
    if (st.net) P._setNet(st.net);
    if (st.as || st.clock) {
      await wait(450);
      ui.since = S.seq;
      const ok0 = st.as ? setActor(st.as) : advance(st.clock);
      const ok = ok0 && P.frame() === st.expect;
      if (!ok) P.problem(`${j.id}.${st.id}: expected ${st.expect}, the mock shows ${P.frame()}`);
      else if (i + 1 < j.steps.length) ui.now = i + 1;
      chrome();
      return ok;
    }
    for (const [sel, val] of Object.entries(st.fill || {})) {
      const el = screenEl.querySelector(sel);
      if (!el) { P.problem(`${j.id}.${st.id}: fill target "${sel}" not on screen`); continue; }
      if (el.type === 'checkbox') el.checked = !!val; else el.value = val;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      await wait(120);
    }
    const t = screenEl.querySelector(st.target);
    if (!t) { P.problem(`${j.id}.${st.id}: target "${st.target}" not on screen at ${P.frame()}`); return false; }
    ring(t); await wait(450);
    ui.since = S.seq;
    const epoch = S.epoch;
    S.lastRun = null;
    if (t.form && t.type === 'submit') t.form.requestSubmit(t); else t.click();
    if (S.lastRun) await S.lastRun; else await idle();
    setTimeout(() => ring(null), S.fast ? 0 : 900);
    if (S.epoch !== epoch) return false;   // another state was loaded meanwhile: the play stops quietly
    const ok = P.frame() === st.expect;
    if (!ok) P.problem(`${j.id}.${st.id}: expected ${st.expect}, the mock shows ${P.frame()}`);
    else if (i + 1 < j.steps.length) ui.now = i + 1;
    chrome();
    return ok;
  }
  async function startJourney(j, upto) {
    ui.journey = j.id; ui.now = 0;
    load(j.start); render();
    if (upto > 0) {
      const fast = S.fast; S.fast = true;
      for (let i = 0; i < upto; i++) if (!(await playStep(j, i))) break;
      S.fast = fast;
    }
    ui.now = Math.max(0, upto);   // the step to play next
    chrome();
  }
  // ── chrome: one floating panel over the product, hidden to a handle (key H) ──
  const LABELS = {
    en: { controls: 'Controls', hide: 'Hide', review: 'Review', of: 'of', prev: 'Previous', next: 'Next step', done: 'Review complete', restart: 'Start over', all: 'All steps', check: 'Check', screen: 'Screen', state: 'State of this screen', viewAs: 'View as', variant: 'Design variant', clock: 'Clock', moveTo: 'Move to…', lang: 'Language', theme: 'Theme', width: 'Width', auto: 'Auto', light: 'Light', dark: 'Dark', fit: 'Fit', phone: 'Phone', desktop: 'Desktop', problems: 'mock problem(s)', keys: 'H hides · N next · P previous' },
    'pt-BR': { controls: 'Controles', hide: 'Ocultar', review: 'Revisão', of: 'de', prev: 'Anterior', next: 'Próxima etapa', done: 'Revisão completa', restart: 'Recomeçar', all: 'Todas as etapas', check: 'Confira', screen: 'Tela', state: 'Estado desta tela', viewAs: 'Ver como', variant: 'Variação de design', clock: 'Relógio', moveTo: 'Mover para…', lang: 'Idioma', theme: 'Tema', width: 'Largura', auto: 'Auto', light: 'Claro', dark: 'Escuro', fit: 'Ajustar', phone: 'Celular', desktop: 'Desktop', problems: 'problema(s) no mock', keys: 'H oculta · N próxima · P anterior' },
  };
  const uiLang = M.meta.uiLang || (/^pt/i.test(navigator.language || '') ? 'pt-BR' : 'en');
  const L = Object.assign({}, LABELS.en, LABELS[uiLang] || {}, M.meta.ui || {});

  // The review: an ordered path through every state he must see. The model's `review` when it has
  // one; else the journeys' starts and landings in order (the step's words as what to check), then
  // every other frame that is not debugOnly.
  const R = (() => {
    const out = [], seen = new Set();
    const add = (frame, check) => { if (M.frames[frame] && !seen.has(frame)) { seen.add(frame); out.push({ frame, check: check || '' }); } };
    if (M.review.length) { for (const r of M.review) add(r.frame, r.check); return out; }
    for (const j of M.journeys) { add(j.start, j.title); for (const st of j.steps) add(st.expect, st.do); }
    for (const [t, f] of Object.entries(M.frames)) if (!f.debugOnly) add(t, '');
    return out;
  })();
  const REVIEW_KEY = `mock-review:${M.meta.name}:v${V}`;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* a private window: it lasts this visit */ } },
  };
  ui.hidden = store.get('mock-controls-hidden', false);
  const saved = store.get(REVIEW_KEY, {});
  ui.step = Math.min(Number(saved.step) || 0, Math.max(R.length - 1, 0));
  ui.seen = new Set((saved.seen || []).filter(f => R.some(r => r.frame === f)));
  const saveReview = () => store.set(REVIEW_KEY, { step: ui.step, seen: [...ui.seen] });
  function setHidden(v) { ui.hidden = v; store.set('mock-controls-hidden', v); chrome(); }
  function goStep(i) {
    if (!R.length) return;
    ui.step = Math.max(0, Math.min(i, R.length - 1));
    saveReview();
    if (load(R[ui.step].frame)) render();
  }
  function restart() { ui.seen.clear(); goStep(0); }

  const seg = (name, cur, opts) => h`<span class="pr-seg" role="group" aria-label="${name}">${opts.map(([v, l]) => h`<button type="button" data-ui="${name}" data-v="${v}" aria-pressed="${String(cur === v)}">${l}</button>`)}</span>`;
  const pick = (name, label, cur, opts) => opts.length <= 4
    ? h`<div class="pr-field"><span>${label}</span>${seg(name, cur, opts)}</div>`
    : h`<label class="pr-field"><span>${label}</span><select data-ui="${name}" aria-label="${label}">${opts.map(([v, l]) => h`<option value="${v}" ${v === cur ? P.raw('selected') : ''}>${l}</option>`)}</select></label>`;
  const titleOf = t => (M.frames[t] && M.frames[t].title) || t;
  const screenTitle = s => (M.screens[s] && M.screens[s].title) || s;

  function reviewBlock() {
    if (!R.length) return '';
    const done = ui.seen.size >= R.length, r = R[ui.step], here = P.frame() === r.frame;
    const pct = Math.round(100 * ui.seen.size / R.length);
    return h`<section class="pr-review" aria-label="${L.review}">
      <div class="pr-rhead"><b>${L.review}</b><span>${ui.step + 1} ${L.of} ${R.length}</span></div>
      <div class="pr-meter" role="progressbar" aria-valuemin="0" aria-valuemax="${R.length}" aria-valuenow="${ui.seen.size}"><span style="width:${pct}%"></span></div>
      ${done ? h`<p class="pr-done">✓ ${L.done} · ${R.length}/${R.length}</p>` : ''}
      <div class="pr-now ${here ? '' : 'pr-off'}">
        <span class="pr-where">${screenTitle(r.frame.split('.')[0])} · ${titleOf(r.frame)}</span>
        ${r.check ? h`<span class="pr-check"><b>${L.check}:</b> ${r.check}</span>` : ''}
      </div>
      <div class="pr-nav">
        <button type="button" class="pr-btn" data-ui="prev" ${ui.step === 0 ? P.raw('disabled') : ''}>← ${L.prev}</button>
        ${ui.step < R.length - 1
          ? h`<button type="button" class="pr-btn pr-primary" data-ui="next">${L.next} →</button>`
          : h`<button type="button" class="pr-btn" data-ui="restart">↺ ${L.restart}</button>`}
      </div>
      <details class="pr-all"><summary>${L.all} (${ui.seen.size}/${R.length})</summary>
        <ol>${R.map((x, i) => h`<li><button type="button" data-ui="step" data-v="${i}" aria-current="${String(i === ui.step)}"><span class="pr-tick">${ui.seen.has(x.frame) ? '✓' : i + 1}</span>${screenTitle(x.frame.split('.')[0])} · ${titleOf(x.frame)}</button></li>`)}</ol>
      </details>
    </section>`;
  }

  function chrome() {
    if (!S.store) return;
    const scr = S.store.screen, cur = P.frame();
    if (R.some(r => r.frame === cur) && !ui.seen.has(cur)) { ui.seen.add(cur); saveReview(); }
    const states = Object.entries(M.frames).filter(([t]) => t.split('.')[0] === scr).map(([t, f]) => [t, f.title + (f.debugOnly ? ' (debug)' : '')]);
    const screens = Object.keys(M.screens).filter(s => Object.keys(M.frames).some(t => t.split('.')[0] === s));
    ctl.toggleAttribute('data-hidden', ui.hidden);
    if (ui.hidden) {
      ctl.innerHTML = String(h`<div class="pr-head"><button type="button" class="pr-handle" data-ui="hide" aria-expanded="false" aria-label="${L.controls}">${S.problems.length ? h`<span class="pr-dot" aria-hidden="true"></span>` : ''}${L.controls}${R.length ? h`<span class="pr-mini">${ui.seen.size}/${R.length}</span>` : ''}<kbd>H</kbd></button></div>`);
      return;
    }
    ctl.innerHTML = String(h`
      <div class="pr-head">
        <span class="pr-name">${M.meta.name}<span class="pr-ver">v${V}</span></span>
        <button type="button" class="pr-hide" data-ui="hide" aria-expanded="true">${L.hide} <kbd>H</kbd></button>
      </div>
      <div class="pr-body">
        ${reviewBlock()}
        ${screens.length > 1 ? pick('screen', L.screen, scr, screens.map(s => [s, screenTitle(s)])) : ''}
        ${states.length ? h`<div class="pr-field"><span>${L.state}</span>${seg('frame', cur, states)}</div>` : ''}
        ${M.actors.length > 1 ? pick('actor', L.viewAs, P.actor() || '', M.actors.map(a => [a.id, a.title])) : ''}
        ${M.variants.length > 1 ? pick('variant', L.variant, S.variant, M.variants.map(v => [v, v])) : ''}
        ${M.clock ? h`<label class="pr-field"><span>${L.clock} · ${P.fmt.date(P.now(), { dateStyle: 'medium', timeStyle: 'short' })}</span><select data-ui="clock" aria-label="${L.clock}"><option value="" selected>${L.moveTo}</option>${[['+1h', '+1h'], ['+1d', '+1d'], ['+7d', '+7d']].concat((M.clock.marks || []).map(k => [k.at, k.label])).map(([v, l]) => h`<option value="${v}">${l}</option>`)}</select></label>` : ''}
        ${M.meta.languages.length > 1 ? pick('lang', L.lang, S.lang, M.meta.languages.map(l => [l, l])) : ''}
        <div class="pr-row">
          <div class="pr-field"><span>${L.theme}</span>${seg('theme', ui.theme, [['system', L.auto], ['light', L.light], ['dark', L.dark]])}</div>
          <div class="pr-field"><span>${L.width}</span>${seg('width', ui.width, [['fit', L.fit], ['phone', L.phone], ['desktop', L.desktop]])}</div>
        </div>
        <span class="pr-token" title="#${cur}">#${cur} · ${L.keys}</span>
        ${S.problems.length ? h`<div class="pr-problems" role="alert">${S.problems.length} ${L.problems}:\n${S.problems.slice(-6).join('\n')}</div>` : ''}
      </div>`);
  }

  function toScreen(s) {
    const first = Object.keys(M.frames).find(t => t.split('.')[0] === s);
    if (first && load(first)) render();
  }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-ui]');
    if (!el || screenEl.contains(el) || el.tagName === 'SELECT' || el.disabled) return;
    const k = el.dataset.ui, v = el.dataset.v;
    if (k === 'hide') setHidden(!ui.hidden);
    else if (k === 'next') goStep(ui.step + 1);
    else if (k === 'prev') goStep(ui.step - 1);
    else if (k === 'restart') restart();
    else if (k === 'step') goStep(Number(v));
    else if (k === 'theme') setTheme(v);
    else if (k === 'width') setWidth(v);
    else if (k === 'frame') { if (load(v)) render(); }
    else if (k === 'screen') toScreen(v);
    else if (k === 'actor') setActor(v);
    else if (k === 'variant') { S.variant = v; render(); }
    else if (k === 'lang') setLang(v);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (!el.dataset || !el.dataset.ui || screenEl.contains(el) || !el.value) return;
    if (el.dataset.ui === 'screen') toScreen(el.value);
    else if (el.dataset.ui === 'lang') setLang(el.value);
    else if (el.dataset.ui === 'variant') { S.variant = el.value; render(); }
    else if (el.dataset.ui === 'actor') setActor(el.value);
    else if (el.dataset.ui === 'clock') advance(el.value);
  });
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || S.bare) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    const k = e.key.toLowerCase();
    if (k === 'h') setHidden(!ui.hidden);
    else if (k === 'n' && R.length) goStep(ui.step + 1);
    else if (k === 'p' && R.length) goStep(ui.step - 1);
    else return;
    e.preventDefault();
  });

  // ── SHELL API: the surface the walk, the frame renderer and the blind reader use ──
  window.proto = Object.freeze({
    version: Number(V),
    meta: () => clone(M.meta),
    frames: () => Object.entries(M.frames).map(([token, f]) => ({ token, title: f.title, debugOnly: !!f.debugOnly, terminal: !!f.terminal })),
    journeys: () => M.journeys.map(j => ({ id: j.id, title: j.title, actor: j.actor, job: j.job, start: j.start, rules: j.rules || [],
      steps: j.steps.map(st => ({ id: st.id, do: st.do, target: st.target || null, as: st.as || null, clock: st.clock || null, fill: st.fill || {}, net: st.net || null, expect: st.expect, see: st.see || [], effects: st.effects || [], rules: st.rules || [] })) })),
    actors: () => M.actors.map(a => ({ id: a.id, title: a.title, home: a.home || null })),
    actor: () => P.actor(),
    as: id => setActor(id),
    now: () => P.now().toISOString(),
    advance: spec => advance(spec),
    copyKeys: () => Object.fromEntries(M.meta.languages.map(l => [l, Object.keys(M.copy[l] || {})])),
    copy: () => clone(M.copy),
    actions: () => Object.keys(M.actions),
    t: (key, lang) => { const l = S.lang; if (lang) S.lang = lang; const out = P.t(key); S.lang = l; return out; },
    go: token => { const ok = load(token); if (ok) render(); return ok; },
    frame: () => P.frame(),
    idle: () => S.pending === 0,
    setNet: n => P._setNet(n),
    setLang: l => setLang(l),
    effects: () => S.effects.map(({ _seq, ...e }) => e),
    requests: () => S.requests.map(({ _seq, ...r }) => r),
    missing: () => [...S.missing],
    problems: () => S.problems.slice(),
    reached: () => [...S.reached],
    review: () => R.map(r => ({ ...r })),
  });

  root.lang = S.lang;
  route();
})();
</script>
