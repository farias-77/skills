<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How an order moves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* layout: one column, a stage that holds the picture, the step text under it */
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --ink: #17181a; --ink-2: #55585e; --line: #dedcd6; --accent: #2f6fdb; --accent-soft: #e3ecfb;
    --ok: #1f8a4c; --bad: #c2362b;
    --f-display: 'Bricolage Grotesque', Georgia, serif; --f-body: 'Atkinson Hyperlegible', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121315; --surface: #1b1c1f; --ink: #eceae6; --ink-2: #a7a9ae; --line: #2c2e33; --accent: #7aa7f5; --accent-soft: #1d2a40; --ok: #4cc37f; --bad: #f0786c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #121315; --surface: #1b1c1f; --ink: #eceae6; --ink-2: #a7a9ae; --line: #2c2e33; --accent: #7aa7f5; --accent-soft: #1d2a40; --ok: #4cc37f; --bad: #f0786c; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 var(--f-body); padding-inline: 16px; padding-block: 32px 64px; }
  .page { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .page > * { min-width: 0; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { margin: 0; font: 700 clamp(30px, 5vw, 44px)/1.08 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
  .lede { margin: 10px 0 0; color: var(--ink-2); max-width: 62ch; }
  .theme { flex: none; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--f-body); cursor: pointer; }
  .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; overflow-x: auto; }
  .stage svg { display: block; width: 100%; min-width: 560px; height: auto; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 2; transition: fill .3s, stroke .3s; }
  .node text { fill: var(--ink); font: 700 18px var(--f-body); }
  .node.on rect { fill: var(--accent-soft); stroke: var(--accent); }
  .edge { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .6s cubic-bezier(.16, 1, .3, 1); }
  .edge.on { stroke-dashoffset: 0; }
  .step { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: baseline; }
  .step .k { font: 500 14px var(--f-mono); color: var(--accent); }
  .step h2 { margin: 0; font: 700 24px/1.25 var(--f-display); }
  .step p { grid-column: 2; margin: 0; color: var(--ink-2); max-width: 62ch; }
  .nav { display: flex; align-items: center; gap: 12px; }
  .nav button { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 700 15px var(--f-body); cursor: pointer; }
  .nav button[disabled] { opacity: .4; cursor: default; }
  .bar { flex: 1; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .edge, .node rect, .bar i { transition: none; } }
</style>
</head>
<body>
<main class="page">
  <header>
    <div><h1>How an order moves</h1><p class="lede">Three parts, one direction. Step through it.</p></div>
    <button class="theme" type="button" id="theme">Theme</button>
  </header>
  <div class="stage" role="img" aria-label="App, API, queue and worker, connected left to right">
    <svg viewBox="0 0 900 160">
      <path class="edge" id="e1" pathLength="1" d="M180 80 H260"></path>
      <path class="edge" id="e2" pathLength="1" d="M420 80 H500"></path>
      <path class="edge" id="e3" pathLength="1" d="M660 80 H740"></path>
      <g class="node" id="n0"><rect x="20" y="40" width="160" height="80" rx="12"></rect><text x="100" y="86" text-anchor="middle">App</text></g>
      <g class="node" id="n1"><rect x="260" y="40" width="160" height="80" rx="12"></rect><text x="340" y="86" text-anchor="middle">API</text></g>
      <g class="node" id="n2"><rect x="500" y="40" width="160" height="80" rx="12"></rect><text x="580" y="86" text-anchor="middle">Queue</text></g>
      <g class="node" id="n3"><rect x="740" y="40" width="140" height="80" rx="12"></rect><text x="810" y="86" text-anchor="middle">Worker</text></g>
    </svg>
  </div>
  <div class="step" aria-live="polite"><span class="k" id="k"></span><h2 id="t"></h2><p id="d"></p></div>
  <div class="nav"><button type="button" id="prev">← Back</button><div class="bar"><i id="bar"></i></div><button type="button" id="next">Next →</button></div>
</main>
<script>
const steps = [
  {t: 'The customer taps Buy', d: 'The app sends the order once.', on: ['n0']},
  {t: 'The API writes it', d: 'The order is saved before anything else happens.', on: ['n0', 'n1', 'e1']},
  {t: 'The charge waits in a queue', d: 'If the bank is slow, nothing is lost.', on: ['n0', 'n1', 'n2', 'e1', 'e2']},
  {t: 'A worker charges it', d: 'It retries three times, then flags it for a person.', on: ['n0', 'n1', 'n2', 'n3', 'e1', 'e2', 'e3']},
];
let i = 0;
const $ = (id) => document.getElementById(id);
function show() {
  const s = steps[i];
  document.querySelectorAll('.node, .edge').forEach((el) => el.classList.toggle('on', s.on.includes(el.id)));
  $('k').textContent = `${i + 1}/${steps.length}`;
  $('t').textContent = s.t;
  $('d').textContent = s.d;
  $('bar').style.width = `${((i + 1) / steps.length) * 100}%`;
  $('prev').disabled = i === 0;
  $('next').disabled = i === steps.length - 1;
}
$('prev').onclick = () => { i = Math.max(0, i - 1); show(); };
$('next').onclick = () => { i = Math.min(steps.length - 1, i + 1); show(); };
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); });
const themes = [null, 'light', 'dark'];
let ti = 0;
try { ti = Math.max(0, themes.indexOf(localStorage.getItem('theme'))); } catch {}
function theme() {
  const t = themes[ti];
  t ? document.documentElement.setAttribute('data-theme', t) : document.documentElement.removeAttribute('data-theme');
  $('theme').textContent = `Theme: ${t || 'auto'}`;
  try { t ? localStorage.setItem('theme', t) : localStorage.removeItem('theme'); } catch {}
}
$('theme').onclick = () => { ti = (ti + 1) % themes.length; theme(); };
theme();
show();
</script>
</body>
</html>
