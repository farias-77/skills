      ${decG ? kickG(S.rev.decisions, decG) : ''}
      ${(RVG.residue || []).length ? kickG(S.eye.residue, `<div>${RVG.residue.map(fResG).join('')}</div>`) : ''}
      ${fold(`${SG.rev.conductor} · ${(RVG.conductorRulings || []).length}`, (RVG.conductorRulings || []).map(fCondG).join('') || `<p style="color:var(--ink-3)">${S.rev.nothing}</p>`, false)}
      ${fold(`${S.rev.dismissedList} · ${(RVG.dismissed || []).length}`, (RVG.dismissed || []).map(fDisG).join('') || `<p style="color:var(--ink-3)">${S.rev.nothing}</p>`, false)}
      ${fold(S.rev.round + 's', roundsG, false)}`);
  }

  // ================= execution tab (only when stage 4 left its data; read against the plan) =================
  if (D.execution && D.plan) {
    TAB = 'execution';
    const X = D.execution, SX = S.execution, SA = SX.audit, G4 = D.plan.plan, E4 = G4.entries, RP4 = X.report, AU = X.audit;
    const tbl4 = (heads, rows, cls) => `<div class="tbl-wrap ${cls || ''}"><table><thead><tr>${heads.map(h => `<th${h.startsWith('#') && h.length > 1 ? ' class="num"' : ''}>${h.length > 1 ? h.replace(/^#/, '') : h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr${r.cls ? ` class="${r.cls}"` : ''}>${(r.cells || r).map(c => `<td${typeof c === 'number' ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const kick4 = (t, inner) => `<div><span class="kicker">${t}</span><div style="margin-top:8px">${inner}</div></div>`;
    const PILL = { merged: 'good', parked: 'bad', building: 'acc', waiting: 'mute' };
    const stPill = st => `<span class="pill ${PILL[st] || 'mute'}">${SX.status[st] || esc(st)}</span>`;
    const byId4 = Object.fromEntries(X.entries.map(e => [e.id, e]));
    const stOf = id => byId4[id]?.status || 'waiting';
    const xlink = id => byId4[id] ? `<a class="chip" href="#xentry-${esc(id)}">${esc(id)}</a>` : `<span class="chip">${esc(id)}</span>`;
    const planned = X.entries.filter(e => e.id === 'F' || E4.some(p => p.id === e.id));
    const mergedN = planned.filter(e => e.status === 'merged').length, parkedN = X.entries.filter(e => e.status === 'parked').length;
    const roundsN = X.entries.reduce((a, e) => a + e.rounds, 0), foundN = X.entries.reduce((a, e) => a + e.found, 0), sustN = X.entries.reduce((a, e) => a + e.sustained, 0);

    // ---- 1. what got built, and what waits ----
    sec('exec-what', SX.sec.what, null, `
      <div class="hero">
        <h1>${md(RP4.inOneSentence)}</h1>
        <div class="meta"><span>${SX.started} ${esc(X.started)}</span><span>${SX.closed} ${X.closed ? esc(X.closed) : '—'}</span><span>${S.slug} <code>${D.workstream.slug}</code></span></div>
        <div class="xhead"><span><b>${SX.branch}</b><code>${esc(X.branch)}</code></span><span><b>${SX.head}</b><code>${esc(X.head)}</code></span><span><b>${SX.gate}</b>${md(X.gate)}</span></div>
        <div><span class="kicker">${S.threeThings}</span><div class="three">${RP4.threeThings.map(t => `<div class="th"><b>${md(t.t)}</b><p>${md(t.p)}</p></div>`).join('')}</div></div>
        <div class="cells">
          <div class="cell"><span class="v">${mergedN}/${planned.length}</span><span class="l">${SX.cells.merged}</span><span class="s">${SX.cells.mergedTail}</span></div>
          <div class="cell"><span class="v">${parkedN}</span><span class="l">${SX.cells.parked}</span><span class="s">${SX.cells.parkedTail}</span></div>
          <div class="cell"><span class="v">${X.amendments.length}</span><span class="l">${SX.cells.amendments}</span><span class="s">${SX.cells.amendmentsTail}</span></div>
          <div class="cell"><span class="v">${roundsN}</span><span class="l">${SX.cells.rounds}</span><span class="s">${SX.cells.roundsTail}</span></div>
          <div class="cell"><span class="v">${foundN}</span><span class="l">${SX.cells.findings}</span><span class="s">${SX.cells.findingsTail.replace('{n}', sustN)}</span></div>
        </div>
        <div class="eye"><span class="kicker">${S.eye.title}</span>${RP4.needsYourEye.length ? `<ul>${RP4.needsYourEye.map(e => `<li><b>${md(e.t)}</b> — ${md(e.p)}</li>`).join('')}</ul>` : `<p class="none">${S.eye.none}</p>`}</div>
      </div>`);

    // ---- 2. the graph: the plan's, each node in its state ----
    const nid = id => 'n_' + String(id).replace(/[^A-Za-z0-9]/g, '_');
    const lbl = t => String(t).replace(/[`*]/g, '').replace(/"/g, '#quot;');
    const mark = st => st === 'merged' ? '✓ ' : st === 'parked' ? '✕ ' : '';
    const roots4 = E4.filter(e => !e.after.length);
    const mer = ['flowchart LR', `  F0["${lbl(mark(stOf('F')) + S.plan.foundationNode)}"]`, ...E4.map(e => `  ${nid(e.id)}["${lbl(`${mark(stOf(e.id))}${e.id} · ${e.name}`)}"]`),
      ...roots4.map(e => `  F0 --> ${nid(e.id)}`), ...E4.flatMap(e => e.after.map(a => `  ${nid(a)} --> ${nid(e.id)}`)),
      '  classDef xmerged stroke-width:2px', '  classDef xparked stroke-width:3px', '  classDef xbuilding stroke-width:2px,stroke-dasharray:6 4', '  classDef xwaiting stroke-width:1px',
      `  class F0 x${stOf('F')}`, ...E4.map(e => `  class ${nid(e.id)} x${stOf(e.id)}`)].join('\n');
    const legend = `<div class="xleg">${['merged', 'building', 'waiting', 'parked'].map(k => `<span><i class="${k}">${k === 'parked' ? '✕' : ''}</i>${SX.status[k]}</span>`).join('')}</div>`;
    sec('exec-graph', SX.sec.graph, null, `<p class="plain">${md(RP4.entriesPlain)}</p>
      <figure class="xgraph"><pre class="mermaid">${esc(mer)}</pre>${legend}<figcaption>${SX.caption}</figcaption></figure>`);

    // ---- 3. the entries, then the amendments to the foundation ----
    const kindOf = e => e.id === 'F' ? SX.kinds.F : /^F\.\d+$/.test(e.id) ? SX.kinds.amendment : /^X\.\d+$/.test(e.id) ? SX.kinds.fix : (E4.find(p => p.id === e.id)?.name || '');
    const rows = X.entries.map(e => [
      `<code id="xentry-${esc(e.id)}">${esc(e.id)}</code><span class="rid">${md(kindOf(e))}</span>`,
      `${stPill(e.status)}${e.parked ? `<span class="rid">${SX.parkedOn} <a href="#xa-${esc(e.parked)}">${esc(e.parked)}</a></span>` : ''}`,
      e.sha ? `<code>${esc(e.sha)}</code>` : '—', e.rounds, `${e.found} → ${e.sustained}`, md(e.summary)]);
    const amend = X.amendments.length ? tbl4([SX.amendTable.id, SX.amendTable.what, SX.amendTable.for, SX.amendTable.sha], X.amendments.map(a => [`<code>${esc(a.id)}</code>`, md(a.what), xlink(a.for), a.sha ? `<code>${esc(a.sha)}</code>` : '—']))
      : `<p class="plain" style="color:var(--ink-3)">${SX.noAmendments}</p>`;
    sec('exec-entries', SX.sec.entries, null, `${tbl4([SX.table.id, SX.table.status, SX.table.sha, '#' + SX.table.rounds, SX.table.findings, SX.table.summary], rows, 'xent')}
      ${kick4(`${SX.amendments} · ${X.amendments.length}`, amend)}`);

    // ---- 4. the review: how precise each reviewer was ----
    const PK = ['found', 'sustained', 'deferred', 'latitude', 'dismissed', 'user'];
    const ratio = p => p.found ? `${Math.round(100 * p.sustained / p.found)}%` : '—';
    const sumP = Object.fromEntries(PK.map(k => [k, X.precision.reduce((a, p) => a + p[k], 0)]));
    const prec = X.precision.length ? tbl4([SX.prec.lens, ...PK.map(k => '#' + SX.prec[k]), '#' + SX.prec.ratio],
      [...X.precision.map(p => [`<code>${esc(p.lens)}</code>`, ...PK.map(k => p[k]), `<b>${ratio(p)}</b>`]), { cls: 'tot', cells: [SX.prec.total, ...PK.map(k => sumP[k]), `<b>${ratio(sumP)}</b>`] }], 'xprec')
      : `<p class="plain" style="color:var(--ink-3)">${SX.noPrecision}</p>`;
    sec('exec-review', SX.sec.review, null, `<p class="plain">${md(RP4.reviewPlain)}</p>${kick4(SX.precTitle, prec)}`);

    // ---- 5. the audit: parked first, then the choices, then the latitude ----
    const RULING = { keep: 'good', fix: 'acc', revert: 'bad' };
    const rPill = r => r == null ? `<span class="pill warn">${SA.awaiting}</span>` : RULING[r] ? `<span class="pill ${RULING[r]}">${SA.rulings[r]}</span>` : `<span class="pill acc">${SA.ruled}</span>`;
    const rText = r => r != null && !RULING[r] ? `<span>${SA.ruling}</span><span>${md(r)}</span>` : '';
    const head = i => `<div class="h"><span class="chip">${esc(i.id)}</span><b>${md(i.title)}</b>${rPill(i.ruling)}${i.words ? `<span class="words">“${md(i.words)}”</span>` : ''}</div>`;
    const parked = AU.parked.map(i => `<div class="aud" id="xa-${esc(i.id)}">${head(i)}<p class="pl">${md(i.why)}</p>
      <div class="kv"><span>${SA.entry}</span><span>${xlink(i.entry)}</span><span>${SA.recommendation}</span><span>${md(i.recommendation)}</span>${rText(i.ruling)}</div></div>`).join('');
    const choices = AU.choices.map(i => `<div class="aud" id="xa-${esc(i.id)}">${head(i)}<p class="pl">${md(i.chosen)}</p>
      <div class="kv"><span>${SA.entry}</span><span>${xlink(i.entry)}</span><span>${SA.where}</span><span>${md(i.where)}</span><span>${SA.recommendation}</span><span>${SA.rulings[i.recommendation] || esc(i.recommendation)}</span>${rText(i.ruling)}</div></div>`).join('');
    const lat = AU.latitude.length ? tbl4([SA.latTable.entry, SA.latTable.what], AU.latitude.map(l => [xlink(l.entry), md(l.what)])) : `<p style="color:var(--ink-3)">${SA.none}</p>`;
    const items = [...AU.parked, ...AU.choices], ruledN = items.filter(i => i.ruling != null).length;
    sec('exec-audit', SX.sec.audit, null, `
      <div class="cells"><div class="cell"><span class="v">${items.length}</span><span class="l">${SA.items}</span><span class="s">${SA.itemsTail.replace('{n}', ruledN)}</span></div>
        <div class="cell"><span class="v">${AU.latitude.length}</span><span class="l">${SA.latitudeCell}</span><span class="s">${SA.latitudeTail}</span></div></div>
      <p class="plain" style="color:var(--ink-3)">${X.closed ? SA.closedOn.replace('{d}', esc(X.closed)) : SA.openNote}</p>
      ${kick4(`${SA.parked} · ${AU.parked.length}`, parked || `<p style="color:var(--ink-3)">${SA.none}</p>`)}
      ${kick4(`${SA.choices} · ${AU.choices.length}`, choices || `<p style="color:var(--ink-3)">${SA.none}</p>`)}
      ${kick4(`${SA.latitude} · ${AU.latitude.length}`, lat)}`);
  }

  // ================= release tab (only when stage 5 left its data; read against the plan and the execution record) =================
  if (D.release && D.execution) {
    TAB = 'release';
    const L = D.release, SL = S.release, RP5 = L.report, X5 = D.execution;
    const tbl5 = (heads, rows, cls) => `<div class="tbl-wrap ${cls || ''}"><table><thead><tr>${heads.map(h => `<th${h.startsWith('#') && h.length > 1 ? ' class="num"' : ''}>${h.length > 1 ? h.replace(/^#/, '') : h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr${r.cls ? ` class="${r.cls}"` : ''}>${(r.cells || r).map(c => `<td${typeof c === 'number' ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const kick5 = (t, inner) => `<div><span class="kicker">${t}</span><div style="margin-top:8px">${inner}</div></div>`;
    const none5 = t => `<p class="plain" style="color:var(--ink-3)">${t}</p>`;
    const code5 = v => v == null || v === '' ? '—' : `<code>${esc(v)}</code>`;
    const okPill = ok => `<span class="pill ${ok ? 'good' : 'bad'}">${ok ? SL.ok : SL.red}</span>`;
    const isRead = r => r.readAt != null && r.got != null && r.ok != null;
    const green = L.staging.filter(s => s.ok).length, red = L.staging.length - green;
    const openFixes = L.fixes.filter(f => !f.sha).length, rollbacks = L.production.filter(p => p.rolledBack).length;
    const readN = L.watch.filter(isRead).length, ownedN = L.watch.filter(r => !isRead(r) && r.owner != null).length;
    const fixLink = id => id ? `<a class="chip" href="#rfix-${esc(id)}">${esc(id)}</a>` : '—';
    const ansPill = a => `<span class="pill ${a === 'go' ? 'good' : 'warn'}">${SL.answers[a] || esc(a)}</span>`;

    // ---- 1. what went to production ----
    const askBox = L.asks.length ? L.asks.map(a => `<div class="ask"><span class="words">“${esc(a.words)}”</span>${ansPill(a.answer)}<span class="when">${esc(a.at)}${a.pr ? ` · ${SL.pr} #${esc(a.pr)}` : ''}</span></div>`).join('') : `<p style="color:var(--ink-3)">${SL.noAsk}</p>`;
    sec('rel-what', SL.sec.what, null, `
      <div class="hero">
        <h1>${md(RP5.inOneSentence)}</h1>
        <div class="meta"><span>${SL.started} ${esc(L.started)}</span><span>${SL.closed} ${L.closed ? esc(L.closed) : '—'}</span><span>${S.slug} <code>${D.workstream.slug}</code></span></div>
        <div><span class="kicker">${S.threeThings}</span><div class="three">${RP5.threeThings.map(t => `<div class="th"><b>${md(t.t)}</b><p>${md(t.p)}</p></div>`).join('')}</div></div>
        <div class="cells">
          <div class="cell"><span class="v">${L.inProduction.length}</span><span class="l">${SL.cells.inProd}</span><span class="s">${L.inProduction.map(p => `${esc(p.artifact)} ${esc(p.version)}`).join(' · ') || SL.cells.inProdNone}</span></div>
          <div class="cell"><span class="v">${L.staging.length}</span><span class="l">${SL.cells.staging}</span><span class="s">${SL.cells.stagingTail.replace('{g}', green).replace('{r}', red)}</span></div>
          <div class="cell"><span class="v">${L.fixes.length}</span><span class="l">${SL.cells.fixes}</span><span class="s">${SL.cells.fixesTail.replace('{n}', openFixes)}</span></div>
          <div class="cell"><span class="v">${rollbacks}</span><span class="l">${SL.cells.rollbacks}</span><span class="s">${SL.cells.rollbacksTail.replace('{n}', L.production.length)}</span></div>
          <div class="cell"><span class="v">${readN}/${L.watch.length}</span><span class="l">${SL.cells.watch}</span><span class="s">${SL.cells.watchTail.replace('{n}', ownedN)}</span></div>
        </div>
        <div class="askbox"><span class="kicker">${SL.askTitle}</span>${askBox}</div>
        <div class="eye"><span class="kicker">${S.eye.title}</span>${RP5.needsYourEye.length ? `<ul>${RP5.needsYourEye.map(e => `<li><b>${md(e.t)}</b> — ${md(e.p)}</li>`).join('')}</ul>` : `<p class="none">${S.eye.none}</p>`}</div>
      </div>`);

    // ---- 2. the path: feature branch → staging → the ask → production ----
    const events = [...L.staging.map(s => ({ k: 'staging', at: s.at, s })), ...L.asks.map(a => ({ k: 'ask', at: a.at, s: a })), ...L.production.map(p => ({ k: 'production', at: p.at, s: p }))]
      .sort((a, b) => a.at < b.at ? -1 : a.at > b.at ? 1 : ['staging', 'ask', 'production'].indexOf(a.k) - ['staging', 'ask', 'production'].indexOf(b.k));
    const lbl5 = t => String(t).replace(/[`*]/g, '').replace(/"/g, '#quot;');
    const nodes = ['flowchart LR', `  feat["${lbl5(`${SL.path.feat} · ${X5.branch}`)}"]`], klass = [];
    let prev = 'feat';
    events.forEach((e, i) => {
      const id = `e${i}`;
      if (e.k === 'ask') { nodes.push(`  ${id}{{"${lbl5(`${SL.path.ask} · “${e.s.words}”`)}"}}`); klass.push(`  class ${id} ${e.s.answer === 'go' ? 'xbuilding' : 'xwaiting'}`); }
      else { const ok = e.s.ok && !e.s.rolledBack; nodes.push(`  ${id}["${lbl5(`${ok ? '✓' : '✕'} ${SL.path[e.k].replace('{n}', e.s.n)}`)}"]`); klass.push(`  class ${id} ${ok ? 'xmerged' : 'xparked'}`); }
      nodes.push(`  ${prev} --> ${id}`); prev = id;
      if (e.s.fix && e.k !== 'ask') { const f = `f${i}`; nodes.push(`  ${f}["${lbl5(`${SL.path.fix} ${e.s.fix}`)}"]`, `  ${id} -.-> ${f}`); klass.push(`  class ${f} xwaiting`); }
    });
    const mer5 = [...nodes, '  classDef xmerged stroke-width:2px', '  classDef xparked stroke-width:3px', '  classDef xbuilding stroke-width:2px,stroke-dasharray:6 4', '  classDef xwaiting stroke-width:1px', ...klass].join('\n');
    const leg5 = `<div class="xleg"><span><i class="merged"></i>${SL.ok}</span><span><i class="parked">✕</i>${SL.red}</span><span><i class="building"></i>${SL.path.ask}</span><span><i class="waiting"></i>${SL.path.fix}</span></div>`;
    const stepRows = events.map(e => {
      const x = e.s;
      if (e.k === 'ask') return { cls: 'askrow', cells: [`<b>${SL.path.ask}</b>`, esc(x.at), x.pr ? `${SL.pr} #${esc(x.pr)}` : '—', ansPill(x.answer), `<i>“${esc(x.words)}”</i>`, '—', '—'] };
      const red = !x.ok || x.rolledBack;
      const result = `${okPill(x.ok)}${x.rolledBack ? `<span class="rid">${SL.rolledBack}</span>` : ''}${x.cause ? `<span class="rid">${SL.cause[x.cause] || esc(x.cause)}</span>` : ''}`;
      const what = `${md(e.k === 'staging' ? x.summary : x.checks)}${x.proof ? `<span class="rid">${esc(x.proof)}</span>` : ''}`;
      return { cls: red ? 'red' : '', cells: [`<b>${SL.path[e.k].replace('{n}', esc(x.n))}</b>${x.pr ? `<span class="rid">${SL.pr} #${esc(x.pr)}</span>` : ''}`, esc(x.at), code5(x.run), result, what, e.k === 'production' ? md(x.verified) : '—', fixLink(x.fix)] };
    });
    const T = SL.path.table;
    const pre = (L.preflight || []).length ? tbl5([SL.preflight.item, SL.preflight.status], L.preflight.map(p => [md(p.item), `<span class="pill ${p.status === 'done' ? 'good' : 'warn'}">${SL.preflight.statuses[p.status] || esc(p.status)}</span>`])) : none5(SL.preflight.none);
    sec('rel-path', SL.sec.path, SL.path.lede, `
      <figure class="xgraph rflow"><pre class="mermaid">${esc(mer5)}</pre>${leg5}<figcaption>${SL.path.caption}</figcaption></figure>
      ${events.length ? tbl5([T.step, T.at, T.run, T.result, T.what, T.verified, T.fix], stepRows, 'rsteps') : none5(SL.path.none)}
      ${kick5(`${SL.preflight.title} · ${(L.preflight || []).length}`, pre)}`);

    // ---- 3. versions, what shipped, what is in production ----
    const V = SL.versions;
    const vers = L.versions.length ? tbl5([V.artifact, V.from, V.to, V.bump, '#' + V.commits, '#' + V.unparsed, V.notes], L.versions.map(v => [`<code>${esc(v.artifact)}</code>`, v.from ? esc(v.from) : '—', `<b>${esc(v.to)}</b>`, `<span class="pill mute">${V.bumps[v.bump] || esc(v.bump)}</span>`, v.commits, v.unparsed, `<code>${esc(v.notes)}</code>`]), 'rvers') : none5(V.none);
    const inProd = L.inProduction.length ? tbl5([V.artifact, V.version, V.sha, V.at], L.inProduction.map(p => [`<code>${esc(p.artifact)}</code>`, `<b>${esc(p.version)}</b>`, code5(p.sha), esc(p.at)])) : none5(V.noneInProd);
    const chips5 = ids => ids.length ? `<div class="chipline">${ids.map(id => `<span class="chip">${esc(id)}</span>`).join('')}</div>` : `<span style="color:var(--ink-3)">—</span>`;
    const shipped = `<div class="rel-blocks"><div>${kick5(`${V.entries} · ${L.ships.entries.length}`, chips5(L.ships.entries))}</div><div>${kick5(`${V.amendments} · ${L.ships.amendments.length}`, chips5(L.ships.amendments))}</div>
      <div>${kick5(`${V.residue} · ${L.ships.residue.length}`, L.ships.residue.length ? `<ul class="rules">${L.ships.residue.map(r => `<li>${md(r)}</li>`).join('')}</ul>` : `<span style="color:var(--ink-3)">${V.noResidue}</span>`)}</div></div>`;
    sec('rel-versions', SL.sec.versions, null, `<div class="rel-blocks">${kick5(V.inProdTitle, inProd)}${kick5(V.title, vers)}${kick5(V.shipsTitle, shipped)}</div>`);

    // ---- 4. the fixes ----
    const FX = SL.fixes;
    const fixRows = L.fixes.map(f => ({ cls: f.sha ? '' : 'red', cells: [`<code id="rfix-${esc(f.id)}">${esc(f.id)}</code>`, `<span class="pill mute">${FX.kinds[f.kind] || esc(f.kind)}</span>`, md(f.what), f.rounds, f.sha ? code5(f.sha) : `<span class="pill warn">${FX.open}</span>`, `<code>${esc(f.run)}</code>`] }));
    sec('rel-fixes', SL.sec.fixes, null, L.fixes.length ? tbl5([FX.id, FX.kind, FX.what, '#' + FX.rounds, FX.sha, FX.run], fixRows, 'rsteps rfix') : none5(FX.none));

    // ---- 5. the watch and the pendencies ----
    const WT = SL.watch;
    const wState = r => isRead(r) ? `<span class="pill ${r.ok ? 'good' : 'bad'}">${r.ok ? WT.readOk : WT.readBad}</span><span class="rid">${WT.readAt.replace('{at}', esc(r.readAt))}</span>`
      : r.owner != null ? `<span class="pill acc">${WT.owned}</span><span class="rid">${esc(r.owner)}</span>` : `<span class="pill warn">${WT.waiting}</span><span class="rid">${WT.until.replace('{at}', esc(r.readableAt))}</span>`;
    const wRows = L.watch.map(r => ({ cls: isRead(r) && !r.ok ? 'red' : '', cells: [r.n, md(r.what), esc(r.readableAt), md(r.expects), wState(r), r.got != null ? md(r.got) : '—'] }));
    const pend5 = L.pendencies.length ? tbl5([SL.pendencies.what, SL.pendencies.owner], L.pendencies.map(p => [md(p.what), `<b>${md(p.owner)}</b>`])) : none5(SL.pendencies.none);
    sec('rel-watch', SL.sec.watch, null, `
      <p class="plain" style="color:var(--ink-3)">${L.closed ? SL.closedOn.replace('{d}', esc(L.closed)) : SL.openNote}</p>
      ${L.watch.length ? tbl5(['#' + WT.n, WT.what, WT.readableAt, WT.expects, WT.state, WT.got], wRows, 'rwatch') : none5(WT.none)}
      ${kick5(`${SL.pendencies.title} · ${L.pendencies.length}`, pend5)}`);
  }

  // ================= close tab (only when stage 6 left its retro; read against a closed release) =================
  if (D.retro && D.release && D.release.closed) {
    TAB = 'close';
    const C = D.retro, SC = S.close, N = C.numbers, RP6 = C.report;
    const tbl6 = (heads, rows, cls) => `<div class="tbl-wrap ${cls || ''}"><table><thead><tr>${heads.map(h => `<th${h.startsWith('#') && h.length > 1 ? ' class="num"' : ''}>${h.length > 1 ? h.replace(/^#/, '') : h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr${r.cls ? ` class="${r.cls}"` : ''}>${(r.cells || r).map(c => typeof c === 'object' && c ? `<td${c.span ? ` colspan="${c.span}"` : ''}>${c.html}</td>` : `<td${typeof c === 'number' ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const kick6 = (t, inner) => `<div><span class="kicker">${t}</span><div style="margin-top:8px">${inner}</div></div>`;
    const none6 = t => `<p class="plain" style="color:var(--ink-3)">${t}</p>`;
    const nv = v => v == null ? '—' : esc(v);
    const pct = (s, f) => f ? Math.round(100 * s / f) : null;
    const stageChip = s => `<span class="chip">${SC.stages[s] || esc(s)}</span>`;
    const idLink = id => `<a class="chip" href="#cl-${esc(id)}">${esc(id)}</a>`;
    const pipelineN = C.ideas.filter(i => i.lands === 'pipeline').length;
    const sustainedP = pct(N.sustained, N.found);

    // ---- 1. what: the workstream in one sentence, three things, the cells ----
    sec('cl-what', SC.sec.what, null, `
      <div class="hero">
        <h1>${md(RP6.inOneSentence)}</h1>
        <div class="meta"><span>${SC.closedOn} ${C.closed ? esc(C.closed) : '—'}</span><span>${S.slug} <code>${D.workstream.slug}</code></span></div>
        <div><span class="kicker">${S.threeThings}</span><div class="three">${RP6.threeThings.map(t => `<div class="th"><b>${md(t.t)}</b><p>${md(t.p)}</p></div>`).join('')}</div></div>
        <div class="cells ccells">
          <div class="cell"><span class="v">${nv(N.days)}</span><span class="l">${SC.cells.days}</span></div>
          <div class="cell"><span class="v">${nv(N.entries)}</span><span class="l">${SC.cells.entries}</span></div>
          <div class="cell"><span class="v">${nv(N.found)} → ${nv(N.sustained)}</span><span class="l">${SC.cells.findings}</span><span class="s">${sustainedP == null ? '—' : SC.cells.findingsTail.replace('{p}', sustainedP)}</span></div>
          <div class="cell"><span class="v">${nv(N.parked)}</span><span class="l">${SC.cells.parked}</span></div>
          <div class="cell"><span class="v">${nv(N.stagingReds)}</span><span class="l">${SC.cells.stagingReds}</span><span class="s">${SC.cells.stagingRedsTail.replace('{n}', nv(N.stagingRuns))}</span></div>
          <div class="cell"><span class="v">${nv(N.fixes)}</span><span class="l">${SC.cells.fixes}</span></div>
          <div class="cell"><span class="v">${C.ideas.length}</span><span class="l">${SC.cells.ideas}</span><span class="s">${SC.cells.ideasTail.replace('{n}', pipelineN)}</span></div>
          <div class="cell"><span class="v">${C.userNotes.length}</span><span class="l">${SC.cells.notes}</span><span class="s">${SC.cells.notesTail}</span></div>
        </div>
      </div>`);

    // ---- 2. the numbers: every key of the schema, "—" where the record does not carry it ----
    const GROUPS = { size: ['days', 'stories', 'entries', 'amendments', 'parked'], rounds: ['roundsDiscovery', 'roundsDesign', 'roundsPlan', 'roundsExecute'],
      findings: ['found', 'sustained', 'deferred', 'latitude', 'dismissed'], release: ['stagingRuns', 'stagingReds', 'fixes', 'rollbacks', 'hotfixes', 'watchRead', 'watchOwned'], user: ['rulings', 'tokensM'] };
    const numTables = Object.entries(GROUPS).map(([g, keys]) => `<div class="tbl-wrap cnum"><table><thead><tr><th colspan="2">${SC.numbers.groups[g]}</th></tr></thead><tbody>${keys.map(k => `<tr><td>${SC.numbers.keys[k]}</td><td class="num">${N[k] == null ? `<span class="nil">—</span>` : `<b>${esc(N[k])}</b>`}</td></tr>`).join('')}</tbody></table></div>`).join('');
    sec('cl-numbers', SC.sec.numbers, SC.numbers.lede, `<div class="cnums">${numTables}</div>`);

    // ---- 3. precision per reviewer, grouped by stage; a reviewer that sustained under a fifth of what it found is marked ----
    const STG = ['discovery', 'design', 'plan', 'execute', 'release'], LK = ['found', 'sustained', 'deferred', 'latitude', 'dismissed'];
    const P = SC.precision;
    const low = l => l.found > 0 && l.sustained / l.found < 0.2;
    const ratioCell = l => { const p = pct(l.sustained, l.found); return p == null ? '—' : low(l) ? `<span class="lowp" title="${P.low}">${p}%</span>` : `<b>${p}%</b>`; };
    const sum = ls => Object.fromEntries(LK.map(k => [k, ls.reduce((a, l) => a + l[k], 0)]));
    const precRows = STG.filter(s => C.lenses.some(l => l.stage === s)).flatMap(s => [{ cls: 'grp', cells: [{ span: 7, html: SC.stages[s] }] },
      ...C.lenses.filter(l => l.stage === s).map(l => ({ cls: low(l) ? 'low' : '', cells: [`<code>${esc(l.lens)}</code>`, ...LK.map(k => l[k]), ratioCell(l)] }))]);
    const all = sum(C.lenses);
    const lowN = C.lenses.filter(low).length;
    const prec = C.lenses.length ? tbl6([P.lens, ...LK.map(k => '#' + P[k]), '#' + P.ratio], [...precRows, { cls: 'tot', cells: [P.total, ...LK.map(k => all[k]), ratioCell({ ...all })] }], 'cprec')
      + `<p class="cnote">${lowN ? P.lowNote.replace('{n}', lowN) : P.noLow}</p>` : none6(P.none);
    sec('cl-precision', SC.sec.precision, P.lede, prec);

    // ---- 4. the retro: what worked, what went wrong, the ideas with their evidence, his notes ----
    const R = SC.retro;
    const notesOn = id => C.userNotes.filter(n => n.on === id).length;
    const noteBack = id => notesOn(id) ? `<a class="pill acc" href="#cl-note-${esc(id)}">${R.yourNote}</a>` : '';
    const worked = C.worked.length ? `<div class="list">${C.worked.map(x => `<div class="row"><span class="t">${md(x.what)}</span><span class="d">${md(x.evidence)}</span></div>`).join('')}</div>` : none6(R.noneWorked);
    const wrong = C.wrong.length ? `<div class="cards">${C.wrong.map(x => `<article class="rcard" id="cl-${esc(x.id)}">
        <div class="h"><span class="chip acc">${esc(x.id)}</span>${stageChip(x.stage)}${noteBack(x.id)}</div>
        <p class="w1">${md(x.what)}</p>
        <div class="kv"><span>${R.where}</span><span><code>${esc(x.where)}</code></span><span>${R.quote}</span><span class="quote">${esc(x.quote)}</span><span>${R.cost}</span><span>${md(x.cost)}</span></div>
      </article>`).join('')}</div>` : none6(R.noneWrong);
    const ideas = C.ideas.length ? `<div class="cards">${C.ideas.map(x => `<article class="rcard idea" id="cl-${esc(x.id)}">
        <div class="h"><span class="chip acc">${esc(x.id)}</span>${stageChip(x.stage)}<span class="pill ${x.lands === 'pipeline' ? 'acc' : 'mute'}">${R.lands[x.lands] || esc(x.lands)}</span>${noteBack(x.id)}</div>
        <p class="w1">${md(x.change)}</p>
        <div class="kv"><span>${R.why}</span><span>${md(x.why)}</span>${x.target ? `<span>${R.target}</span><span><code>${esc(x.target)}</code></span>` : ''}<span>${R.evidence}</span><span class="chipline">${x.evidence.map(idLink).join('')}</span></div>
      </article>`).join('')}</div>` : none6(R.noneIdeas);
    const seenOn = new Set();
    const notes = C.userNotes.length ? `<div class="unotes">${C.userNotes.map(n => { const anchor = seenOn.has(n.on) ? '' : ` id="cl-note-${esc(n.on)}"`; seenOn.add(n.on);
      return `<blockquote class="unote"${anchor}><span class="on">${n.on === 'general' ? R.general : R.on.replace('{id}', idLink(n.on))}</span><p>“${esc(n.words)}”</p></blockquote>`; }).join('')}</div>` : none6(R.noneNotes);
    sec('cl-retro', SC.sec.retro, R.lede, `<div class="rel-blocks">
      ${kick6(`${R.worked} · ${C.worked.length}`, worked)}
      ${kick6(`${R.wrong} · ${C.wrong.length}`, wrong)}
      ${kick6(`${R.ideas} · ${C.ideas.length}`, ideas)}
      ${kick6(`${R.notes} · ${C.userNotes.length}`, notes)}</div>`);

    // ---- 5. the sweep: done, or left for him with the command ----
    const W6 = SC.sweep;
    const swState = x => x.done ? `<span class="pill good">${W6.done}</span>` : x.left ? `<span class="pill warn">${W6.left}</span>` : `<span class="pill bad">${W6.open}</span>`;
    const sweep = C.sweep.length ? `<div class="list csweep">${C.sweep.map(x => `<div class="row${!x.done && !x.left ? ' open' : ''}"><span class="t">${md(x.what)}</span>${swState(x)}${x.command ? `<span class="d"><span class="kicker">${W6.command}</span> <code>${esc(x.command)}</code></span>` : ''}</div>`).join('')}</div>` : none6(W6.none);
    sec('cl-sweep', SC.sec.sweep, C.closed ? W6.closedLede : W6.openLede, sweep);
  }

  // ---- mount: every tab is in the DOM (mermaid renders once); the inactive ones are hidden ----
  document.getElementById('col').innerHTML = sections.map(s => s.html).join('');
  const rail = document.getElementById('rail');
  rail.innerHTML = `<div id="raillinks"></div><button class="theme" id="theme" type="button"></button>`;
  let cur = null;
  // a diagram laid out while its tab is hidden measures zero and mermaid logs NaN transforms: only the shown tab renders, once per theme
  function renderMermaid() {
    if (!window.mermaid || !document.body.dataset.themed) return;
    const r = document.documentElement;
    const mode = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    const nodes = [...document.querySelectorAll('pre.mermaid')].filter(n => !n.closest('.sec')?.hidden && n.dataset.mode !== mode);
    if (!nodes.length) return;
    nodes.forEach(n => { if (!n.dataset.src) n.dataset.src = n.textContent; n.textContent = n.dataset.src; n.removeAttribute('data-processed'); n.dataset.mode = mode; });
    mermaid.initialize({ startOnLoad: false, theme: mode === 'dark' ? 'dark' : 'neutral', securityLevel: 'loose' });
    mermaid.run({ nodes }).catch(() => {});
  }
  const show = t => {
    cur = t;
    document.querySelectorAll('.sec').forEach(el => { el.hidden = el.dataset.tab !== t; });
    document.querySelectorAll('.journey .st.has').forEach(el => el.classList.toggle('on', el.dataset.tab === t));
    const list = sections.filter(s => s.tab === t);
    document.getElementById('raillinks').innerHTML = `<div class="kicker rl">${S.stages[t]}</div>` + list.map((s, i) => `<a href="#${s.id}" data-id="${s.id}"><span>${s.title}</span><span class="n">${String(i + 1).padStart(2,'0')}</span></a>`).join('');
    renderMermaid();
  };
  const route = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (tabs.includes(h)) { show(h); window.scrollTo(0, 0); return; }
    const el = h ? document.getElementById(h) : null;
    const t = el?.closest('.sec')?.dataset.tab;
    if (!cur) show(t || tabs[tabs.length - 1]);
    else if (t && t !== cur) show(t);
    if (el) el.scrollIntoView();
  };
  route();
  window.addEventListener('hashchange', route);
  // the artboard modal: the page dims, the screen opens large; Esc, the button or the backdrop close it
  const modal = document.getElementById('modal'), frame = document.getElementById('modal-frame');
  document.getElementById('modal-close').textContent = S.modalClose || 'Fechar';
  const closeModal = () => { modal.hidden = true; frame.removeAttribute('srcdoc'); };
  document.addEventListener('click', e => { const b = e.target.closest('.artbtn'); if (b) { document.getElementById('modal-title').textContent = b.dataset.name; frame.title = b.dataset.name; frame.srcdoc = D.design.artboards[b.dataset.file]; modal.hidden = false; }
    else if (e.target === modal || e.target.closest('#modal-close')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
  // theme: system → light → dark, remembered per viewer
  const root = document.documentElement, order = ['system', 'light', 'dark'];
  let theme = 'system'; try { theme = localStorage.getItem('bp-theme') || 'system'; } catch (e) {}
  const applyTheme = () => { if (theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', theme);
    document.getElementById('theme').textContent = `${S.theme.icon[theme]} ${S.theme.label}: ${S.theme[theme]}`; document.body.dataset.themed = '1'; renderMermaid(); };
  // the host renders <pre class="mermaid"> only when it is in the static HTML; these are injected, so the page renders them itself, once per theme
  // mermaid's own startOnLoad would lay out the hidden tabs' diagrams at zero size; a tab with no diagram never reaches the initialize in renderMermaid
  if (window.mermaid) mermaid.initialize({ startOnLoad: false });
  applyTheme();
  document.getElementById('theme').addEventListener('click', () => { theme = order[(order.indexOf(theme) + 1) % order.length]; try { localStorage.setItem('bp-theme', theme); } catch (e) {} applyTheme(); });
  document.getElementById('foot').innerHTML = `<span>${S.foot.files}: ${D.files.map(f => `<code>${esc(f)}</code>`).join(' · ')}</span><span>${S.foot.built} ${esc(D.builtAt)}</span>`;
  const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) document.querySelectorAll('#raillinks a').forEach(l => l.classList.toggle('on', l.dataset.id === e.target.id)); }); }, { rootMargin: '-10% 0px -75% 0px' });
  document.querySelectorAll('.sec').forEach(s => io.observe(s));
})();
</script>
