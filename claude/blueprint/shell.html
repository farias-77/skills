<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F7F7F7; --surface: #FFFFFF; --surface-2: #EFEFEF;
    --ink: #111111; --ink-2: #444444; --ink-3: #767676;
    --line: #E2E2E2; --line-2: #CFCFCF;
    --accent: #111111; --accent-ink: #111111; --accent-bg: #EAEAEA;
    --good: #1F1F1F; --good-bg: #E6E6E6; --warn: #3A3A3A; --warn-bg: #EDEDED; --bad: #111111; --bad-bg: #DADADA;
    --mark: #E8E8E8;
    --f-display: 'Newsreader', Georgia, 'Times New Roman', serif;
    --f-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E0E0E; --surface: #171717; --surface-2: #202020;
      --ink: #F0F0F0; --ink-2: #B8B8B8; --ink-3: #8A8A8A;
      --line: #2B2B2B; --line-2: #3A3A3A;
      --accent: #F0F0F0; --accent-ink: #F0F0F0; --accent-bg: #262626;
      --good: #E6E6E6; --good-bg: #262626; --warn: #CFCFCF; --warn-bg: #222222; --bad: #FFFFFF; --bad-bg: #333333;
      --mark: #2E2E2E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E0E0E; --surface: #171717; --surface-2: #202020;
    --ink: #F0F0F0; --ink-2: #B8B8B8; --ink-3: #8A8A8A;
    --line: #2B2B2B; --line-2: #3A3A3A;
    --accent: #F0F0F0; --accent-ink: #F0F0F0; --accent-bg: #262626;
    --good: #E6E6E6; --good-bg: #262626; --warn: #CFCFCF; --warn-bg: #222222; --bad: #FFFFFF; --bad-bg: #333333;
    --mark: #2E2E2E;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  /* the page never scrolls sideways: the viewport clips, every grid/flex child may shrink,
     long tokens wrap, and only tables, figures and wireframes scroll inside their own box */
  html, body { overflow-x: clip; max-width: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.7 var(--f-body); letter-spacing: .008em; padding-inline: 16px; padding-block: 0 80px; }
  :where(.top, .page, .col, .sec, .hero, .cells, .duo, .split, .list, .faq, .smap, .story, .story .body, .row, .inf, .qa, .cell, .wf, .rev, .tools, .chips, .bad, .acs li, .fnd, .eye, details.fold, details.fold .inner) > * { min-width: 0; }
  p, li, td, th, code, .chip, .pill, .t, .d, .a, .q, .as, .wh, summary, h1, h2, h3, h4 { overflow-wrap: anywhere; }
  .pill, .cnt { white-space: normal; }
  td .pill, td .chip, td > code, th { white-space: nowrap; overflow-wrap: normal; }
  .proof code { white-space: normal; overflow-wrap: anywhere; }
  pre.mermaid { white-space: pre-wrap; overflow-wrap: anywhere; }
  img, svg, iframe, video { max-width: 100%; }
  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--f-mono); font-size: .86em; }
  code { background: var(--surface-2); border-radius: 4px; padding: 1px 5px; }
  h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 500; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
  h2 { font-size: 34px; line-height: 1.15; }
  h3 { font-size: 24px; line-height: 1.25; }
  h4 { font-size: 18px; font-family: var(--f-body); font-weight: 600; }
  p { margin: 0; }
  .kicker { font: 500 13px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  html { scroll-behavior: smooth; }

  /* ---------- top bar: identity and journey ---------- */
  .top { max-width: 1560px; margin: 0 auto; padding-block: 22px 14px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; border-bottom: 1px solid var(--line); }
  .top .brand { display: flex; flex-direction: column; gap: 2px; }
  .top .brand b { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
  .journey { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .journey .st { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 14.5px; color: var(--ink-3); border: 1px solid transparent; }
  .journey .st .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--line-2); }
  .journey .st.done { color: var(--ink-2); }
  .journey .st.done .dot { background: var(--good); }
  .journey .st.now { color: var(--accent-ink); background: var(--accent-bg); border-color: transparent; font-weight: 600; }
  .journey .st.now .dot { background: var(--accent); }
  .journey .sep { color: var(--line-2); }

  /* ---------- layout: rail + column ---------- */
  .page { max-width: 1560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: 56px; padding-top: 32px; }
  .rail { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  .rail a { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); font-size: 15.5px; border-left: 2px solid transparent; }
  .rail a .n { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
  .rail a:hover { background: var(--surface); text-decoration: none; }
  .rail a.on { color: var(--ink); background: var(--surface); border-left-color: var(--accent); }
  .rail .rl { margin: 14px 10px 6px; }
  .rail .theme { margin-top: 18px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font: 500 14px/1 var(--f-body); cursor: pointer; text-align: left; }
  .rail .theme:hover { color: var(--ink); border-color: var(--ink-3); }
  .col { min-width: 0; display: flex; flex-direction: column; gap: 72px; }
  [hidden] { display: none !important; }
  .sec { scroll-margin-top: 20px; display: flex; flex-direction: column; gap: 18px; }
  .sec > header { display: flex; flex-direction: column; gap: 6px; max-width: 90ch; }
  .sec > header .lede { font-size: 19px; color: var(--ink-2); line-height: 1.55; }
  .prose { max-width: 90ch; display: flex; flex-direction: column; gap: 12px; }
  .prose p { line-height: 1.62; }
  @media (max-width: 860px) { .page { grid-template-columns: minmax(0, 1fr); gap: 24px; } .rail { position: static; flex-direction: row; flex-wrap: wrap; } .rail .rl { display: none; } h2 { font-size: 26px; } }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .hero h1 { font-size: 34px; line-height: 1.15; font-weight: 500; max-width: 100%; text-wrap: pretty; }
  .hero .lead { font-size: 18.5px; color: var(--ink-2); max-width: 66ch; line-height: 1.55; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 15px; color: var(--ink-3); }
  .cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .cell { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; }
  .cell .v { font-family: var(--f-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
  .cell .l { font-size: 15px; color: var(--ink-2); }
  .cell .s { font-size: 13.5px; color: var(--ink-3); }
  @media (max-width: 860px) { .hero h1 { font-size: 27px; } }

  /* ---------- "needs your eye" ---------- */
  .eye { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: 12px; padding: 18px 22px; max-width: 110ch; display: flex; flex-direction: column; gap: 10px; }
  .eye ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .eye li { line-height: 1.5; }
  .eye .none { color: var(--ink-3); }

  /* ---------- two-column problem / solution ---------- */
  .duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .duo .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
  .duo .card p { color: var(--ink-2); line-height: 1.6; }

  /* ---------- figure ---------- */
  figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; overflow-x: auto; }
  figure svg { max-width: 100%; height: auto; display: block; }
  figcaption { margin-top: 12px; font-size: 15px; color: var(--ink-3); }
  pre.mermaid { background: transparent; margin: 0; }

  /* ---------- FAQ ---------- */
  .faq { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
  .qa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .qa .q { font-weight: 600; line-height: 1.4; }
  .qa .a { color: var(--ink-2); line-height: 1.55; font-size: 17px; }

  /* ---------- story map + story cards ---------- */
  .smap { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .smap .sm { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
  .smap .sm .id { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
  .smap .sm .who { color: var(--ink-3); font-size: 12px; }
  .smap a.sm:hover { border-color: var(--accent); text-decoration: none; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { font: 500 13px/1 var(--f-body); padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .story { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; scroll-margin-top: 20px; }
  .story > summary { list-style: none; cursor: pointer; padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: baseline; }
  .story > summary::-webkit-details-marker { display: none; }
  .story > summary .id { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
  .story > summary h3 { grid-column: 2; }
  .story > summary .sent { grid-column: 2; color: var(--ink-2); line-height: 1.5; }
  .story > summary .cnt { grid-column: 3; grid-row: 1 / span 2; font-size: 12.5px; color: var(--ink-3); text-align: right; }
  .story > summary .chev { display: inline-block; transition: transform .15s; }
  .story[open] > summary .chev { transform: rotate(90deg); }
  .story .body { padding: 0 20px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px 28px; border-top: 1px solid var(--line); padding-top: 16px; }
  .story .body .full { grid-column: 1 / -1; }
  .acs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .acs li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 16.5px; line-height: 1.5; }
  .acs li .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
  .acs li .kw { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent-ink); }
  .bad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .bad .bp { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
  .bad .bp .cat { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
  .bad .bp .case { font-weight: 600; }
  .bad .bp .beh { color: var(--ink-2); line-height: 1.45; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: var(--f-mono); font-size: 13px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .chip.acc { background: var(--accent-bg); color: var(--accent-ink); border-color: transparent; }
  .out { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 16px; display: flex; flex-direction: column; gap: 4px; }

  /* ---------- lists: not building, bets, inferred ---------- */
  .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .list { display: flex; flex-direction: column; gap: 8px; max-width: 120ch; }
  .row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; }
  .row .t { font-weight: 600; line-height: 1.4; }
  .row .d { grid-column: 1; color: var(--ink-2); font-size: 16px; line-height: 1.6; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.good::before { content: '✓'; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); border: 1px dashed var(--line-2); }
  .pill.warn::before { content: '?'; }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.bad::before { content: '✕'; }
  .pill.mute { background: var(--surface-2); color: var(--ink-3); }
  .pill.acc { background: var(--accent-bg); color: var(--accent-ink); }
  .inf { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 12px; }
  .inf .id { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); grid-row: 1 / span 2; }
  .inf .as { line-height: 1.5; }
  .inf .wh { grid-column: 2; font-size: 15px; color: var(--ink-3); }
  .inf.changed { border-left: 3px solid var(--accent); }

  /* ---------- wireframes ---------- */
  .wf { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .wf iframe { width: 100%; height: 560px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .empty { background: var(--surface); border: 1px dashed var(--line-2); border-radius: 12px; padding: 18px 20px; color: var(--ink-2); max-width: 72ch; line-height: 1.55; font-size: 17px; }

  /* ---------- review ---------- */
  .tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.6; }
  th { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rev { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  details.fold > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary .n { color: var(--ink-3); font-weight: 400; }
  details.fold .inner { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .fnd { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .fnd .h { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .fnd .h .id { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
  .fnd .why { color: var(--ink-2); line-height: 1.5; }
  .fnd .words { color: var(--ink); font-style: italic; }
  .quote { border-left: 3px solid var(--line-2); padding-left: 12px; color: var(--ink-2); }


  /* ---------- report layer ---------- */
  .one { font-family: var(--f-display); font-size: 28px; line-height: 1.35; max-width: 56ch; color: var(--ink); }
  .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 40px; margin-top: 6px; }
  .three .th { display: flex; flex-direction: column; gap: 6px; border-top: 2px solid var(--ink); padding-top: 12px; }
  .three .th b { font-family: var(--f-display); font-weight: 500; font-size: 23px; line-height: 1.25; }
  .three .th p { color: var(--ink-2); line-height: 1.55; font-size: 17px; }
  .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 36px; }
  .step { display: flex; flex-direction: column; gap: 6px; }
  .step .k { font-family: var(--f-display); font-size: 34px; line-height: 1; color: var(--accent); }
  .step b { font-size: 19px; }
  .step p { color: var(--ink-2); font-size: 17px; line-height: 1.55; }
  .plain { font-size: 19px; line-height: 1.7; color: var(--ink); max-width: 90ch; }
  .story2 { border-top: 1px solid var(--line); padding: 20px 0 8px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 16px; scroll-margin-top: 20px; }
  .story2 .id { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); padding-top: 5px; }
  .story2 h3 { font-size: 23px; }
  .story2 .pl { grid-column: 2; font-size: 18px; line-height: 1.55; max-width: 100ch; }
  .story2 .row2 { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14.5px; color: var(--ink-3); margin-top: 2px; }
  .story2 details { grid-column: 2; }
  .story2 details > summary { cursor: pointer; list-style: none; font-size: 15px; color: var(--accent-ink); font-weight: 600; padding: 4px 0; }
  .story2 details > summary::-webkit-details-marker { display: none; }
  .story2 details > summary::before { content: '+ '; }
  .story2 details[open] > summary::before { content: '− '; }
  .story2 .body { padding: 10px 0 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px 36px; }
  .story2 .body .full { grid-column: 1 / -1; }
  .story2 .sent { grid-column: 1 / -1; color: var(--ink-2); font-size: 16px; line-height: 1.5; }
  .dec { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .dec .k { font-family: var(--f-display); font-size: 20px; color: var(--accent); line-height: 1.2; }
  .dec .pl { font-size: 18px; line-height: 1.5; }
  .dec .src { grid-column: 2; font-size: 14px; color: var(--ink-3); }
  .chipline { display: flex; flex-wrap: wrap; gap: 6px; }
  .chipline .chip { font-family: var(--f-body); font-size: 15px; }

  /* ---------- tabs: one per stage that has data ---------- */
  .journey a.st { cursor: pointer; }
  .journey .st.has { color: var(--ink-2); border-color: var(--line); }
  .journey .st.has:hover { text-decoration: none; border-color: var(--ink-3); }
  .journey .st.on { color: var(--accent-ink); background: var(--accent-bg); border-color: transparent; font-weight: 600; }
  .journey .st.on .dot { background: var(--accent); }

  /* ---------- design tab ---------- */
  .look { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: 12px; padding: 14px 18px; max-width: 110ch; }
  .look ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .lat { margin: 0; padding-left: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; font-size: 16.5px; }
  .flow { border-top: 1px solid var(--line); padding: 18px 0 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; max-width: 120ch; scroll-margin-top: 20px; }
  .flow h3 { font-size: 23px; }
  .flow .hd { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .flow .l { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 16px; align-items: baseline; }
  .flow .l b { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .flow .l p { line-height: 1.65; color: var(--ink-2); }
  .flow .l p.first { color: var(--ink); }
  @media (max-width: 860px) { .flow .l { grid-template-columns: minmax(0, 1fr); } }
  .alarms { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 120ch; }
  .alarm { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }

  .doc { font-size: 16.5px; line-height: 1.6; max-width: 115ch; display: flex; flex-direction: column; gap: 10px; }
  .doc h1 { font-size: 26px; } .doc h2 { font-size: 22px; margin-top: 14px; } .doc h3 { font-size: 19px; margin-top: 8px; } .doc h4 { margin-top: 6px; }
  .doc pre { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 13.5px/1.5 var(--f-mono); margin: 0; }

  .dcard .opt .cost { font-size: 15px; color: var(--ink-3); }
  .dcard .opt.pick { border: 2px solid var(--ink); background: var(--accent-bg); color: var(--ink); }
  .dcard .opt.pick .k { color: var(--ink); }
  .dcard .why { text-align: center; color: var(--ink-2); font-size: 16.5px; line-height: 1.65; max-width: 90ch; margin: 0 auto; }
  /* the artboard modal */
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .72); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
  .modal .box { width: min(1520px, 100%); height: calc(100vh - 48px); background: var(--surface); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line-2); }
  .modal .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }

  /* ---------- plan tab ---------- */

  .lane .hd { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }

  .lane .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; color: var(--ink-2); }
  .lane .facts b { color: var(--ink-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
  .proof { display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; }
  .proof .pk { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-right: 6px; }
  .proof code { font-size: .84em; }
  .wave { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; max-width: 120ch; scroll-margin-top: 20px; }
  .wave .hd { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .wave .hd h3 { font-size: 23px; }
  .wave .acc { font-size: 18.5px; line-height: 1.55; }
  .wave .kv { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 8px 12px; font-size: 16px; line-height: 1.6; }
  .wave .kv > span:nth-child(odd) { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 5px; }
  .wave .walk, .walk.g { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .wave .walk li, .walk.g li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .wave .walk li .k, .walk.g li .k { font-family: var(--f-display); font-size: 20px; color: var(--accent); line-height: 1.2; }
  @media (max-width: 860px) { .wave .kv { grid-template-columns: minmax(0, 1fr); } }
  .rules { margin: 0; padding-left: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; font-size: 16.5px; }

  /* ---------- execution tab ---------- */
  /* the board again, the chips now carrying state: solid merged, outline in progress, dashed parked, + a fix row */
  .board .rc.st-merged { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .board .rc.st-merged .k, .board .rc.st-merged .k i { color: var(--bg); opacity: .8; }
  .board .rc.st-building { border-style: solid; border-width: 2px; }
  .board .rc.st-parked { border-style: dashed; opacity: .75; }
  .board .rc.st-open { opacity: .55; }
  .board .rc.fixrow { border-radius: 999px; padding: 4px 10px; }
  .board .wh .g { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; }
  .exl { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-2); }
  .exl b { color: var(--ink-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
  .walk-t td:first-child { font-family: var(--f-display); font-size: 19px; color: var(--accent); }
  .intern { display: grid; gap: 14px; }
  .intern p { color: var(--ink-2); line-height: 1.6; max-width: 90ch; }
  .rowfold { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 12px; font-size: 15.5px; }
  .rowfold .k { font-family: var(--f-mono); font-size: 13px; padding-top: 3px; }
  .rowfold ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
  .rowfold ul li b { color: var(--ink-3); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
  .aud { border-top: 1px solid var(--line); padding: 14px 0; display: flex; flex-direction: column; gap: 8px; }
  .aud .h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .aud .h b { font-size: 18px; }
  .aud .pl { font-size: 17px; line-height: 1.6; max-width: 90ch; }
  .aud .kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; font-size: 15px; color: var(--ink-2); line-height: 1.55; }
  .aud .kv > span:nth-child(odd) { color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; padding-top: 4px; }
  .aud .words { font-style: italic; color: var(--ink-2); }
  @media (max-width: 860px) { .aud .kv, .rowfold { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- release tab ---------- */
  .goalbox { border-left: 3px solid var(--ink); padding: 10px 18px; max-width: 90ch; display: flex; flex-direction: column; gap: 4px; }
  .goalbox q { font-size: 20px; line-height: 1.5; font-style: italic; quotes: '“' '”'; }
  .goalbox span { font-size: 13.5px; color: var(--ink-3); }
  .train-t tbody tr.ko td { background: var(--bad-bg); }
  .train-t td:first-child { font-family: var(--f-display); font-size: 19px; color: var(--accent); }

  .board-t tbody tr.off td { background: var(--bad-bg); }
  .board-t td:first-child { font-family: var(--f-mono); font-size: 13.5px; white-space: nowrap; }
  .num-t td:nth-child(2), .num-t td:nth-child(3) { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num-t .moved { display: block; font-size: 13.5px; color: var(--ink-3); font-weight: 400; margin-top: 2px; }

  .foot { max-width: 1560px; margin: 60px auto 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 8px 20px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
</style>

<script id="data" type="application/json">__DATA__</script>

<header class="top">
  <div class="brand"><span class="kicker" id="kick"></span><b id="title"></b></div>
  <nav class="journey" id="journey" aria-label="Estágios"></nav>
</header>

<div class="page">
  <nav class="rail" id="rail" aria-label="Seções"></nav>
  <main class="col" id="col"></main>
</div>
<footer class="foot" id="foot"></footer>
<div class="modal" id="modal" hidden><div class="box"><div class="bar"><b id="modal-title"></b><button class="btn" id="modal-close" type="button"></button></div><iframe id="modal-frame" title="" sandbox=""></iframe></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.12.0/mermaid.min.js"></script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const S = D.strings, RP = D.report;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

  document.title = D.workstream.title;
  document.getElementById('kick').textContent = `${D.workstream.slug} · ${S.stageName}`;
  document.getElementById('title').textContent = D.workstream.title;
  const stages = ['discovery','design','plan','execution','release','close'];
  const at = D.workstream.stage === 'closed' ? stages.length : stages.indexOf(D.workstream.stage);
  const tabs = D.tabs || ['discovery'];
  document.getElementById('journey').innerHTML = stages.map((k, i) => tabs.includes(k)
    ? `<a class="st has ${i < at ? 'done' : i === at ? 'now' : ''}" href="#${k}" data-tab="${k}"><span class="dot"></span>${S.stages[k]}</a>`
    : `<span class="st ${i < at ? 'done' : i === at ? 'now' : ''}"><span class="dot"></span>${S.stages[k]}</span>`).join('<span class="sep">›</span>');

  const st = D.stories, acCount = st.reduce((a, s) => a + s.acs.length, 0), badCount = st.reduce((a, s) => a + s.badPaths.length, 0);
  const sections = [];
  let TAB = 'discovery';
  const sec = (id, title, lede, body) => sections.push({ id, title, tab: TAB, html: `<section class="sec" id="${id}" data-tab="${TAB}">
    <header><span class="kicker">${String(sections.filter(x => x.tab === TAB).length + 1).padStart(2,'0')}</span><h2>${title}</h2>${lede ? `<p class="lede">${lede}</p>` : ''}</header>${body}</section>` });
  const fold = (title, inner, open) => `<details class="fold" ${open ? 'open' : ''}><summary><span>${title}</span></summary><div class="inner">${inner}</div></details>`;

  // ---- 1. what this is ----
  const eye = [];
  (D.review?.residue || []).forEach(r => eye.push(`<b>${S.eye.residue}</b> — ${md(r.title)}`));
  D.bets.filter(b => b.status !== 'holds').forEach(b => eye.push(`<b>${S.eye.bet}</b> — ${md(b.claim)}${b.note ? `: ${md(b.note)}` : ''}`));
  D.inferred.filter(i => i.ruling === 'open').forEach(i => eye.push(`<b>${S.eye.inferred}</b> ${i.id} — ${md(i.assumed)}`));
  if (D.review?.dismissed?.length) eye.push(`<b>${S.eye.dismissed}</b> — ${D.review.dismissed.length} ${S.eye.dismissedTail} <a href="#review">${S.eye.seeReview}</a>`);
  sec('what', S.sec.what, null, `
    <div class="hero">
      <h1>${md(D.headline)}</h1>
      <div class="meta"><span>${S.opened} ${D.review?.opened || ''}</span><span>${S.approved} ${D.review?.approved || '—'}</span><span>${S.slug} <code>${D.workstream.slug}</code></span></div>
      <div><span class="kicker">${S.inOneSentence}</span><p class="one">${md(RP.inOneSentence)}</p></div>
      <div><span class="kicker">${S.threeThings}</span><div class="three">${RP.threeThings.map(t => `<div class="th"><b>${md(t.t)}</b><p>${md(t.p)}</p></div>`).join('')}</div></div>
      <div class="cells">
        <div class="cell"><span class="v">${st.length}</span><span class="l">${S.cells.stories}</span><span class="s">${acCount} ${S.cells.acs} · ${badCount} ${S.cells.badPaths}</span></div>
        <div class="cell"><span class="v">${D.wireframes.length}</span><span class="l">${S.cells.screens}</span><span class="s">${D.wireframes.length ? S.cells.screensTail : S.cells.noFront}</span></div>
        <div class="cell"><span class="v">${D.notBuilding.length}</span><span class="l">${S.cells.out}</span><span class="s">${D.notBuilding.filter(x => x.kind === 'direction').length} ${S.cells.direction}</span></div>
        <div class="cell"><span class="v">${D.bets.filter(b => b.status === 'holds').length}/${D.bets.length}</span><span class="l">${S.cells.bets}</span><span class="s">${D.bets.filter(b => b.status !== 'holds').length} ${S.cells.betsOpen}</span></div>
      </div>
      <div class="eye"><span class="kicker">${S.eye.title}</span>${eye.length ? `<ul>${eye.map(e => `<li>${e}</li>`).join('')}</ul>` : `<p class="none">${S.eye.none}</p>`}</div>
    </div>`);

  // ---- 2. how it works ----
  const figures = (D.figures || []).map(f => `<figure>${f.mermaid ? `<pre class="mermaid">${esc(f.mermaid)}</pre>` : f.svg || ''}<figcaption>${md(f.caption || f.title || '')}</figcaption></figure>`).join('');
  sec('how', S.sec.how, S.howLede, `
    <div class="steps">${RP.howSteps.map((s, i) => `<div class="step"><span class="k">${i + 1}</span><b>${md(s.t)}</b><p>${md(s.p)}</p></div>`).join('')}</div>
    ${figures}
    ${fold(S.howFull, `<div class="prose"><p><b>${S.problem}.</b> ${md(D.problem)}</p><p><b>${S.solution}.</b> ${md(D.solution)}</p><p><b>${S.howItWorks}.</b> ${md(D.how)}</p></div>`, false)}`);

  // ---- 3. FAQ ----
  const qa = list => `<div class="faq">${list.map(x => `<div class="qa"><p class="q">${md(x.q)}</p><p class="a">${md(x.a)}</p></div>`).join('')}</div>`;
  const keyE = (RP.keyFaq?.external || []).map(i => D.faq.external[i]).filter(Boolean), keyI = (RP.keyFaq?.internal || []).map(i => D.faq.internal[i]).filter(Boolean);
  const restE = D.faq.external.filter((_, i) => !(RP.keyFaq?.external || []).includes(i)), restI = D.faq.internal.filter((_, i) => !(RP.keyFaq?.internal || []).includes(i));
  sec('faq', S.sec.faq, S.faqLede, `${qa([...keyE, ...keyI])}${(restE.length + restI.length) ? fold(S.faqMore.replace('{n}', restE.length + restI.length), `${qa(restE)}${restI.length ? `<div style="margin-top:10px"><span class="kicker">${S.faqInternal}</span></div>${qa(restI)}` : ''}`, false) : ''}`);

  // ---- 4. stories ----
  const kw = t => t.replace(/^(WHEN|IF|WHILE)\s/,'');
  const smap = `<div class="smap">${st.map(s => `<a class="sm" href="#${s.id}"><span class="id">${s.id}</span><span>${md(s.name)}</span><span class="who">${esc(s.as)}</span></a>`).join('')}</div>`;
  const stories = st.map(s => `<article class="story2" id="${s.id}">
    <span class="id">${s.id}</span><h3>${md(s.name)}</h3>
    <p class="pl">${md(RP.stories[s.id])}</p>
    <div class="row2"><span>${s.acs.length} ${S.story.acs}</span><span>·</span><span>${s.badPaths.length} ${S.story.bad}</span>${(s.screens||[]).length ? `<span>·</span>${s.screens.map(x => `<a class="chip acc" href="#wireframes">${esc(x.replace(/^wireframes\//,''))}</a>`).join('')}` : ''}</div>
    <details><summary>${S.storyOpen}</summary><div class="body">
      <p class="sent"><b>${S.story.as}</b> ${md(s.as)}, <b>${S.story.want}</b> ${md(s.want)}, <b>${S.story.so}</b> ${md(s.so)}</p>
      <div class="full"><h4>${S.story.criteria}</h4><ul class="acs">${s.acs.map(a => `<li><span class="n">${a.id.replace(/^.*-S-\d+-/, '')}</span><span><span class="kw">${esc(a.kind)}</span> ${md(kw(a.text))}</span></li>`).join('')}</ul></div>
      <div class="full"><h4>${S.story.badPaths}</h4><div class="bad">${s.badPaths.map(b => `<div class="bp"><span class="cat">${esc(S.badCat[b.category] || b.category)}</span><span class="case">${md(b.case)}</span><span class="beh">${md(b.behavior)}</span></div>`).join('')}</div></div>
      ${s.out.length ? `<div class="full"><h4>${S.story.out}</h4><ul class="out">${s.out.map(o => `<li>${md(o)}</li>`).join('')}</ul></div>` : ''}
    </div></details></article>`).join('');
  sec('stories', S.sec.stories, S.storiesLede.replace('{n}', st.length), `${smap}<div>${stories}</div>
    ${fold(S.vocabularyFold, `<div class="list">${D.vocabulary.map(v => `<div class="row"><span class="t">${esc(v.term)}</span><span class="d">${md(v.def)}</span></div>`).join('')}</div>`, false)}`);

  // ---- 5. out ----
  const dir = D.notBuilding.filter(x => x.kind === 'direction'), outs = D.notBuilding.filter(x => x.kind === 'out');
  sec('out', S.sec.out, null, `<p class="plain">${md(RP.outPlain)}</p>
    <div><span class="kicker">${S.out.dirTitle}</span><div class="chipline" style="margin-top:8px">${dir.map(x => `<span class="chip acc" title="${esc(x.why)}">${esc(x.what)}</span>`).join('')}</div></div>
    <div><span class="kicker">${S.out.outTitle}</span><div class="chipline" style="margin-top:8px">${outs.map(x => `<span class="chip" title="${esc(x.why)}">${esc(x.what)}</span>`).join('')}</div></div>
    ${fold(S.outFull, `<div class="list">${D.notBuilding.map(x => `<div class="row"><span class="t">${md(x.what)}</span><span class="pill ${x.kind === 'out' ? 'mute' : 'acc'}">${x.kind === 'out' ? S.out.outPill : S.out.dirPill}</span><span class="d">${md(x.why)}</span></div>`).join('')}</div>`, false)}`);

  // ---- 6. bets ----
  const PILL = { holds: ['good', S.bets.holds], 'does-not-hold': ['bad', S.bets.fails], unchecked: ['warn', S.bets.unchecked] };
  sec('bets', S.sec.bets, null, `<p class="plain">${md(RP.betsPlain)}</p><div class="list">${D.bets.map(b => { const [c, t] = PILL[b.status] || ['mute', b.status];
    return `<div class="row"><span class="t">${md(b.claim)}</span><span class="pill ${c}">${t}</span><span class="d">${S.bets.checkedBy} ${md(b.checkedBy)}${b.note ? ` — ${md(b.note)}` : ''}</span></div>`; }).join('')}</div>`);

  // ---- 7. inferred ----
  const IR = { confirmed: ['good', S.inf.confirmed], rejected: ['bad', S.inf.rejected], open: ['warn', S.inf.open], superseded: ['mute', S.inf.superseded] };
  const inf = i => { const [c, t] = IR[i.ruling] || ['mute', i.ruling]; return `<div class="inf ${i.changed ? 'changed' : ''}"><span class="id">${i.id}</span><span class="as">${md(i.assumed)}</span><span class="pill ${c}">${t}</span><span class="wh">${S.inf.landed} ${esc(i.landed)}${i.note ? ` · ${md(i.note)}` : ''}</span></div>`; };
  const ch = D.inferred.filter(i => i.changed || i.ruling === 'open' || i.ruling === 'rejected'), rest = D.inferred.filter(i => !ch.includes(i));
  sec('inferred', S.sec.inferred, null, `<p class="plain">${md(RP.inferredPlain)}</p>
    ${ch.length ? `<div><span class="kicker">${S.infChanged}</span><div class="list" style="margin-top:8px">${ch.map(inf).join('')}</div></div>` : ''}
    ${fold(S.infRest.replace('{n}', rest.length), `<div class="list">${rest.map(inf).join('')}</div>`, false)}`);

  // ---- 8. wireframes ----
  const wfs = D.wireframes.length ? D.wireframes.map(w => `<div class="wf"><div class="tools"><h3>${esc(w.screen)}</h3>${(w.stories||[]).map(s => `<a class="chip acc" href="#${s}">${s}</a>`).join('')}${(w.states||[]).map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>
    ${w.note ? `<p style="color:var(--ink-2)">${md(w.note)}</p>` : ''}<iframe title="${esc(w.screen)}" sandbox="" srcdoc="${esc(w.html)}"></iframe>${w.file ? `<span class="kicker">${esc(w.file)}</span>` : ''}</div>`).join('') : `<div class="empty">${S.wf.none}</div>`;
  sec('wireframes', S.sec.wireframes, D.wireframes.length ? S.wf.lede : null, wfs);

  // ---- 9. review ----
  const R = D.review;
  const tot = k => R.rounds.reduce((a, r) => a + (r[k] || 0), 0);
  const cells = [[R.rounds.length, S.rev.round], [tot('findings'), S.rev.findings], [(R.decisions||[]).length, S.rev.toUser], [(R.authorFixes||[]).length, S.rev.toAuthor], [(R.forDesign||[]).length, S.rev.forDesign], [(R.dismissed||[]).length, S.rev.dismissed]];
  const dec = (R.decisions || []).map(x => { const pl = RP.decisions?.[`${x.round}:${x.id}`]; return `<div class="dec"><span class="k">${x.round}</span><p class="pl">${md(pl || x.ruling)}</p><span class="src">${esc(x.id)} · ${md(x.title)}</span></div>`; }).join('');
  const fDes = x => `<div class="fnd"><div class="h"><span class="id">${esc(x.id)}</span><b>${md(x.title)}</b>${x.story ? `<a class="chip" href="#${x.story}">${x.story}</a>` : ''}</div><div class="why">${md(x.why)}</div></div>`;
  const fDis = x => `<div class="fnd"><div class="h"><span class="id">${esc(x.id)}</span><b>${md(x.title)}</b><span class="pill mute">${esc(x.lens)}</span></div><div class="why">${md(x.why)}</div></div>`;
  const fAut = x => `<div class="fnd"><div class="h"><span class="id">${esc(x.id)}</span><span>${md(x.title)}</span></div></div>`;
  const rounds = `<div class="tbl-wrap"><table><thead><tr><th>${S.rev.round}</th><th class="num">${S.rev.findings}</th><th class="num">${S.rev.toAuthor}</th><th class="num">${S.rev.toUser}</th><th class="num">${S.rev.deferred}</th><th class="num">${S.rev.dismissed}</th><th>${S.rev.unread}</th><th>${S.rev.changed}</th></tr></thead>
    <tbody>${R.rounds.map(r => `<tr><td class="num">${r.n}</td><td class="num">${r.findings}</td><td class="num">${r.toAuthor}</td><td class="num">${r.toUser}</td><td class="num">${r.deferred}</td><td class="num">${r.dismissed}</td><td>${(r.unread||[]).length ? `<span class="pill bad">${r.unread.length}</span> ${r.unread.join(', ')}` : '—'}</td><td>${md(r.changed)}</td></tr>`).join('')}</tbody></table></div>`;
  sec('review', S.sec.review, null, `<p class="plain">${md(RP.reviewPlain)}</p>
    <div class="cells">${cells.map(([v, l]) => `<div class="cell"><span class="v">${v}</span><span class="l">${l}</span></div>`).join('')}</div>
    <div><span class="kicker">${S.rev.decisions}</span><div style="margin-top:6px">${dec}</div></div>
    ${fold(S.rev.forDesign + ` · ${(R.forDesign||[]).length}`, (R.forDesign||[]).map(fDes).join('') || `<p style="color:var(--ink-3)">${S.rev.nothing}</p>`, false)}
    ${fold(S.rev.authorFixes + ` · ${(R.authorFixes||[]).length}`, (R.authorFixes||[]).map(fAut).join('') || `<p style="color:var(--ink-3)">${S.rev.nothing}</p>`, false)}
    ${fold(S.rev.dismissedList + ` · ${(R.dismissed||[]).length}`, (R.dismissed||[]).map(fDis).join('') || `<p style="color:var(--ink-3)">${S.rev.nothing}</p>`, false)}
    ${fold(S.rev.round + 's', rounds, false)}`);

  // ================= design tab (only when the stage left its data) =================
  // a small markdown renderer for the documents embedded whole behind the click
  const mdDoc = src => {
    const L = String(src || '').replace(/\r/g, '').split('\n'), out = []; let i = 0;
    const inl = t => md(t).replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
    const block = /^(#{1,4}\s|\||>|```|\s*[-*]\s|\s*\d+\.\s|<!--)/;
    while (i < L.length) {
      const l = L[i];
      if (/^```/.test(l)) { const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push(`<pre>${esc(b.join('\n'))}</pre>`); continue; }
      if (/^<!--/.test(l)) { while (i < L.length && !/-->/.test(L[i])) i++; i++; continue; }
      const h = l.match(/^(#{1,4})\s+(.*)/); if (h) { out.push(`<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`); i++; continue; }
      if (/^\|/.test(l)) { const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
        const cells = rows.filter(r => !/^\|\s*:?-/.test(r)).map(r => r.replace(/^\||\|\s*$/g, '').split(/(?<!\\)\|/).map(c => c.trim()));
        const [hd, ...bd] = cells; out.push(`<div class="tbl-wrap"><table><thead><tr>${hd.map(c => `<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${bd.map(r => `<tr>${r.map(c => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue; }
      if (/^>/.test(l)) { const b = []; while (i < L.length && /^>/.test(L[i])) b.push(L[i++].replace(/^>\s?/, '')); out.push(`<blockquote>${b.filter(x => x.trim()).map(x => `<p>${inl(x)}</p>`).join('')}</blockquote>`); continue; }
      if (/^\s*[-*]\s/.test(l)) { const b = []; while (i < L.length && /^\s*[-*]\s/.test(L[i])) b.push(L[i++].replace(/^\s*[-*]\s/, '')); out.push(`<ul>${b.map(x => `<li>${inl(x)}</li>`).join('')}</ul>`); continue; }
      if (/^\s*\d+\.\s/.test(l)) { const b = []; while (i < L.length && /^\s*\d+\.\s/.test(L[i])) b.push(L[i++].replace(/^\s*\d+\.\s/, '')); out.push(`<ol>${b.map(x => `<li>${inl(x)}</li>`).join('')}</ol>`); continue; }
      if (!l.trim()) { i++; continue; }
      const b = []; while (i < L.length && L[i].trim() && !block.test(L[i])) b.push(L[i++]); out.push(`<p>${inl(b.join(' '))}</p>`);
    }
    return out.join('');
  };

  if (D.design) {
    TAB = 'design';
    const G = D.design, SD = S.design, dd = G.docs, RD = G.report, RV = G.review || { rounds: [] }, DEC = G.decisions || [];
    const fig = f => f?.mermaid ? `<figure><pre class="mermaid">${esc(f.mermaid)}</pre><figcaption>${md(f.caption || '')}</figcaption></figure>` : (f?.svg ? `<figure>${f.svg}<figcaption>${md(f.caption || '')}</figcaption></figure>` : '');
    const intro = d => `<p class="plain">${md(d.intro)}</p>`;
    const look = d => d.worthALook?.length ? `<div class="look"><span class="kicker">${SD.look}</span><ul>${d.worthALook.map(x => `<li>${md(x)}</li>`).join('')}</ul></div>` : '';
    const latFold = d => d.latitude?.length ? fold(`${SD.latitude} · ${d.latitude.length}`, `<ul class="lat">${d.latitude.map(x => `<li>${md(x)}</li>`).join('')}</ul>`, false) : '';
    const docFold = k => G.mdDocs?.[k] ? fold(SD.docFull.replace('{f}', `01-design/${k}.md`), `<div class="doc">${mdDoc(G.mdDocs[k])}</div>`, false) : '';
    const tbl = (heads, rows, cls) => `<div class="tbl-wrap ${cls || ''}"><table><thead><tr>${heads.map(h => `<th${h.startsWith('#') ? ' class="num"' : ''}>${h.replace(/^#/, '')}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td${typeof c === 'number' ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const kick = (t, inner) => `<div><span class="kicker">${t}</span><div style="margin-top:8px">${inner}</div></div>`;
    const money = v => typeof v === 'number' ? v.toLocaleString(D.workstream.language || 'en', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : esc(v);
    const A = dd.architecture, DM = dd['data-model'], CT = dd.contracts, UI = dd.ui, SE = dd.security, IN = dd.infra, OB = dd.observability, RO = dd.rollout, CO = dd.code, AC = dd.acceptance;
    const wakes = OB.alarms.filter(x => x.wakesSomeone), against = DEC.filter(x => x.againstRecommendation), latN = Object.values(dd).reduce((a, d) => a + (d.latitude || []).length, 0), casesN = AC.groups.reduce((a, g) => a + (g.count || 0), 0);
    const env = IN.bill?.envelope || [], tot = IN.bill?.totals || [];
    // the decisions of a document, as cards: the question, the options, the pick lifted
    const letter = o => (String(o.label || '').match(/^([A-Z])\s*[)\.—–:-]/) || [])[1] || null;
    const strip = t => String(t || '').replace(/^[A-Z]\s*[)\.—–:-]\s*/, '');
    const dcard = c => {
      const opts = c.options || [], pick = c.pick || (opts.length === 1 ? letter(opts[0]) : null);
      let boxes = opts.map(o => { const L = letter(o), isPick = pick && L === pick, isRec = c.recommended && L === c.recommended;
        return `<div class="opt ${isPick ? 'pick' : ''}"><span class="k">${L ? L + ' · ' : ''}${isPick ? SD.picked : ''}${isPick && isRec ? ' · ' : ''}${isRec ? SD.recommended : ''}</span><span>${md(isPick ? strip(c.chosen) : strip(o.label))}</span>${o.cost && !isPick ? `<span class="cost">${md(o.cost)}</span>` : ''}</div>`; });
      if (!pick || !opts.some(o => letter(o) === pick)) boxes.push(`<div class="opt pick"><span class="k">${SD.picked}</span><span>${md(strip(c.chosen))}</span></div>`);
      return `<div class="dcard" id="${esc(c.id)}"><div class="meta"><span class="chip">${esc(c.id)}</span><span class="chip">${esc(SD.when[c.when] || c.when)}</span>${c.againstRecommendation ? `<span class="pill acc">${SD.againstPill}</span>` : ''}</div>
        <p class="q">${md(c.question)}</p><div class="opts">${boxes.join('')}</div>${c.why ? `<p class="why">${md(c.why)}</p>` : ''}</div>`;
    };
    const decs = k => { const L = DEC.filter(c => c.doc === k); return L.length ? kick(`${SD.decisionsOf} · ${L.length}`, `<div class="cards">${L.map(dcard).join('')}</div>`) : ''; };

    // ---- 1. what we are building ----
    sec('design-what', SD.sec.what, null, `
      <div class="hero">
        <h1>${md(RD.inOneSentence)}</h1>
        <div class="meta"><span>${S.opened} ${RV.opened || ''}</span><span>${S.approved} ${RV.approved || '—'}</span><span>${S.slug} <code>${D.workstream.slug}</code></span></div>
        ${fig(RD.figure)}
        <div><span class="kicker">${S.threeThings}</span><div class="three">${RD.threeThings.map(t => `<div class="th"><b>${md(t.t)}</b><p>${md(t.p)}</p></div>`).join('')}</div></div>
        <div class="cells">
          <div class="cell"><span class="v">${A.flows.length}</span><span class="l">${SD.cells.flows}</span><span class="s">${A.components.length} ${SD.cells.components}</span></div>
          <div class="cell"><span class="v">${wakes.length}</span><span class="l">${SD.cells.alarms}</span><span class="s">${SD.cells.alarmsTail.replace('{n}', OB.alarms.length)}</span></div>
          <div class="cell"><span class="v">${DEC.length}</span><span class="l">${SD.cells.cards}</span><span class="s">${against.length} ${SD.cells.against}</span></div>
          <div class="cell"><span class="v">${tot.length ? IN.bill.unit.replace('/mês', '').replace('/month', '') + ' ' + money(tot[0]) : '—'}</span><span class="l">${SD.cells.cost}</span><span class="s">${env.length ? SD.cells.costTail.replace('{e}', money(env[0])) : ''}</span></div>
          <div class="cell"><span class="v">${casesN}</span><span class="l">${SD.cells.cases}</span><span class="s">${AC.groups.length} ${SD.cells.groups}</span></div>
          <div class="cell"><span class="v">${latN}</span><span class="l">${SD.cells.latitude}</span><span class="s">${md(RD.latitudePlain || '')}</span></div>
        </div>
        <div class="eye"><span class="kicker">${S.eye.title}</span>${RD.needsYourEye?.length ? `<ul>${RD.needsYourEye.map(e => `<li><b>${md(e.t)}</b> — ${md(e.p)}</li>`).join('')}</ul>` : `<p class="none">${S.eye.none}</p>`}</div>
        ${RD.costPlain ? `<p class="plain">${md(RD.costPlain)}</p>` : ''}
      </div>${decs('macro')}`);

    // ---- 2. architecture ----
    sec('design-architecture', SD.sec.architecture, null, `${intro(A)}${fig(A.figure)}
      <div>${A.flows.map(f => `<article class="flow" id="flow-${esc(f.id)}"><div class="hd"><h3>${md(f.name)}</h3>${(f.stories || []).map(s => `<a class="chip acc" href="#${s}">${s}</a>`).join('')}</div>
        <div class="l"><b>${SD.happens}</b><p class="first">${md(f.happens)}</p><b>${SD.goesWrong}</b><p>${md(f.goesWrong)}</p><b>${SD.look}</b><p>${md(f.look)}</p></div></article>`).join('')}</div>
      ${kick(SD.mechanisms, tbl([SD.mech.name, SD.mech.rule, SD.mech.ifFails], A.mechanisms.map(m => [`<b>${md(m.name)}</b>`, md(m.rule), md(m.ifFails)])))}
      ${look(A)}${decs('architecture')}
      ${fold(`${SD.components} · ${A.components.length}`, tbl([SD.comp.name, SD.comp.runsWhere, SD.comp.does], A.components.map(c => [md(c.name), md(c.runsWhere), md(c.does)])), false)}
      ${A.extensions?.length ? fold(`${SD.extensions} · ${A.extensions.length}`, tbl([SD.ext.when, SD.ext.what, SD.ext.unchanged], A.extensions.map(e => [md(e.when), md(e.what), md(e.unchanged)])), false) : ''}
      ${latFold(A)}${docFold('architecture')}`);

    // ---- 3. data model ----
    sec('design-data', SD.sec.data, null, `${intro(DM)}${fig(DM.figure)}
      ${tbl([SD.ent.name, SD.ent.key, SD.ent.holds, SD.ent.retention], DM.entities.map(e => [`<b>${md(e.name)}</b>`, md(e.key), md(e.holds), md(e.retention || '—')]))}
      ${kick(SD.access, tbl([SD.acc.need, SD.acc.how], DM.access.map(a => [md(a.need), md(a.how)])))}
      ${DM.growth ? `<p class="plain">${md(DM.growth)}</p>` : ''}
      ${look(DM)}${decs('data-model')}${latFold(DM)}${docFold('data-model')}`);

    // ---- 4. contracts ----
    sec('design-contracts', SD.sec.contracts, null, `${intro(CT)}
      ${tbl([SD.ct.kind, SD.ct.name, SD.ct.caller, SD.ct.returns, SD.ct.errors], CT.endpoints.map(e => [`<span class="pill mute">${esc(SD.kinds[e.kind] || e.kind)}</span>`, `<code>${esc(e.name)}</code>`, md(e.caller), md(e.returns), md(e.errors)]))}
      ${CT.shapes ? `<p class="plain">${md(CT.shapes)}</p>` : ''}
      ${look(CT)}${decs('contracts')}${latFold(CT)}${docFold('contracts')}`);

    // ---- 5. ui ----
    const screens = UI.screens.map(w => `<div class="wf"><div class="tools"><h3>${md(w.name)}</h3>${(w.stories || []).map(s => `<a class="chip acc" href="#${s}">${s}</a>`).join('')}${(w.states || []).map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>
      <p style="color:var(--ink-2)">${md(w.whatsNew)}</p>
      ${w.file && G.artboards?.[w.file] ? `<div class="tools"><button class="btn artbtn" type="button" data-file="${esc(w.file)}" data-name="${esc(w.name)}">${SD.artboard}</button><span class="kicker">${esc(w.file)}</span></div>` : `<span class="kicker">${SD.noArtboard}</span>`}</div>`).join('');
    sec('design-ui', SD.sec.ui, null, `${intro(UI)}${fig(UI.figure)}${screens}${UI.reused ? kick(SD.reused, `<p class="plain">${md(UI.reused)}</p>`) : ''}${look(UI)}${decs('ui')}${latFold(UI)}${docFold('ui')}`);

    // ---- 6. security ----
    const VP = { covered: 'good', accepted: 'warn', 'n/a': 'mute' };
    sec('design-security', SD.sec.security, null, `${intro(SE)}
      ${tbl([SD.sweep.cls, SD.sweep.verdict, SD.sweep.how], SE.sweep.map(c => [`<b>${md(c.cls)}</b>`, `<span class="pill ${VP[c.verdict] || 'mute'}">${esc(SD.verdicts[c.verdict] || c.verdict)}</span>`, md(c.how)]))}
      ${SE.abuse?.length ? kick(SD.abuse, `<div class="list">${SE.abuse.map(a => `<div class="row"><span class="t">${md(a.path)}</span><span class="d"><b>${SD.ab.stops}.</b> ${md(a.stops)}${a.look ? ` <b>${SD.look}.</b> ${md(a.look)}` : ''}</span></div>`).join('')}</div>`) : ''}
      ${look(SE)}${decs('security')}${latFold(SE)}${docFold('security')}`);

    // ---- 7. infra ----
    const B = IN.bill;
    const billRow = (l, cls) => `<tr class="${cls}"><td>${md(l.name)}${l.obs ? `<span class="obs">${md(l.obs)}</span>` : ''}</td>${l.v.map(v => `<td class="num">${money(v)}</td>`).join('')}</tr>`;
    const bill = B ? `<div class="tbl-wrap bill"><table><thead><tr><th>${SD.billLine}</th>${B.scales.map(s => `<th class="num">${esc(s)}</th>`).join('')}</tr></thead><tbody>
      ${(B.fixed || []).length ? `<tr><td colspan="${B.scales.length + 1}"><span class="kicker">${SD.fixed}</span></td></tr>${B.fixed.map(l => billRow(l, '')).join('')}` : ''}
      ${(B.variable || []).length ? `<tr><td colspan="${B.scales.length + 1}"><span class="kicker">${SD.variable}</span></td></tr>${B.variable.map(l => billRow(l, '')).join('')}` : ''}
      <tr class="total"><td>${SD.total} (${esc(B.unit)})</td>${B.totals.map(v => `<td class="num">${money(v)}</td>`).join('')}</tr>
      <tr class="env"><td>${SD.envelope}</td>${B.envelope.map(v => `<td class="num">${money(v)}</td>`).join('')}</tr></tbody></table></div>` : '';
    sec('design-infra', SD.sec.infra, null, `${intro(IN)}
      ${tbl([SD.resources, SD.res.why, SD.res.rule], IN.resources.map(r => [`<b>${md(r.name)}</b>${r.id ? `<span class="rid">${esc(r.id)}</span>` : ''}`, md(r.why), md(r.rule || '—')]))}
      ${kick(SD.bill, `${B?.plain ? `<p class="plain" style="margin-bottom:10px">${md(B.plain)}</p>` : ''}${bill}`)}
      ${IN.wayIn ? kick(SD.wayIn, `<p class="plain">${md(IN.wayIn)}</p>`) : ''}
      ${look(IN)}${decs('infra')}${latFold(IN)}${docFold('infra')}`);

    // ---- 8. observability ----
    const alarm = a => `<div class="alarm ${a.wakesSomeone ? '' : 'quiet'}"><span class="n">${esc(a.name)}</span><div class="kv"><span>${SD.al.fires}</span><span>${md(a.firesWhen)}</span><span>${SD.al.wakes}</span><span>${a.wakesSomeone ? md(a.wakes) : `<span class="pill mute">${SD.quiet}</span>`}</span><span>${SD.al.do}</span><span>${md(a.doWhat)}</span></div></div>`;
    sec('design-observability', SD.sec.observability, null, `${intro(OB)}${fig(OB.figure)}
      <div class="alarms">${OB.alarms.map(alarm).join('')}</div>
      ${OB.watched ? kick(SD.watched, `<p class="plain">${md(OB.watched)}</p>`) : ''}
      ${look(OB)}${decs('observability')}${latFold(OB)}${docFold('observability')}`);

    // ---- 9. rollout ----
    sec('design-rollout', SD.sec.rollout, null, `${intro(RO)}
      <div class="order">${RO.order.map(o => `<div class="o"><span class="k">${esc(o.step)}</span><p>${md(o.what)}</p>${o.gate && o.gate !== '—' ? `<span class="g">${SD.gate}: ${md(o.gate)}</span>` : ''}</div>`).join('')}</div>
      <div class="duo">${RO.wayBack ? `<div class="card"><h4>${SD.wayBack}</h4><p>${md(RO.wayBack)}</p></div>` : ''}${RO.firstRun ? `<div class="card"><h4>${SD.firstRun}</h4><p>${md(RO.firstRun)}</p></div>` : ''}</div>
      ${look(RO)}${decs('rollout')}${latFold(RO)}${docFold('rollout')}`);

    // ---- 10. code ----
    sec('design-code', SD.sec.code, null, `${intro(CO)}
      <div class="duo">${CO.repos.map(r => `<div class="repo"><div class="hd"><h3><code>${esc(r.repo)}</code></h3><span class="pill ${r.isNew ? 'acc' : 'mute'}">${r.isNew ? SD.isNew : SD.existing}</span></div><p><b>${SD.changes}.</b> ${md(r.changes)}</p>${r.unchanged ? `<p><b>${SD.unchanged}.</b> ${md(r.unchanged)}</p>` : ''}${r.tree ? `<pre class="tree">${esc(r.tree)}</pre>` : ''}</div>`).join('')}</div>
      ${CO.seams ? kick(SD.seams, `<p class="plain">${md(CO.seams)}</p>`) : ''}
      ${look(CO)}${decs('code')}${latFold(CO)}${docFold('code')}`);

    // ---- 11. acceptance ----
    sec('design-acceptance', SD.sec.acceptance, null, `${intro(AC)}
      ${tbl([SD.groups.group, '#' + SD.groups.count, SD.groups.how, SD.groups.proves], AC.groups.map(g => [`<b>${md(g.group)}</b>`, g.count, `<span class="pill mute">${esc(g.how)}</span>`, md(g.proves)]))}
      ${AC.convention ? `<p class="plain">${md(AC.convention)}</p>` : ''}
      ${look(AC)}${decs('acceptance')}${latFold(AC)}${docFold('acceptance')}`);

    const DOCS = ['macro', 'architecture', 'data-model', 'contracts', 'ui', 'security', 'infra', 'observability', 'rollout', 'code', 'acceptance'];
    const cardOld = c => `<div class="card2 ${c.againstRecommendation ? 'against' : ''}" id="${esc(c.id)}"><p class="q">${md(c.question)}</p><div class="tags"><span class="chip">${esc(c.id)}</span><span class="chip">${esc(SD.when[c.when] || c.when)}</span>${c.againstRecommendation ? `<span class="pill acc">${SD.againstPill}</span>` : ''}</div>
      <p class="c"><b>${md(c.chosen)}</b></p>${c.why ? `<p class="w">${md(c.why)}</p>` : ''}
      ${(c.options || []).length ? `<details><summary>${SD.options} · ${c.options.length}</summary>${c.options.map(o => `<p class="opt">${md(o.label)}${o.cost ? ` — ${md(o.cost)}` : ''}${c.recommended && o.label.trim().startsWith(c.recommended) ? ` <span class="pill mute">${SD.recommended}</span>` : ''}</p>`).join('')}</details>` : ''}</div>`;

    // ---- 13. review ----
    const tot2 = k => RV.rounds.reduce((a, r) => a + (r[k] || 0), 0);
    const cells2 = [[RV.rounds.length, S.rev.round], [tot2('findings'), S.rev.findings], [(RV.decisions || []).length, S.rev.toUser], [(RV.conductorRulings || []).length, SD.rev.conductor], [tot2('toAuthor'), S.rev.toAuthor], [(RV.dismissed || []).length, S.rev.dismissed]];
    const dec2 = (RV.decisions || []).map(x => `<div class="dec"><span class="k">${x.round}</span><p class="pl">${md(x.plain || x.ruling)}</p><span class="src">${esc(x.id)} · ${md(x.title)}${x.words ? ` · <i>“${md(x.words)}”</i>` : ''}</span></div>`).join('');
    const fCond = x => `<div class="fnd"><div class="h"><span class="id">${esc(x.id)}</span><b>${md(x.title)}</b></div><div class="why">${md(x.ruling)}</div></div>`;
    const fDis2 = x => `<div class="fnd"><div class="h"><span class="id">${esc(x.id)}</span><b>${md(x.title)}</b><span class="pill mute">${esc(x.lens)}</span></div><div class="why">${md(x.why)}</div></div>`;
    const fRes = x => `<div class="fnd"><div class="h"><b>${md(x.title)}</b></div><div class="why">${md(x.why)}</div></div>`;
    const rounds2 = `<div class="tbl-wrap"><table><thead><tr><th>${S.rev.round}</th><th class="num">${S.rev.findings}</th><th class="num">${S.rev.toAuthor}</th><th class="num">${S.rev.toUser}</th><th class="num">${S.rev.deferred}</th><th class="num">${S.rev.dismissed}</th><th>${S.rev.unread}</th><th>${S.rev.changed}</th></tr></thead>
      <tbody>${RV.rounds.map(r => `<tr><td class="num">${r.n}</td><td class="num">${r.findings}</td><td class="num">${r.toAuthor}</td><td class="num">${r.toUser}</td><td class="num">${r.deferred}</td><td class="num">${r.dismissed}</td><td>${(r.unread || []).length ? `<span class="pill bad">${r.unread.length}</span> ${r.unread.join(', ')}` : '—'}</td><td>${md(r.changed)}</td></tr>`).join('')}</tbody></table></div>`;
    sec('design-review', SD.sec.review, null, `<p class="plain">${md(RD.reviewPlain || '')}</p>
      <div class="cells">${cells2.map(([v, l]) => `<div class="cell"><span class="v">${v}</span><span class="l">${l}</span></div>`).join('')}</div>
      ${kick(S.rev.decisions, dec2)}
      ${(RV.residue || []).length ? kick(S.eye.residue, `<div>${RV.residue.map(fRes).join('')}</div>`) : ''}
      ${fold(`${SD.rev.conductor} · ${(RV.conductorRulings || []).length}`, (RV.conductorRulings || []).map(fCond).join('') || `<p style="color:var(--ink-3)">${S.rev.nothing}</p>`, false)}
      ${fold(`${SD.rev.forPlan} · ${(RV.forPlan || []).length}`, (RV.forPlan || []).map(fRes).join('') || `<p style="color:var(--ink-3)">${S.rev.nothing}</p>`, false)}
      ${fold(`${S.rev.dismissedList} · ${(RV.dismissed || []).length}`, (RV.dismissed || []).map(fDis2).join('') || `<p style="color:var(--ink-3)">${S.rev.nothing}</p>`, false)}
      ${fold(S.rev.round + 's', rounds2, false)}`);
  }

  // ================= plan tab (only when the stage left its data) =================
  if (D.plan && D.plan.shape !== 'graph') {
    TAB = 'plan';
    const P = D.plan, SP = S.plan, Q = P.seq, RP3 = P.report, RV3 = P.review || { rounds: [] }, DEC3 = Q.decisions || [];
    const tbl3 = (heads, rows) => `<div class="tbl-wrap"><table><thead><tr>${heads.map(h => `<th${h.startsWith('#') ? ' class="num"' : ''}>${h.replace(/^#/, '')}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td${typeof c === 'number' ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const kick3 = (t, inner) => `<div><span class="kicker">${t}</span><div style="margin-top:8px">${inner}</div></div>`;
    const proof = p => p.run ? `<div class="proof"><span><span class="pk">${SP.row.run}</span><code>${esc(p.run)}</code></span><span><span class="pk">${SP.row.expect}</span>${md(p.expect)}</span></div>`
      : `<div class="proof"><span><span class="pk">${SP.row.see}</span>${md(p.see)}</span><span><span class="pk">${SP.row.where}</span>${md(p.where)}</span></div>`;
    const allRows = Q.lanes.flatMap(l => l.rows.map(r => ({ ...r, repo: l.repo })));
    const rowsN = allRows.length, casesN = Q.waves.flatMap(w => w.suites || []).reduce((a, s) => a + (s.cases || 0), 0), handed = (Q.preflight || []).filter(p => p.status === 'handed').length;
    const against3 = DEC3.filter(c => c.againstRecommendation);
    // the design's decision card, reused (same shape)
    const letter3 = o => (String(o.label || '').match(/^([A-Z])\s*[)\.—–:-]/) || [])[1] || null;
    const strip3 = t => String(t || '').replace(/^[A-Z]\s*[)\.—–:-]\s*/, '');
    const dcard3 = c => {
      const opts = c.options || [], pick = c.pick || (opts.length === 1 ? letter3(opts[0]) : null);
      let boxes = opts.map(o => { const L = letter3(o), isPick = pick && L === pick, isRec = c.recommended && L === c.recommended;
        return `<div class="opt ${isPick ? 'pick' : ''}"><span class="k">${L ? L + ' · ' : ''}${isPick ? S.design.picked : ''}${isPick && isRec ? ' · ' : ''}${isRec ? S.design.recommended : ''}</span><span>${md(isPick ? strip3(c.chosen) : strip3(o.label))}</span>${o.cost && !isPick ? `<span class="cost">${md(o.cost)}</span>` : ''}</div>`; });
      if (!pick || !opts.some(o => letter3(o) === pick)) boxes.push(`<div class="opt pick"><span class="k">${S.design.picked}</span><span>${md(strip3(c.chosen))}</span></div>`);
      return `<div class="dcard" id="${esc(c.id)}"><div class="meta"><span class="chip">${esc(c.id)}</span><span class="chip">${esc(SP.when[c.when] || c.when)}</span>${c.againstRecommendation ? `<span class="pill acc">${S.design.againstPill}</span>` : ''}</div>
        <p class="q">${md(c.question)}</p><div class="opts">${boxes.join('')}</div>${c.why ? `<p class="why">${md(c.why)}</p>` : ''}</div>`;
    };
    const decs3 = (k, title) => { const L = DEC3.filter(c => c.doc === k); return L.length ? kick3(`${title} · ${L.length}`, `<div class="cards">${L.map(dcard3).join('')}</div>`) : ''; };

    // ---- 1. what we build: the board (lanes × waves) ----
    const board = `<div class="board"><div class="grid" style="grid-template-columns: 200px repeat(${Q.waves.length}, minmax(200px, 1fr))">
      <div class="wh"><b>${SP.board.lane}</b><span>→ ${SP.board.wave}</span></div>${Q.waves.map(w => `<div class="wh"><b>${esc(w.n)} · ${md(w.name)}</b><span>${SP.board.acceptsWhen}: ${md(w.accepts)}</span></div>`).join('')}
      ${Q.lanes.map(l => `<div class="ln"><b>${esc(l.repo)}</b><span>${l.rows.length} ${SP.cells.rows} · ${esc(l.session)}</span></div>${Q.waves.map(w => { const rs = l.rows.filter(r => r.wave === w.n);
        return `<div class="cellw">${rs.length ? rs.map(r => `<a class="rc ${r.proof.see ? 'see' : ''}" href="#row-${esc(r.num)}"><span class="k">${esc(r.num)} · ${esc(r.story)}${r.par ? `<i>∥ ${esc(r.par)}</i>` : ''}${r.after ? `<i>← ${esc(r.after)}</i>` : ''}</span><span>${md(r.what)}</span></a>`).join('') : `<span class="none">${SP.board.noRows}</span>`}</div>`; }).join('')}`).join('')}
    </div><div class="leg"><span>← ${SP.lane.after}</span><span>∥ ${SP.board.par}</span><span>┅ ${SP.row.see}</span></div></div>`;
    sec('plan-what', SP.sec.what, null, `
      <div class="hero">
        <h1>${md(RP3.inOneSentence)}</h1>
        <div class="meta"><span>${S.opened} ${RV3.opened || ''}</span><span>${S.approved} ${RV3.approved || '—'}</span><span>${S.slug} <code>${D.workstream.slug}</code></span></div>
        ${board}
        <div><span class="kicker">${S.threeThings}</span><div class="three">${RP3.threeThings.map(t => `<div class="th"><b>${md(t.t)}</b><p>${md(t.p)}</p></div>`).join('')}</div></div>
        <div class="cells">
          <div class="cell"><span class="v">${Q.lanes.length}</span><span class="l">${SP.cells.lanes}</span><span class="s">${SP.cells.lanesTail}</span></div>
          <div class="cell"><span class="v">${rowsN}</span><span class="l">${SP.cells.rows}</span><span class="s">${SP.cells.rowsTail.replace('{n}', Q.lanes.length)}</span></div>
          <div class="cell"><span class="v">${Q.waves.length}</span><span class="l">${SP.cells.waves}</span><span class="s">${SP.cells.wavesTail}</span></div>
          <div class="cell"><span class="v">${casesN}</span><span class="l">${SP.cells.suites}</span><span class="s">${SP.cells.suitesTail.replace('{n}', Q.waves.flatMap(w => w.suites || []).length)}</span></div>
          <div class="cell"><span class="v">${DEC3.length}</span><span class="l">${SP.cells.cards}</span><span class="s">${against3.length} ${SP.cells.against}</span></div>
          <div class="cell"><span class="v">${(Q.preflight || []).length}</span><span class="l">${SP.cells.preflight}</span><span class="s">${SP.cells.preflightTail.replace('{n}', handed)}</span></div>
        </div>
        <div class="eye"><span class="kicker">${S.eye.title}</span>${RP3.needsYourEye?.length ? `<ul>${RP3.needsYourEye.map(e => `<li><b>${md(e.t)}</b> — ${md(e.p)}</li>`).join('')}</ul>` : `<p class="none">${S.eye.none}</p>`}</div>
      </div>${decs3('cut', SP.cutDecisions)}`);

    // ---- 2. from A to B, the frozen contracts ----
    sec('plan-ab', SP.sec.ab, null, `
      <div class="ab"><div class="card"><h4>${SP.a}</h4><p>${md(Q.fromA)}</p></div><div class="card b"><h4>${SP.b}</h4><p>${md(Q.toB)}</p></div></div>
      ${kick3(SP.contracts, `<p class="plain" style="margin-bottom:10px">${SP.contractsLede}</p>${tbl3([SP.ct.name, SP.ct.fixedIn, SP.ct.writtenBy, SP.ct.readBy], (Q.contracts || []).map(c => [`<b>${md(c.name)}</b>`, md(c.fixedIn), md(c.writtenBy), md(c.readBy)]))}`)}`);

    // ---- 3. the lanes: rows as a table, then each goal behind a click ----
    const goalBlock = (l, w) => { const g = P.goals[`${l.repo}/${w}`]; if (!g) return '';
      return fold(SP.goal.title.replace('{w}', w), `<p class="plain">${md(g.intro)}</p>
        ${tbl3([SP.row.num, SP.goal.builds, SP.goal.proof], g.rows.map(r => [`<code>${esc(r.num)}</code>`, md(r.builds), md(r.proof)]))}
        ${g.worthALook?.length ? `<div class="look"><span class="kicker">${SP.goal.look}</span><ul>${g.worthALook.map(x => `<li>${md(x)}</li>`).join('')}</ul></div>` : ''}
        ${g.workerDecides?.length ? kick3(`${SP.goal.worker} · ${g.workerDecides.length}`, `<ul class="lat">${g.workerDecides.map(x => `<li>${md(x)}</li>`).join('')}</ul>`) : ''}
        ${P.mdGoals[`${l.repo}/${w}`] ? fold(SP.goal.file.replace('{f}', g.file), `<div class="doc">${mdDoc(P.mdGoals[`${l.repo}/${w}`])}</div>`, false) : ''}`, false); };
    const lanes = Q.lanes.map(l => `<article class="lane" id="lane-${esc(l.repo)}"><div class="hd"><h3><code>${esc(l.repo)}</code></h3><span class="chip acc">${esc(l.session)}</span></div>
      <div class="facts">${l.sharesWith ? `<span><b>${SP.lane.shares}</b>${md(l.sharesWith)}</span>` : ''}<span><b>${SP.lane.preflight}</b>${(l.preflight || []).length ? l.preflight.map(md).join(' · ') : SP.lane.noPreflight}</span></div>
      ${tbl3([SP.row.num, SP.row.story, SP.row.what, SP.row.proof, SP.row.after, SP.row.wave], l.rows.map(r => [`<code id="row-${esc(r.num)}">${esc(r.num)}</code>`, `<a class="chip acc" href="#${esc(r.story)}">${esc(r.story)}</a>`, `${md(r.what)}${r.touches ? `<span class="rid">${SP.lane.touches}: ${md(r.touches)}${r.readBy ? ` · ${SP.lane.readBy}: ${md(r.readBy)}` : ''}</span>` : ''}`, proof(r.proof), r.after ? `<code>${esc(r.after)}</code>` : `<span class="pill mute">${SP.lane.seeds}</span>`, `<span class="pill acc">${esc(r.wave)}</span>${r.par ? `<span class="rid">∥ ${esc(r.par)}</span>` : ''}`]))}
      ${[...new Set(l.rows.map(r => r.wave))].map(w => goalBlock(l, w)).join('')}</article>`).join('');
    sec('plan-lanes', SP.sec.lanes, null, `<p class="plain">${md(RP3.lanesPlain)}</p><div>${lanes}</div>`);

    // ---- 4. the waves: one card each, the walk as commands ----
    const waves = Q.waves.map(w => `<article class="wave" id="${esc(w.n)}"><div class="hd"><h3>${esc(w.n)} · ${md(w.name)}</h3>${w.shadow ? `<span class="chip">${SP.wave.shadow}</span>` : ''}</div>
      <p class="acc"><b>${SP.wave.accepts}.</b> ${md(w.accepts)}</p>
      <div class="kv">
        <span>${SP.wave.requires}</span><span class="chips">${w.requires.map(n => `<a class="chip" href="#row-${esc(n)}">${esc(n)}</a>`).join('')}</span>
        <span>${SP.wave.folders}</span><span class="chips">${(w.folders || []).map(f => `<span class="chip">${esc(f)}</span>`).join('')}</span>
        <span>${SP.wave.suites}</span><span>${(w.suites || []).map(s => `<code>${esc(s.repo)}</code> · ${s.cases} ${SP.wave.cases}${s.note ? ` · ${md(s.note)}` : ''}`).join('<br>')}</span>
      </div>
      ${kick3(SP.wave.walk, `<ol class="walk">${w.walk.map((st, i) => `<li><span class="k">${i + 1}</span>${proof(st)}</li>`).join('')}</ol>`)}
      <div class="kv">${w.masterDecides ? `<span>${SP.wave.masterDecides}</span><span>${md(w.masterDecides)}</span>` : ''}${w.parks ? `<span>${SP.wave.parks}</span><span>${md(w.parks)}</span>` : ''}<span>${SP.wave.shadow}</span><span>${w.shadow ? SP.wave.shadowYes : SP.wave.shadowNo}</span></div>
      ${decs3(w.n, SP.decisionsOf)}</article>`).join('');
    sec('plan-waves', SP.sec.waves, null, `<p class="plain">${md(RP3.wavesPlain)}</p><div class="cards" style="max-width:none">${waves}</div>`);

    // ---- 5. the sessions and the pre-flight ----
    sec('plan-team', SP.sec.team, null, `<p class="plain">${md(RP3.teamPlain)}</p>
      ${tbl3([SP.team.session, SP.team.name, SP.team.model, SP.team.owns, SP.team.first], Q.team.map(t => [`<span class="pill ${t.session === 'master' ? 'acc' : 'mute'}">${esc(t.session)}</span>`, `<code>${esc(t.name)}</code><span class="rid">${esc(t.folder)}</span>`, md(t.model), md(t.owns), `<code>${esc(t.first)}</code>`]))}
      ${kick3(SP.team.rules, `<ul class="rules"><li>${SP.team.rule1}</li><li>${SP.team.rule2}</li><li>${SP.team.rule3}</li></ul>`)}
      ${kick3(SP.preflight.title, (Q.preflight || []).length ? tbl3([SP.preflight.item, SP.preflight.row, SP.preflight.status], Q.preflight.map(p => [md(p.item), `<a class="chip" href="#row-${esc(p.row)}">${esc(p.row)}</a>`, `<span class="pill ${p.status === 'handed' ? 'good' : 'bad'}">${p.status === 'handed' ? SP.preflight.handed : SP.preflight.missing}</span>`])) : `<p class="plain" style="color:var(--ink-3)">${SP.lane.noPreflight}</p>`)}`);

    // ---- 6. the review ----
    const tot3 = k => RV3.rounds.reduce((a, r) => a + (r[k] || 0), 0);
    const cells3 = [[RV3.rounds.length, S.rev.round], [tot3('findings'), S.rev.findings], [(RV3.decisions || []).length, S.rev.toUser], [(RV3.conductorRulings || []).length, SP.rev.conductor], [tot3('toAuthor'), SP.rev.toWriters], [(RV3.dismissed || []).length, S.rev.dismissed]];
    const dec3 = (RV3.decisions || []).map(x => `<div class="dec"><span class="k">${x.round}</span><p class="pl">${md(x.plain || x.ruling)}</p><span class="src">${esc(x.id)} · ${md(x.title)}${x.words ? ` · <i>“${md(x.words)}”</i>` : ''}</span></div>`).join('');
    const fCond3 = x => `<div class="fnd"><div class="h"><span class="id">${esc(x.id)}</span><b>${md(x.title)}</b></div><div class="why">${md(x.ruling)}</div></div>`;

  // ================= plan tab, graph shape: the foundation, the entries and their edges =================

    sec('plan-review', SP.sec.review, null, `<p class="plain">${md(RPG.reviewPlain || '')}</p>
      <div class="cells">${cellsG.map(([v, l]) => `<div class="cell"><span class="v">${v}</span><span class="l">${l}</span></div>`).join('')}</div>
      ${decG ? kickG(S.rev.decisions, decG) : ''}

  }

  // ================= execution tab (only when stage 4 left its data; read against the plan) =================

    sec('exec-lanes', SX.sec.lanes, null, `<p class="plain">${md(RP4.lanesPlain || '')}</p><div>${lanes4}</div>`);

  if (D.release && D.plan) {

    const train = R.train.length ? tbl5([SR.train.step, SR.train.repo, SR.train.what, SR.train.run, SR.train.expect, SR.train.got, SR.train.at, ''], R.train.map(st => ({ cls: st.ok === false ? 'ko' : '', cells: [st.step, `<code>${esc(st.repo)}</code>`, md(st.what), st.run ? `<code>${esc(st.run)}</code>` : md(st.see), md(st.expect || st.where), st.got ? `<b>${md(st.got)}</b>${st.file ? `<span class="rid">${esc(st.file)}</span>` : ''}` : `<code>${esc(st.shot)}</code>`, esc(st.at), okPill(st.ok, SR.train.ok, SR.train.ko, SR.integ.pending)] })), 'train-t') : `<p style="color:var(--ink-3)">${SR.train.none}</p>`;
