    sec('rel-versions', SR.sec.versions, null, `<p class="plain">${md(R.versionsPlain)}</p><div class="rel-blocks">${kick5(SR.sec.versions, vers)}${rb ? kick5(SR.rollback.title, rb) : ''}</div>`);

    // ---- 4. the watch, the fixes, the stops, the close ----
    const watch = R.watch.length ? tbl5([SR.watch.n, SR.watch.what, SR.watch.at, SR.watch.expect, SR.watch.got, SR.watch.readAt, ''], R.watch.map(w => ({ cls: w.ok === false ? 'ko' : '', cells: [w.n, md(w.what), esc(w.at), md(w.expect), w.got ? `<b>${md(w.got)}</b>${w.file ? `<span class="rid">${esc(w.file)}</span>` : ''}` : '—', w.readAt ? esc(w.readAt) : '—', w.owner ? `<span class="pill warn">${SR.watch.owner.replace('{o}', md(w.owner))}</span>` : okPill(w.ok, SR.watch.ok, SR.watch.ko, SR.watch.pending)] })), 'train-t') : `<p style="color:var(--ink-3)">${SR.watch.none}</p>`;
    const fixPill = st => `<span class="pill ${st === 'deployed' || st === 'merged' ? 'good' : st === 'stopped' ? 'bad' : 'acc'}">${SR.fixes.status_[st] || esc(st)}</span>`;
    const fixes = R.fixes.length ? tbl5([SR.fixes.id, SR.fixes.kind, SR.fixes.repo, SR.fixes.seen, SR.fixes.what, SR.fixes.pr, SR.fixes.tag, SR.fixes.status], R.fixes.map(f => [`<code>${esc(f.id)}</code>`, SR.fixes.kinds[f.kind] || esc(f.kind), `<code>${esc(f.repo)}</code>`, md(f.seen), md(f.what), f.pr ? link(f.pr.url, '#' + f.pr.n) : '—', f.tag ? `<code>${esc(f.tag)}</code>` : '—', fixPill(f.status)])) : `<p style="color:var(--ink-3)">${SR.fixes.none}</p>`;
    const stops = R.stops.length ? `<ul class="rules">${R.stops.map(x => `<li><b>${esc(x.at)}</b> — ${md(x.what)} · ${md(x.how)}</li>`).join('')}</ul>` : `<p style="color:var(--ink-3)">${SR.stops.none}</p>`;
    const close = R.close ? `<div class="kv" style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px"><span class="kicker">${SR.close.date}</span><span>${esc(R.close.date)}</span><span class="kicker">${SR.close.residue}</span><span>${R.close.residue.length ? `<ul class="rules">${R.close.residue.map(r => `<li>${md(r.what)} — <b>${md(r.owner)}</b></li>`).join('')}</ul>` : SR.close.none}</span></div>` : `<p style="color:var(--ink-3)">${SR.close.notYet}</p>`;
    sec('rel-watch', SR.sec.watch, null, `<p class="plain">${md(R.watchPlain)}</p><div class="rel-blocks">
      ${kick5(SR.watch.title, watch)}
      ${kick5(`${SR.fixes.title} · ${R.fixes.length}`, fixes)}
      ${kick5(SR.stops.title, stops)}
      ${kick5(SR.close.title, close)}</div>`);
  }

  if (D.close && D.release && D.release.close) {
    TAB = 'close';
    const C = D.close, SC = S.close, N = C.numbers;
    const tbl6 = (heads, rows, cls) => `<div class="tbl-wrap ${cls || ''}"><table><thead><tr>${heads.map(h => `<th${h.startsWith('#') ? ' class="num"' : ''}>${h.replace(/^#/, '')}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr${r.cls ? ` class="${r.cls}"` : ''}>${(r.cells || r).map(c => `<td${typeof c === 'number' ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const kick6 = (t, inner) => `<div><span class="kicker">${t}</span><div style="margin-top:8px">${inner}</div></div>`;
    const link6 = (url, text) => url ? `<a class="chip" href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : '—';
    const E = C.board.entries || [];
    const issued = E.filter(e => e.ruled === 'issue').length, joined = E.filter(e => e.ruled === 'join').length;
    const sweepDone = C.sweep.filter(x => x.status === 'done').length;
    const numv = v => v === null || v === undefined ? `<span style="color:var(--ink-3)">${SC.numbers.notMeasured}</span>` : esc(v);

    // ---- 1. what this demand left ----
    const prod = tbl6([SC.prod.repo, SC.prod.version, SC.prod.sha, SC.prod.deployedAt], D.release.close.prod.map(p => [`<code>${esc(p.repo)}</code>`, `<b>${esc(p.version)}</b>`, `<code>${esc(p.sha)}</code>`, esc(p.deployedAt)]));
    sec('cl-what', SC.sec.what, null, `
      <div class="hero">
        <h1>${md(C.inOneSentence)}</h1>
        <div class="meta"><span>${S.opened} ${esc(C.opened)}</span><span>${SC.close.date} ${C.closed ? esc(C.closed) : '—'}</span><span>${S.slug} <code>${D.workstream.slug}</code></span></div>
        ${kick6(SC.prod.title, prod)}
        ${C.threeThings ? `<div><span class="kicker">${S.threeThings}</span><div class="three">${C.threeThings.map(t => `<div class="th"><b>${md(t.t)}</b><p>${md(t.p)}</p></div>`).join('')}</div></div>` : ''}
        <div class="cells">
          <div class="cell"><span class="v">${numv(N.this.days)}</span><span class="l">${SC.cells.days}</span></div>
          <div class="cell"><span class="v">${E.length}</span><span class="l">${SC.cells.entries}</span></div>
          <div class="cell"><span class="v">${issued}</span><span class="l">${SC.cells.issues}</span><span class="s">${SC.cells.issuesTail.replace('{n}', joined)}</span></div>
          <div class="cell"><span class="v">${C.pendencies.length}</span><span class="l">${SC.cells.pendencies}</span></div>
          <div class="cell"><span class="v">${sweepDone}</span><span class="l">${SC.cells.sweep}</span><span class="s">${SC.cells.sweepTail.replace('{n}', C.sweep.length)}</span></div>
        </div>
        <div class="eye"><span class="kicker">${S.eye.title}</span>${C.needsYourEye?.length ? `<ul>${C.needsYourEye.map(e => `<li><b>${md(e.t)}</b> — ${md(e.p)}</li>`).join('')}</ul>` : `<p class="none">${S.eye.none}</p>`}</div>
      </div>`);

    // ---- 2. the numbers, against the previous workstream ----
    const movedOf = k => (N.moved || []).find(m => m.key === k);
    const NK = Object.keys(SC.numbers.keys);
    const numRows = NK.map(k => { const m = movedOf(k); return { cls: m ? 'q' : '', cells: [`${esc(SC.numbers.keys[k])}${m ? `<span class="moved">${md(m.why)}</span>` : ''}`, `<b>${numv(N.this[k])}</b>`, ...(N.previous ? [numv(N.previous[k])] : [])] }; });
    const numbers = tbl6([SC.numbers.key, SC.numbers.this, ...(N.previous ? [SC.numbers.previous] : [])], numRows, 'num-t board-t');
    const RATIOS = { daysPerRow: o => o.days / o.rows, foundPerRow: o => o.found / o.rows, sustainedRate: o => o.sustained / o.found, dismissedRate: o => o.dismissed / o.found, fixesPerRow: o => (o.fixPasses + o.fixRows) / o.rows, rulingsPerRow: o => o.rulings / o.rows, hotfixesPerRow: o => o.hotfixes / o.rows, entriesPerRow: o => o.entries / o.rows };
    const ratio = (o, fn) => { if (!o) return null; try { const v = fn(o); return Number.isFinite(v) ? v : null; } catch { return null; } };
    const fmt = v => v === null ? numv(null) : (Math.round(v * 100) / 100).toLocaleString(D.workstream.language || 'en');
    const ratioRows = Object.keys(SC.numbers.ratios.keys).map(k => [esc(SC.numbers.ratios.keys[k]), `<b>${fmt(ratio(N.this, RATIOS[k]))}</b>`, ...(N.previous ? [fmt(ratio(N.previous, RATIOS[k]))] : [])]);
    const ratios = `<p style="color:var(--ink-3);max-width:90ch;margin-bottom:10px">${esc(SC.numbers.ratios.disclaimer)}</p>` + tbl6([SC.numbers.key, SC.numbers.this, ...(N.previous ? [SC.numbers.previous] : [])], ratioRows, 'num-t');
    const prevLine = C.previous ? `<p style="color:var(--ink-3);margin-top:6px">${SC.numbers.previousIs.replace('{slug}', `<code>${esc(C.previous.slug)}</code>`).replace('{at}', esc(C.previous.closedAt))}</p>` : `<p style="color:var(--ink-3);margin-top:6px">${SC.numbers.none}</p>`;
    const lenses = C.lenses.length ? tbl6([SC.lenses.stage, SC.lenses.lens, '#' + SC.lenses.found, '#' + SC.lenses.sustained, '#' + SC.lenses.deferred, '#' + SC.lenses.dismissed, ''], C.lenses.map(l => ({ cls: l.dismissed > l.sustained ? 'off' : '', cells: [esc(l.stage), esc(l.lens), l.found, l.sustained, l.deferred, l.dismissed, l.dismissed > l.sustained ? `<span class="pill bad">${SC.lenses.off}</span>` : ''] })), 'board-t') : `<p style="color:var(--ink-3)">${SC.lenses.none}</p>`;
    sec('cl-numbers', SC.sec.numbers, null, `<p class="plain">${md(C.numbersPlain)}</p><div class="rel-blocks">${kick6(SC.sec.numbers, numbers + prevLine)}${kick6(SC.numbers.ratios.title, ratios)}${kick6(SC.lenses.title, lenses)}</div>`);

    // ---- 3. what did not ship, and the pendencies ----
    const cut = C.cut.length ? `<ul class="rules">${C.cut.map(x => `<li><b>${md(x.what)}</b> — ${md(x.by)}</li>`).join('')}</ul>` : `<p style="color:var(--ink-3)">${SC.cut.none}</p>`;
    const pend = C.pendencies.length ? tbl6([SC.pendencies.what, SC.pendencies.where, SC.pendencies.owner], C.pendencies.map(x => [md(x.what), `<code>${esc(x.where)}</code>`, `<b>${md(x.owner)}</b>`])) : `<p style="color:var(--ink-3)">${SC.pendencies.none}</p>`;
    sec('cl-record', SC.sec.record, null, `<div class="rel-blocks">${kick6(SC.cut.title, cut)}${kick6(`${SC.pendencies.title} · ${C.pendencies.length}`, pend)}</div>`);

    // ---- 4. the sweep ----
    const sweep = C.sweep.length ? tbl6([SC.sweep.repo, SC.sweep.what, SC.sweep.status, SC.sweep.how], C.sweep.map(x => ({ cls: x.status === 'open' ? 'q' : '', cells: [`<code>${esc(x.repo)}</code>`, md(x.what), `<span class="pill ${x.status === 'done' ? 'good' : x.status === 'open' ? 'bad' : 'acc'}">${SC.sweep[x.status]}</span>${x.at ? `<span class="rid">${esc(x.at)}</span>` : ''}`, md(x.how || '')] })), 'board-t') : `<p style="color:var(--ink-3)">${SC.sweep.none}</p>`;
    sec('cl-sweep', SC.sec.sweep, null, `<p class="plain">${md(C.sweepPlain)}</p>${sweep}`);

    // ---- 5. the board ----
    const SEC = ['user', 'pipeline', 'taste', 'venture', 'repo', 'discard'];
    const rulePill = r => r === null ? `<span class="pill warn">${SC.board.rulings.pending}</span>` : `<span class="pill ${r === 'issue' || r === 'join' ? 'good' : r === 'park' ? 'acc' : 'mute'}">${SC.board.rulings[r] || esc(r)}</span>`;
    const suggPill = sg => `<span class="pill ${sg === 'question' ? 'warn' : 'mute'}">${SC.board.rulings[sg] || esc(sg)}</span>`;
    const recur = e => { const r = e.recurrence; if (!r) return '—'; if (r.verdict === 'new') return r.inText ? `${SC.board.verdicts.new}<span class="rid">${SC.board.verdicts.held}</span>` : SC.board.verdicts.new; const base = SC.board.verdicts[r.verdict].replace('{n}', r.issue); return r.verdict === 'closed' ? `${base}<span class="rid">${r.inText ? SC.board.verdicts.held : SC.board.verdicts.gone}</span>` : base; };
    const counts = tbl6([SC.board.section, '#' + SC.board.entries, '#' + SC.board.issue, '#' + SC.board.join, '#' + SC.board.discard, '#' + SC.board.park, '#' + SC.board.pendency, '#' + SC.board.question], SEC.filter(k => E.some(e => e.section === k)).map(k => { const es = E.filter(e => e.section === k); const n = r => es.filter(e => e.ruled === r).length; return [`<b>${SC.board.sections[k]}</b>`, es.length, n('issue'), n('join'), n('discard'), n('park'), n('pendency'), es.filter(e => e.ruled === null && e.suggested === 'question').length]; }));
    const sections = SEC.filter(k => E.some(e => e.section === k)).map(k => { const es = E.filter(e => e.section === k);
      const rows = es.map(e => ({ cls: e.ruled === null && e.suggested === 'question' ? 'q' : '', cells: [`${esc(e.id)}${e.parkedFrom ? `<span class="rid">${SC.board.parkedFrom.replace('{slug}', esc(e.parkedFrom))}</span>` : ''}`, `<b>${md(e.title)}</b><span class="rid">${SC.board.stage.replace('{s}', esc(e.stage))}</span>`, md(e.seen), `${e.edit ? md(e.edit) : '—'}${e.destination ? `<span class="rid">${esc(e.destination)}</span>` : ''}`, recur(e), `${suggPill(e.suggested)} → ${rulePill(e.ruled)}${e.words ? `<span class="rid"><i>“${md(e.words)}”</i></span>` : ''}`, e.issue ? link6(e.issue.url, '#' + e.issue.n) : '—'] }));
      return kick6(`${SC.board.sections[k]} · ${es.length}`, tbl6([SC.board.id, SC.board.title, SC.board.seen, SC.board.edit, SC.board.recurrence, `${SC.board.suggested} → ${SC.board.ruled}`, SC.board.number], rows, 'board-t')); }).join('');
    sec('cl-board', SC.sec.board, null, E.length ? `<p class="plain">${md(C.boardPlain)}</p><div class="rel-blocks">${kick6(SC.sec.board, counts)}${sections}</div>` : `<p class="plain" style="color:var(--ink-3)">${SC.board.none}</p>`);

    // ---- 6. the close ----
    const closeBox = C.close ? `<div class="kv" style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px"><span class="kicker">${SC.close.date}</span><span>${esc(C.close.date)}</span><span class="kicker">${SC.close.issues}</span><span>${link6(C.close.issuesUrl, `${issued} + ${joined}`)}</span><span class="kicker">${SC.close.note}</span><span>${md(C.close.note)}</span></div>` : `<p class="plain" style="color:var(--ink-3)">${SC.close.notYet}</p>`;
    sec('cl-close', SC.sec.close, null, closeBox);
  }

  // ---- mount: every tab is in the DOM (mermaid renders once); the inactive ones are hidden ----
  document.getElementById('col').innerHTML = sections.map(s => s.html).join('');
  const rail = document.getElementById('rail');
  rail.innerHTML = `<div id="raillinks"></div><button class="theme" id="theme" type="button"></button>`;
  let cur = null;
  const show = t => {
    cur = t;
    document.querySelectorAll('.sec').forEach(el => { el.hidden = el.dataset.tab !== t; });
    document.querySelectorAll('.journey .st.has').forEach(el => el.classList.toggle('on', el.dataset.tab === t));
    const list = sections.filter(s => s.tab === t);
    document.getElementById('raillinks').innerHTML = `<div class="kicker rl">${S.stages[t]}</div>` + list.map((s, i) => `<a href="#${s.id}" data-id="${s.id}"><span>${s.title}</span><span class="n">${String(i + 1).padStart(2,'0')}</span></a>`).join('');
  };
  const route = () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (tabs.includes(h)) { show(h); window.scrollTo(0, 0); return; }
    const el = h ? document.getElementById(h) : null;
    const t = el?.closest('.sec')?.dataset.tab;
    if (!cur) show(t || tabs[tabs.length - 1]);
    else if (t && t !== cur) show(t);
    if (el) el.scrollIntoView();
  };
  route();
  window.addEventListener('hashchange', route);
  // the artboard modal: the page dims, the screen opens large; Esc, the button or the backdrop close it
  const modal = document.getElementById('modal'), frame = document.getElementById('modal-frame');
  document.getElementById('modal-close').textContent = S.modalClose || 'Fechar';
  const closeModal = () => { modal.hidden = true; frame.removeAttribute('srcdoc'); };
  document.addEventListener('click', e => { const b = e.target.closest('.artbtn'); if (b) { document.getElementById('modal-title').textContent = b.dataset.name; frame.title = b.dataset.name; frame.srcdoc = D.design.artboards[b.dataset.file]; modal.hidden = false; }
    else if (e.target === modal || e.target.closest('#modal-close')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
  // theme: system → light → dark, remembered per viewer
  const root = document.documentElement, order = ['system', 'light', 'dark'];
  let theme = 'system'; try { theme = localStorage.getItem('bp-theme') || 'system'; } catch (e) {}
  const applyTheme = () => { if (theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', theme);
    document.getElementById('theme').textContent = `${S.theme.icon[theme]} ${S.theme.label}: ${S.theme[theme]}`; renderMermaid(); };
  // the host renders <pre class="mermaid"> only when it is in the static HTML; these are injected, so the page renders them itself, once per theme
  const renderMermaid = () => {
    if (!window.mermaid) return;
    const dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const nodes = [...document.querySelectorAll('pre.mermaid')];
    nodes.forEach(n => { if (!n.dataset.src) n.dataset.src = n.textContent; n.textContent = n.dataset.src; n.removeAttribute('data-processed'); });
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'loose' });
    mermaid.run({ nodes }).catch(() => {});
  };
  applyTheme();
  document.getElementById('theme').addEventListener('click', () => { theme = order[(order.indexOf(theme) + 1) % order.length]; try { localStorage.setItem('bp-theme', theme); } catch (e) {} applyTheme(); });
  document.getElementById('foot').innerHTML = `<span>${S.foot.files}: ${D.files.map(f => `<code>${esc(f)}</code>`).join(' · ')}</span><span>${S.foot.built} ${esc(D.builtAt)}</span>`;
  const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) document.querySelectorAll('#raillinks a').forEach(l => l.classList.toggle('on', l.dataset.id === e.target.id)); }); }, { rootMargin: '-10% 0px -75% 0px' });
  document.querySelectorAll('.sec').forEach(s => io.observe(s));
})();
</script>
