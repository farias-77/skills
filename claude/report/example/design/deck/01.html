<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>The proposal in one picture</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root { --bg: #0f1115; --panel: #171a21; --ink: #f2f3f5; --mute: #9aa1ad; --accent: #7cc4fa; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; }
  .slide { width: 1920px; height: 1080px; box-sizing: border-box; padding: 120px 128px; display: flex; flex-direction: column; gap: 56px; }
  .kicker { font: 500 26px 'IBM Plex Mono', monospace; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 12px 0 0; font-size: 76px; line-height: 1.05; font-weight: 700; letter-spacing: -1.5px; }
  .flow { flex: 1; display: flex; align-items: center; gap: 0; }
  .box { flex: none; width: 360px; padding: 36px; border-radius: 18px; background: var(--panel); border: 2px solid #2a2f3a; opacity: 0; transform: translateY(24px); animation: in .6s cubic-bezier(.16,1,.3,1) forwards; }
  .box b { display: block; font-size: 44px; } .box span { font: 500 24px 'IBM Plex Mono', monospace; color: var(--mute); }
  .box.hot { border-color: var(--accent); }
  .arrow { flex: 1; height: 3px; background: var(--accent); transform-origin: left; transform: scaleX(0); animation: draw .5s ease-out forwards; }
  .b2 { animation-delay: .5s } .a2 { animation-delay: .9s } .b3 { animation-delay: 1.2s } .a1 { animation-delay: .2s }
  @keyframes in { to { opacity: 1; transform: none; } } @keyframes draw { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .box, .arrow { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="slide">
  <div><div class="kicker">Design · the proposal</div><h1>One service, one queue, one table</h1></div>
  <div class="flow">
    <div class="box"><b>API</b><span>writes the order</span></div>
    <div class="arrow a1"></div>
    <div class="box hot b2"><b>Queue</b><span>holds the charge</span></div>
    <div class="arrow a2"></div>
    <div class="box b3"><b>Worker</b><span>charges, retries 3×</span></div>
  </div>
</div>
</body>
</html>
